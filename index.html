<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>Sunny AI POS - Ultra Fast</title>
  <link rel="preconnect" href="https://api.groq.com" crossorigin>
  <link rel="dns-prefetch" href="https://api.groq.com">
  <style>
    :root {
      --bg-main:#131314;--surface:#1e1f20;--surface-variant:#282a2c;
      --text-primary:#e3e3e3;--text-secondary:#c4c7c5;--text-muted:#8e918f;
      --accent-blue:#a8c7fa;--accent-spark:#7cacf8;--input-bg:#1e1f20;
      --border-subtle:#444746;--danger-color:#f28b82;--warning-color:#fdd663;
      --success-green:#34a853;--font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0;font-family:var(--font-family);-webkit-tap-highlight-color:transparent}
    html,body{background-color:var(--bg-main);color:var(--text-primary);width:100%;height:100%;height:100dvh;overflow:hidden;position:fixed}
    body{display:flex;flex-direction:column}
    header{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:rgba(19,19,20,.95);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.06);z-index:10;position:relative}
    .brand{display:flex;align-items:center;gap:10px;font-size:1.1rem;font-weight:500}
    .gemini-spark{width:20px;height:20px;fill:url(#gemini-gradient)}
    .status-group{display:flex;align-items:center;gap:8px}
    .connection-dot{width:8px;height:8px;border-radius:50%;background:var(--success-green);box-shadow:0 0 6px var(--success-green);transition:background .3s,box-shadow .3s}
    .tag-badge{font-size:.75rem;background:var(--surface-variant);color:var(--text-secondary);padding:3px 9px;border-radius:12px;border:1px solid var(--border-subtle);font-family:monospace}
    .network-bar{position:absolute;bottom:0;left:0;width:100%;height:2px;background:transparent;overflow:hidden}
    .network-bar-fill{width:0%;height:100%;background:linear-gradient(90deg,var(--accent-spark),var(--accent-blue));transition:width .3s ease}
    .network-bar.active .network-bar-fill{width:80%;animation:pulseProgress 1.8s infinite ease-in-out}
    @keyframes pulseProgress{0%{transform:translateX(-100%);width:40%}50%{transform:translateX(50%);width:60%}100%{transform:translateX(150%);width:40%}}
    main{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px;display:flex;flex-direction:column;gap:20px;max-width:800px;width:100%;margin:0 auto;scroll-behavior:smooth}
    .message-row{display:flex;gap:12px;width:100%;contain:layout}
    .message-row.user{justify-content:flex-end}
    .avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--surface)}
    .content-block{max-width:84%;font-size:.94rem;line-height:1.55;color:var(--text-primary);white-space:pre-wrap;word-break:break-word}
    .message-row.user .content-block{background:var(--surface);padding:10px 16px;border-radius:18px;border-bottom-right-radius:4px;color:#fff;display:flex;flex-direction:column;align-items:flex-end}
    .quote-block{font-size:.82rem;color:var(--text-secondary);background:rgba(124,172,248,.1);padding:6px 10px;border-left:3px solid var(--accent-spark);border-radius:4px;margin-bottom:10px;font-style:italic;word-break:break-word}
    .msg-meta{display:flex;align-items:center;gap:6px;font-size:.7rem;color:var(--text-muted);margin-top:5px}
    .status-tick{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px}
    .mini-spinner{width:10px;height:10px;border:1.5px solid rgba(255,255,255,.2);border-top-color:var(--accent-blue);border-radius:50%;animation:spin .75s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .message-row.model .content-block{padding-top:2px}
    .shimmer-container{display:flex;flex-direction:column;gap:8px;width:220px;padding-top:6px}
    .shimmer-line{height:13px;border-radius:6px;background:linear-gradient(90deg,#1e1f20 25%,#2d2f31 50%,#1e1f20 75%);background-size:200% 100%;animation:geminiShimmer 1.4s infinite}
    .shimmer-line.short{width:55%}
    @keyframes geminiShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .interactive-card{margin-top:12px;display:flex;flex-direction:column;gap:10px}
    .actions-grid{display:flex;flex-wrap:wrap;gap:8px}
    .option-chip{background:var(--surface);border:1px solid var(--border-subtle);color:var(--text-primary);padding:8px 14px;border-radius:12px;font-size:.86rem;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .2s}
    .option-chip:hover:not(:disabled){background:var(--surface-variant);border-color:var(--accent-spark)}
    .option-chip.cancel-chip{color:var(--danger-color);border-color:rgba(242,139,130,.3)}
    .option-chip:disabled{opacity:.45;cursor:not-allowed;pointer-events:none}
    .chip-meta{font-size:.72rem;color:var(--text-muted);background:rgba(0,0,0,.3);padding:2px 6px;border-radius:6px}
    .manual-price-box{background:var(--surface);border:1px solid var(--border-subtle);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
    .manual-item-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
    .manual-item-name{font-size:.88rem;color:var(--text-secondary);flex:1}
    .manual-input{width:120px;background:#131314;border:1px solid var(--border-subtle);border-radius:8px;padding:7px 10px;color:#fff;font-size:.9rem;outline:none;text-align:right}
    .manual-input:focus{border-color:var(--accent-blue)}
    .form-btn-group{display:flex;gap:8px;margin-top:6px}
    .submit-prices-btn{background:var(--accent-blue);color:#04101d;font-weight:600;border:none;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:.86rem;flex:1}
    .cancel-form-btn{background:rgba(242,139,130,.15);color:var(--danger-color);font-weight:600;border:1px solid rgba(242,139,130,.3);padding:9px 12px;border-radius:8px;cursor:pointer;font-size:.86rem}
    .submit-prices-btn:disabled,.cancel-form-btn:disabled{opacity:.5}
    .input-wrapper{flex-shrink:0;padding:10px 16px 18px 16px;max-width:800px;width:100%;margin:0 auto}
    .input-box{background:var(--input-bg);border-radius:30px;display:flex;align-items:center;padding:5px 12px 5px 18px;border:1px solid transparent;transition:border-color .2s,background .2s}
    .input-box:focus-within{border-color:var(--border-subtle);background:#232427}
    .input-box input{flex:1;background:transparent;border:none;outline:none;color:var(--text-primary);font-size:.98rem;line-height:1.5}
    .input-box input::placeholder{color:var(--text-muted)}
    .input-box input:disabled{opacity:.5}
    .send-btn{background:transparent;border:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-muted);transition:color .2s}
    .send-btn.active{color:var(--accent-blue)}
    .send-btn:disabled{opacity:.3;cursor:not-allowed}
  </style>
</head>
<body>
  <svg style="width:0;height:0;position:absolute;" aria-hidden="true" focusable="false">
    <linearGradient id="gemini-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7cacf8"/><stop offset="50%" stop-color="#9b7bf7"/><stop offset="100%" stop-color="#d96570"/>
    </linearGradient>
  </svg>

  <header>
    <div class="brand">
      <svg class="gemini-spark" viewBox="0 0 24 24"><path d="M12 2C12 7.52285 7.52285 12 2 12C7.52285 12 12 16.4771 12 22C12 16.4771 16.4771 12 22 12C16.4771 12 12 7.52285 12 2Z"/></svg>
      Sunny AI POS
    </div>
    <div class="status-group">
      <div class="connection-dot" id="connDot" title="Live Link Active"></div>
      <div class="tag-badge" id="latencyBadge">Ready</div>
    </div>
    <div class="network-bar" id="networkBar"><div class="network-bar-fill"></div></div>
  </header>

  <main id="chatFeed">
    <div class="message-row model">
      <div class="avatar"><svg class="gemini-spark" viewBox="0 0 24 24"><path d="M12 2C12 7.52285 7.52285 12 2 12C7.52285 12 12 16.4771 12 22C12 16.4771 16.4771 12 22 12C16.4771 12 12 7.52285 12 2Z"/></svg></div>
      <div class="content-block">Salam! Sunny AI POS tayyar hai. Sale, return, report ya khata likhein. ⚡</div>
    </div>
  </main>

  <div class="input-wrapper">
    <form class="input-box" id="commandForm" onsubmit="handleFormSubmit(event)">
      <input type="text" id="userInput" placeholder="Type sale, update price, chat..." autocomplete="off"/>
      <button type="submit" id="submitBtn" class="send-btn" disabled>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </form>
  </div>

  <script>
    // ─── CONFIG ───────────────────────────────────────────────
    const FIREBASE_URL = "https://shop-pos-59971-default-rtdb.firebaseio.com";
    const GROQ_API_KEY = "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";
    const GROQ_URL     = "https://api.groq.com/openai/v1/chat/completions";
    const GROQ_MODEL   = "openai/gpt-oss-20b";

    const PRODUCT_CACHE_KEY  = "SUNNY_PRODUCTS_CACHE_V33";
    const CUSTOMER_CACHE_KEY = "SUNNY_CUSTOMERS_CACHE_V33";
    const QUEUE_KEY          = "sunny_pos_queue";
    const LAST_TXN_KEY       = "sunny_last_txn";
    const CACHE_TTL          = 900000; // 15 min

    const AVATAR_HTML = `<div class="avatar"><svg class="gemini-spark" viewBox="0 0 24 24"><path d="M12 2C12 7.52285 7.52285 12 2 12C7.52285 12 12 16.4771 12 22C12 16.4771 16.4771 12 22 12C16.4771 12 12 7.52285 12 2Z"/></svg></div>`;

    const chatFeed    = document.getElementById("chatFeed");
    const userInput   = document.getElementById("userInput");
    const submitBtn   = document.getElementById("submitBtn");
    const latencyBadge = document.getElementById("latencyBadge");
    const connDot     = document.getElementById("connDot");
    const networkBar  = document.getElementById("networkBar");

    // ─── FIREBASE ─────────────────────────────────────────────
    async function firebaseRequest(path, method="GET", data=null) {
      const url = `${FIREBASE_URL}/${path.replace(/^\/+|\/+$/g,"")}.json`;
      const opts = { method, headers:{} };
      if (data !== null) { opts.headers["Content-Type"]="application/json"; opts.body=JSON.stringify(data); }
      const r = await fetch(url, opts);
      if (!r.ok) { if (method!=="GET") throw new Error(`Firebase ${method} HTTP ${r.status}`); return null; }
      return r.json();
    }

    async function firebaseParallelGet(paths) {
      const rs = await Promise.all(paths.map(p=>fetch(`${FIREBASE_URL}/${p.replace(/^\/+|\/+$/g,"")}.json`)));
      return Promise.all(rs.map(r=>r.ok?r.json():null));
    }

    function addInc(updates, path, n) {
      n = Number(n);
      if (!isFinite(n) || n===0) return;
      const cur = updates[path];
      const base = (cur&&cur[".sv"]) ? (Number(cur[".sv"].increment)||0) : 0;
      updates[path] = {".sv":{"increment": base+n}};
    }

    // ─── CACHE ────────────────────────────────────────────────
    function readCache(key) {
      try {
        const c = localStorage.getItem(key);
        if (!c) return null;
        const p = JSON.parse(c);
        return (Date.now()-p.timestamp < CACHE_TTL) ? p.data : null;
      } catch(e){ return null; }
    }
    function writeCache(key, data) {
      try { localStorage.setItem(key, JSON.stringify({timestamp:Date.now(), data})); } catch(e){}
    }

    async function getProductsCached() {
      const cached = readCache(PRODUCT_CACHE_KEY);
      if (cached) return cached;
      const products = await firebaseRequest("Products","GET") || {};
      writeCache(PRODUCT_CACHE_KEY, products);
      return products;
    }
    async function getCustomersCached() {
      const cached = readCache(CUSTOMER_CACHE_KEY);
      if (cached) return cached;
      const customers = await firebaseRequest("Customers","GET") || {};
      writeCache(CUSTOMER_CACHE_KEY, customers);
      return customers;
    }
    async function preloadCaches() {
      try { await Promise.all([getProductsCached(), getCustomersCached()]); } catch(e){}
    }

    function patchLocalCaches(updates) {
      try {
        const pRaw = localStorage.getItem(PRODUCT_CACHE_KEY);
        const cRaw = localStorage.getItem(CUSTOMER_CACHE_KEY);
        const pCache = pRaw ? JSON.parse(pRaw) : null;
        const cCache = cRaw ? JSON.parse(cRaw) : null;
        if (!pCache && !cCache) return;
        const pData = pCache?.data, cData = cCache?.data;
        let pChanged=false, cChanged=false;

        for (const path of Object.keys(updates)) {
          const parts = path.split('/');
          if (parts[0]==='Products' && pData) {
            const k=parts[1];
            if (!pData[k]) pData[k]={};
            if (parts[2]==='Stock' && updates[path]?.['.sv']) {
              pData[k].Stock = (Number(pData[k].Stock)||0) + Number(updates[path]['.sv'].increment);
            } else if (parts[2] && typeof updates[path]!=='object') {
              pData[k][parts[2]] = updates[path];
            } else if (!parts[2]) {
              pData[k] = updates[path];
            }
            pChanged=true;
          } else if (parts[0]==='Customers' && cData) {
            const k=parts[1];
            if (!cData[k]) cData[k]={};
            if (parts[2]==='Balance' && updates[path]?.['.sv']) {
              cData[k].Balance = (Number(cData[k].Balance)||0) + Number(updates[path]['.sv'].increment);
            } else if (!parts[2]) {
              cData[k] = updates[path];
            }
            cChanged=true;
          }
        }
        if (pChanged) writeCache(PRODUCT_CACHE_KEY, pData);
        if (cChanged) writeCache(CUSTOMER_CACHE_KEY, cData);
      } catch(e){}
    }

    async function commitResult(res) {
      if (!res?.updates) return res;
      const txKey = Object.keys(res.updates).find(k=>/^Transactions\/[^/]+$/.test(k));
      if (txKey) {
        const existing = await firebaseRequest(`${txKey}/id`,"GET");
        if (existing) { delete res.updates; return {ok:true,reply:"ℹ️ Yeh entry pehle hi record ho chuki hai."}; }
      }
      await firebaseRequest("","PATCH",res.updates);
      if (txKey) {
        const t = res.updates[txKey];
        if (t && ["sale","return","payment","cash_out","expense","supplier_purchase","supplier_payment","purchase"].includes(t.type))
          localStorage.setItem(LAST_TXN_KEY, t.id);
      }
      patchLocalCaches(res.updates);
      delete res.updates;
      res.saved=true;
      return res;
    }

    // ─── AI SYSTEM PROMPT (token-optimised, intent-driven) ─────
    // NOTE: All intent understanding is done by the AI itself — no hardcoded
    // per-phrase regex here. The rules below describe MEANING/INTENT patterns
    // in any language/script/slang (Urdu, Roman Urdu, English, mixed, rough
    // spelling) so the model generalizes instead of matching fixed words.
    const SYSTEM_PROMPT = `Role:Sunny AI POS (Pakistan shopkeeper assistant). Input:Urdu script/Roman Urdu/English/slang/mixed, often misspelled. Understand INTENT not exact wording. Output:ONLY JSON,no markdown.
HARD RULE: "action" must ALWAYS be one of the ACTIONS listed below — never omit it, never invent an unlisted name, never leave a part undecided. If more than one action seems possible, pick the single most likely one(a message containing any product-like word is almost always sale) rather than refusing to decide. Only use chat when there is truly no store-related content(pure greeting/small-talk/nonsense); every chat MUST include a non-empty "reply", and if the message was too vague to act on, let that reply itself ask a short natural clarifying question in the user's own script/tone — never return an object with a missing/invalid action and no reply.
Numbers:sau=100,hazar=1000,lakh=100000,pawa/pao=0.25,adha=0.5,dhai=2.5,sawa=1.25. Digits may be spelled out, any language.
Items:{product,qty?,amount?}(amount=total Rs when price given as total not per-unit).

MULTI:1 msg can hold 2+ instructions(diff action types, or same action for diff customer/product), joined by ANY separator — word(or/aur/and/ya), symbol(+,&,/,-,newline), punctuation(,/.), or plain back-to-back/spaces. Return {parts:[cmd,...]} in spoken order. New part=action changes OR same action for new customer/subject. Multi-item sale/return for ONE customer/payment=still ONE part — split every separator(word or symbol,e.g."+") into a new items[] entry inside that SAME part, never into a new part. A number attaches only to the item right beside it; a later item in the same joined list with no number of its own simply omits qty(defaults to 1) rather than inheriting the earlier number. Single instruction→still {parts:[cmd]}.

RULE query-vs-update: asking("kitni/kya hai/batao/check karo")→stock(read-only),never *_direct. instructing+number("kr do/set karo/kr diya/X rakh do/increase by X")→matching *_direct,number in "value". "stock me X add karo"(adding)→update_stock_direct,value:X,value_mode:add. "stock X kr do"(replace)→value_mode:set/omit. No number stated→*_request(opens form),never guess.

RULE payment: no customer→cash(omit payment). customer named+no cash word(naqad/cash/nqd)→omit payment or credit(udhaar),NEVER cash. customer named+cash word→cash. Partial now+rest owed→split+paid_amount. NEVER invent a customer — only set customer for an actual proper name; word could be product or name→treat as product(omit customer).

RULE unclear words: word not matching Matches/known items→still put in items as product exactly as written(items:[{product:"<word>",qty}]),qty from msg. Never turn into customer/payment/different action just because unfamiliar — let product-lookup report not-found.

RULE bare item: message is JUST product word(s) — maybe with a qty, nothing else, no verb, no customer, no question→still action:sale,payment:cash,one items[] entry per product word/word-group(split by MULTI's separators above). A single bare product word by itself("mirinda") is already a complete sale, not chat and not "unclear" — never fall back to a generic error just because a verb or number is missing.

RULE lookalikes: Roman Urdu sometimes spells a word exactly like an unrelated English word — read it by shopkeeper context, not literal English meaning. e.g. "or"=aur(and — joins items/customers together),not the English choice-word "or"; "sub"=sab(all); "kam"=kaam(work) or kam(less) depending on context. Between two products or two customers in one sale, such a word almost always means "aur" and should join them into the same list, not split them into alternatives.

RULE chat: greetings/thanks/small-talk/general questions with no store action(e.g. "kesay ho","shukriya","acha theek hai","kya kar rahe ho")→chat. reply must be warm,natural,SHORT(1 sentence,same language/script/tone as user — Roman Urdu in, Roman Urdu out), never robotic/generic, never force it into an unrelated action just because chat has few rules.

ACTIONS(field list per action; "?"=optional):
sale:payment(cash|credit|split)?,customer?,paid_amount?,discount?,discount_percent?,items[{product,qty?,amount?}]
return:payment?,customer?,items
customer_payment:customer,amount — customer paid toward what they owe
customer_cash_out:customer,amount — shopkeeper gave cash to customer
customer_balance:customer — one customer's khata/udhaar
all_balances: — everyone's khata,no name given
supplier_balance:supplier | all_supplier_balances:
cash_balance: — register cash
list_products: | low_stock: | list_recent_transactions:
expense_add:category,amount,note?
supplier_purchase:supplier,items[{product,qty,cost}],amount?
supplier_payment:supplier,amount
report:period(daily|yesterday|weekly|monthly|yearly)
expense_report:period | product_report:product,period
stock:product — qty/price/cost of one product
update_price_direct/update_cost_direct/update_stock_direct:product,value,value_mode?(set|add)
update_price_request/update_cost_request/update_stock_request:product
void_transaction:search | undo_last:
add_to_khata:customer,items[{product,qty?}] — ONLY a raw note into khata,no price/payment mentioned; if price context exists use sale instead
chat:reply — greetings/small-talk/no store action fits (see RULE chat)

Examples(→ shows parts array shorthand, action name first):
"pepsi stock 20 kr do"→update_stock_direct,value:20(set)
"pepsi stock me 10 add kr do"→update_stock_direct,value:10,value_mode:add
"pepsi stock kitna hai"→stock(query)
"qasim ne 2 tibbet liye"→sale,customer:qasim,items:[{tibbet,2}],payment omitted(=credit,no cash word)
"qasim ne naqad 2 tibbet liye"→sale,customer:qasim,payment:cash
"qasim ka khata dikhao"→customer_balance,customer:qasim
"gallay mein kitne paise hain"→cash_balance
"qasim ne 2 dew wapis kiye or 2 pepsi 1 coke liye"→parts:[{return,customer:qasim,items:[{dew,2}]},{sale,customer:qasim,items:[{pepsi,2},{coke,1}]}]
"qasim ne 2 tibbet li aur 500 diye"→parts:[{sale,customer:qasim,payment:split,paid_amount:500,items:[{tibbet,2}]}]
"zaheer ne 2 kg ghee lia aur abad ne 3 pepsi li"→parts:[{sale,customer:zaheer,items:[{ghee,2}]},{sale,customer:abad,items:[{pepsi,3}]}]
"qasim k khate me 2 dew add kr do"→parts:[{add_to_khata,customer:qasim,items:[{dew,2}]}]
"2 stings"(unmatched word,no customer)→parts:[{sale,payment:cash,items:[{stings,2}]}]
"mirinda"(one bare product word,nothing else)→parts:[{sale,payment:cash,items:[{mirinda}]}]
"2 sprite+anda"(symbol-joined items,no customer)→parts:[{sale,payment:cash,items:[{sprite,2},{anda}]}]
"ahmed ne 2 cola or fanta li"("or"=aur here,one customer,one sale)→parts:[{sale,customer:ahmed,items:[{cola,2},{fanta}]}]
"kesay ho sunny"→chat,reply:"Mai theek hoon! Aap batayein, kya karna hai?"
"shukriya"→chat,reply:"Koi baat nahi, khushi hui madad kar ke!"`;

    const VALID_ACTIONS = new Set(["sale","return","purchase","add_stock","stock","product_search","report","product_report","chat","chat_history","customer_balance","all_balances","cash_balance","customer_payment","customer_cash_out","add_new_product_form","update_price_direct","update_cost_direct","update_stock_direct","update_stock_add","update_price_request","update_cost_request","update_stock_request","update_price","update_cost","list_products","low_stock","undo_last","expense_add","expense_report","supplier_purchase","supplier_payment","supplier_balance","all_supplier_balances","list_recent_transactions","void_transaction","add_to_khata"]);

    function normalizeCommand(cmd) {
      const fallback = {action:"chat",reply:"Maaf kijiye, samajh nahi aaya. Thora saaf likh dein?"};
      if (!cmd||typeof cmd!=="object"||Array.isArray(cmd)) return fallback;
      cmd.action = String(cmd.action||"").toLowerCase().trim();
      if (!VALID_ACTIONS.has(cmd.action)) return cmd.reply?{action:"chat",reply:String(cmd.reply)}:fallback;
      ["customer","product","supplier","category","note","search"].forEach(f=>{
        if (cmd[f]!==undefined) cmd[f]=String(cmd[f]==null?"":cmd[f]).trim();
      });
      if (!cmd.customer) delete cmd.customer;
      if (!cmd.supplier) delete cmd.supplier;
      const num = v=>{const n=Number(String(v).replace(/,/g,""));return isFinite(n)?n:undefined;};
      ["value","amount","qty","price","cost","stock","discount","discount_percent","paid_amount"].forEach(f=>{
        if (cmd[f]!==undefined){const n=num(cmd[f]);if(n===undefined)delete cmd[f];else cmd[f]=n;}
      });
      if (Array.isArray(cmd.items)) {
        cmd.items = cmd.items.slice(0,25).map(it=>{
          if (!it||typeof it!=="object") return null;
          const o={product:String(it.product||"").trim()};
          ["qty","amount","price","cost"].forEach(f=>{
            if(it[f]!==undefined){const n=num(it[f]);if(n!==undefined&&n>0)o[f]=n;}
          });
          return o.product?o:null;
        }).filter(Boolean);
      } else if (cmd.items!==undefined) delete cmd.items;
      return cmd;
    }

    // Normalizes the AI's raw reply into a flat array of individual commands.
    // Accepts {parts:[...]} (new multi-action shape), a bare single command
    // (legacy/fallback shape), or a bare array — always returns Array<cmd>.
    function normalizeParts(raw) {
      if (!raw||typeof raw!=="object") return [normalizeCommand(raw)];
      let list;
      if (Array.isArray(raw.parts)) list=raw.parts;
      else if (Array.isArray(raw)) list=raw;
      else list=[raw];
      if (!list.length) return [normalizeCommand(null)];
      return list.slice(0,10).map(normalizeCommand);
    }

    async function requestGroqParsing(message, products, customers) {
      const hints = buildContextHints(message, products, customers);
      let userContent = hints.products.length ? `Matches:${hints.products.join("|")}\n` : "";
      userContent += `Input:"${message}"`;

      const payload = {
        model: GROQ_MODEL,
        messages:[{role:"system",content:SYSTEM_PROMPT},{role:"user",content:userContent}],
        temperature:0.1,
        max_completion_tokens:320,
        reasoning_effort:"low",
        reasoning_format:"hidden", // Groq defaults to "raw", which wraps chain-of-thought
        // in <think>...</think> INSIDE message.content — that free-form reasoning
        // text (which can itself contain stray { } characters) was corrupting our
        // {-to-} JSON extraction below and causing silent fallbacks to the generic
        // "samajh nahi aaya" message. "hidden" makes Groq return ONLY the final
        // JSON in content, fixing both parsing reliability and reducing tokens
        // (hidden reasoning isn't included in the response at all).
        response_format:{type:"json_object"}, // structurally guarantees valid JSON
        // output from Groq itself (gpt-oss-20b supports this) instead of relying
        // on the model merely following the "Output:ONLY JSON" prompt instruction.
        // Groq requires reasoning_format to be "parsed" or "hidden" (not "raw")
        // whenever json_object mode is used, which is already satisfied above.
        top_p:1
      };

      for (let attempt=0; attempt<2; attempt++) {
        try {
          const r = await fetch(GROQ_URL,{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${GROQ_API_KEY}`},body:JSON.stringify(payload)});
          if (!r.ok) { await new Promise(res=>setTimeout(res,600)); continue; }
          const data = await r.json();
          if (data.usage) {
            const u=data.usage, cached=u.prompt_tokens_details?.cached_tokens||0;
            console.log(`Tokens: prompt=${u.prompt_tokens} (cached=${cached}, fresh=${u.prompt_tokens-cached}) completion=${u.completion_tokens} total=${u.total_tokens}`);
          }
          let content = (data.choices?.[0]?.message?.content)||"";
          // Defense-in-depth: even with reasoning_format:"hidden", strip any
          // stray <think>...</think> reasoning block before hunting for JSON,
          // so leftover chain-of-thought text (which can itself contain { or }
          // characters) never corrupts the brace-matching below.
          content = content.replace(/<think>[\s\S]*?<\/think>/gi,"").trim();
          content = content.replace(/^```json\s*/i,"").replace(/^```\s*/i,"").replace(/\s*```$/i,"").trim();
          // Prefer the outer {parts:[...]} object if present; fall back to a
          // bare {...} object (legacy single-command shape) if parts wasn't used.
          const arrS=content.indexOf("["), arrE=content.lastIndexOf("]");
          const objS=content.indexOf("{"), objE=content.lastIndexOf("}");
          if (objS!==-1&&objE>objS) {
            try { return JSON.parse(content.substring(objS,objE+1)); } catch(e){}
          }
          if (arrS!==-1&&arrE>arrS) {
            try { return {parts:JSON.parse(content.substring(arrS,arrE+1))}; } catch(e){}
          }
          return {action:"chat",reply:content||"Maaf kijiye, thora saaf dobara likh dein?"};
        } catch(e) {
          await new Promise(res=>setTimeout(res,600));
        }
      }
      return {action:"chat",reply:"Network busy. Please try again."};
    }

    // ─── FUZZY MATCHING ───────────────────────────────────────
    function sanitizeFirebaseKey(key) { return String(key||"").replace(/[.#$[\]\/]/g,"_").trim(); }
    function custKey(cmd) { return cmd.customer_key||sanitizeFirebaseKey(cmd.customer); }
    function supKey(cmd)  { return cmd.supplier_key ||sanitizeFirebaseKey(cmd.supplier); }
    function canonicalName(text) {
      text=String(text||"");
      try{text=decodeURIComponent(text);}catch(e){}
      return text.toLowerCase().trim().replace(/\s+/g," ");
    }
    function normMatch(text) { return canonicalName(text).replace(/[^a-z0-9]+/gi," ").replace(/\s+/g," ").trim(); }

    function levenshtein(a,b) {
      if (!a.length) return b.length; if (!b.length) return a.length;
      const m=[];
      for (let i=0;i<=a.length;i++) m[i]=[i];
      for (let j=0;j<=b.length;j++) m[0][j]=j;
      for (let i=1;i<=a.length;i++)
        for (let j=1;j<=b.length;j++) {
          const c=a[i-1]===b[j-1]?0:1;
          m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+c);
        }
      return m[a.length][b.length];
    }

    function simScore(a,b) {
      a=normMatch(a).replace(/(.)\1+/g,"$1");
      b=normMatch(b).replace(/(.)\1+/g,"$1");
      if (!a||!b) return 0; if (a===b) return 100;
      const mx=Math.max(a.length,b.length);
      return mx?Math.round((1-levenshtein(a,b)/mx)*100):100;
    }

    function buildContextHints(message, products, customers) {
      const words = normMatch(message).split(" ").filter(w=>w.length>=3&&!/^\d+$/.test(w));
      const rank = obj=>{
        const out=[];
        for (const k of Object.keys(obj||{})) {
          const name=String(obj[k]?.Name||k);
          const dbW=normMatch(name).split(" ");
          let best=0;
          words.forEach(w=>dbW.forEach(d=>{const s=simScore(w,d);if(s>best)best=s;}));
          if (best>=65) out.push({name,best});
        }
        return out.sort((a,b)=>b.best-a.best).map(x=>x.name);
      };
      return {products:rank(products).slice(0,5), customers:rank(customers).slice(0,3)};
    }

    function strongProductMatch(word, products) {
      const w=normMatch(word);
      if (!w) return false;
      return Object.keys(products||{}).some(k=>{
        const n=normMatch(products[k]?.Name||k);
        return n===w||n.split(" ").includes(w)||simScore(w,n)>=80;
      });
    }

    function findProduct(searchName, products) {
      const query=canonicalName(searchName), nQ=normMatch(searchName);
      if (!query||!nQ) return {status:"not_found"};
      const qWords=nQ.split(" ");
      const exact=[], cands=[];

      for (const k of Object.keys(products||{})) {
        const p=products[k]||{};
        const item={...p,_key:k};
        const pNorm=normMatch(p.Name||k);
        if (nQ===pNorm||query===canonicalName(p.Name||k)||k===searchName) { exact.push({product:item,score:100}); continue; }
        const dbW=pNorm.split(" ");
        let sum=0;
        qWords.forEach(qw=>{ let best=0; dbW.forEach(dw=>{const s=simScore(qw,dw);if(s>best)best=s;}); sum+=best; });
        const score=Math.round(Math.max(sum/qWords.length,simScore(nQ,pNorm)));
        if (score>=60) cands.push({product:item,score});
      }

      const toMatches=arr=>arr.slice(0,5).map(x=>({key:String(x.product._key),name:String(x.product.Name||x.product._key),price:Number(x.product.Price||0),stock:Number(x.product.Stock||0)}));
      if (exact.length===1) return {status:"found",product:exact[0].product};
      if (exact.length>1)   return {status:"multiple",matches:toMatches(exact)};
      if (!cands.length)    return {status:"not_found"};
      cands.sort((a,b)=>b.score-a.score);
      const best=cands[0];
      const eligible=cands.filter(x=>(best.score-x.score)<=10);
      if (eligible.length>1) return {status:"multiple",matches:toMatches(eligible)};
      return {status:"found",product:best.product};
    }

    function findCustomer(searchName, customers) {
      if (!searchName) return {status:"not_found"};
      const query=canonicalName(searchName);
      if (!query) return {status:"not_found"};
      const keys=Object.keys(customers||{});
      for (const k of keys) {
        if (canonicalName(customers[k].Name||k)===query)
          return {status:"found",customer:{_key:k,Name:customers[k].Name||k}};
      }
      const cands=[];
      keys.forEach(k=>{
        const cName=customers[k].Name||k, n=canonicalName(cName);
        let score=0;
        if (n===query) score=100;
        else if (n.includes(query)||query.includes(n)) score=90-Math.abs(n.length-query.length)*2;
        else score=Math.round((simScore(query,n)+simScore(query,canonicalName(k)))/2);
        if (score>=60) cands.push({customer:{_key:k,Name:cName},score});
      });
      if (!cands.length) return {status:"not_found"};
      cands.sort((a,b)=>b.score-a.score);
      const best=cands[0];
      if (best.score<65) return {status:"not_found"};
      if (best.score>=90) return {status:"found",customer:best.customer};
      const eligible=cands.filter(x=>x.score>=65&&(best.score-x.score)<=15).slice(0,4);
      return {status:"multiple",matches:eligible.map(x=>({key:String(x.customer._key),name:String(x.customer.Name)}))};
    }

    function findSupplier(searchName, suppliers) {
      if (!searchName) return {status:"not_found"};
      const query=canonicalName(searchName);
      if (!query) return {status:"not_found"};
      const keys=Object.keys(suppliers||{});
      for (const k of keys) {
        if (canonicalName(suppliers[k].Name||k)===query)
          return {status:"found",supplier:{_key:k,Name:suppliers[k].Name||k}};
      }
      const cands=[];
      keys.forEach(k=>{
        const sName=suppliers[k].Name||k, n=canonicalName(sName);
        let score=n.includes(query)||query.includes(n)?90-Math.abs(n.length-query.length)*2:Math.round((simScore(query,n)+simScore(query,canonicalName(k)))/2);
        if (score>=60) cands.push({supplier:{_key:k,Name:sName},score});
      });
      if (!cands.length) return {status:"not_found"};
      cands.sort((a,b)=>b.score-a.score);
      const best=cands[0];
      if (best.score<65) return {status:"not_found"};
      if (best.score>=90) return {status:"found",supplier:best.supplier};
      const eligible=cands.filter(x=>x.score>=65&&(best.score-x.score)<=15).slice(0,4);
      return {status:"multiple",matches:eligible.map(x=>({key:String(x.supplier._key),name:String(x.supplier.Name)}))};
    }

    function formatNumber(value) {
      const n=Number(value);if(!isFinite(n))return "0";
      if (Math.abs(n-Math.round(n))<0.000001) return String(Math.round(n));
      return n.toFixed(3).replace(/0+$/,"").replace(/\.$/,"");
    }
    function getTodayString() {
      const d=new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    }
    function getStatsBucketPaths(date) {
      const d=date||new Date();
      const daily=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
      const dC=new Date(d.getTime());dC.setHours(0,0,0,0);dC.setDate(dC.getDate()+3-(dC.getDay()+6)%7);
      const w1=new Date(dC.getFullYear(),0,4);
      const weekly=`${dC.getFullYear()}-W${("0"+(1+Math.round(((dC-w1)/86400000-3+(w1.getDay()+6)%7)/7))).slice(-2)}`;
      const monthly=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
      return {
        daily:`Stats/Daily/${daily}`,weekly:`Stats/Weekly/${weekly}`,
        monthly:`Stats/Monthly/${monthly}`,yearly:`Stats/Yearly/${d.getFullYear()}`,
        lifetime:"Stats/Lifetime/All"
      };
    }

    function addStatsDeltas(updates, transaction, reverse=false) {
      const type=transaction.type;
      if (!["sale","return","payment","cash_out","expense"].includes(type)) return;
      const ts=Number(transaction.timestamp||0);if(!ts)return;
      const dir=reverse?-1:1;
      const bases=Object.values(getStatsBucketPaths(new Date(ts)));
      const total=Number(transaction.total||0);
      const payMode=String(transaction.payment||"").toLowerCase();
      const isCredit=payMode==="credit", isSplit=payMode==="split";
      const splitPaid=isSplit?Number(transaction.paid_amount||0):0;

      if (type==="expense") {
        const amt=Number(transaction.amount||0);
        bases.forEach(base=>addInc(updates,`${base}/TotalExpense`,dir*amt));
        return;
      }
      if (type==="sale"||type==="return") {
        const sign=(type==="sale"?1:-1)*dir;
        let totalCost=0;
        const lines=(transaction.items||[]).map(item=>{
          const qty=Number(item.qty||0),cost=Number(item.cost||0);
          const revenue=Number(item.total!==undefined?item.total:qty*Number(item.price||0));
          const itemCost=qty*cost; totalCost+=itemCost;
          return {key:sanitizeFirebaseKey(canonicalName(item.product))||"unknown",name:String(item.product||"").trim(),qty,revenue,itemCost};
        });
        bases.forEach(base=>{
          addInc(updates,`${base}/TotalSales`,sign*total);
          addInc(updates,`${base}/TotalCost`,sign*totalCost);
          addInc(updates,`${base}/TotalProfit`,sign*(total-totalCost));
          if (isSplit) {
            addInc(updates,`${base}/TotalCash`,sign*splitPaid);
            addInc(updates,`${base}/TotalCredit`,sign*(total-splitPaid));
          } else {
            addInc(updates,`${base}/${isCredit?"TotalCredit":"TotalCash"}`,sign*total);
          }
          if (type==="sale") addInc(updates,`${base}/SaleCount`,dir);
          else { addInc(updates,`${base}/TotalReturns`,dir*total); addInc(updates,`${base}/ReturnCount`,dir); }
          lines.forEach(l=>{
            updates[`${base}/Products/${l.key}/Name`]=l.name;
            addInc(updates,`${base}/Products/${l.key}/Qty`,sign*l.qty);
            if (type==="sale") addInc(updates,`${base}/Products/${l.key}/TimesSold`,dir);
            addInc(updates,`${base}/Products/${l.key}/Revenue`,sign*l.revenue);
            addInc(updates,`${base}/Products/${l.key}/Cost`,sign*l.itemCost);
            addInc(updates,`${base}/Products/${l.key}/Profit`,sign*(l.revenue-l.itemCost));
          });
        });
      } else if (type==="payment") {
        bases.forEach(base=>addInc(updates,`${base}/CashIn`,dir*Number(transaction.amount||0)));
      } else if (type==="cash_out") {
        bases.forEach(base=>addInc(updates,`${base}/CashOut`,dir*Number(transaction.amount||0)));
      }
    }

    // ─── COMMAND SHORTCUTS (Zero AI tokens) ───────────────────
    // Returns an ARRAY of one or more normalized commands (multi-action support).
    // Shortcut phrases below are exact whole-message matches only (zero intent
    // guessing) purely to skip an API call for common single-intent lookups;
    // every other phrasing — including anything with multiple instructions —
    // is understood entirely by the AI, which decides the split into parts.
    async function safeUnderstandCommand(message, products) {
      const lower=message.toLowerCase().trim();
      // Daily shortcuts
      if (/^(stats|report|reports|aj ki report|aaj ki report|today report|today stats|aaj ki sale|aj ki sale|total sale|total naqad sale|total naqad sales|naqad sale|sale dikhao)$/.test(lower))
        return [{action:"report",period:"daily"}];
      if (/^(yesterday report|kal ki report|pichle din|yesterday stats|yesterday|kal|kal ki sale)$/.test(lower))
        return [{action:"report",period:"yesterday"}];
      if (/^(is month|is mahine|this month|monthly report|is month ki report|this month stats|is month ki sale)$/.test(lower))
        return [{action:"report",period:"monthly"}];
      if (/^(pichle month|last month|previous month|pichlay mahine)$/.test(lower))
        return [{action:"report",period:"previous_month"}];
      if (/^(chat history|show chat history|pichli chat|last 7 days chat|history dikhao)$/.test(lower))
        return [{action:"chat_history"}];
      if (/^(all products|list products|list items|sari items|sab saman|tamam products|products list)$/.test(lower))
        return [{action:"list_products"}];
      if (/^(low stock|kam stock|khatam hone wala saman)$/.test(lower))
        return [{action:"low_stock"}];
      if (/^(cash balance|cash|gallay mein kitne paise|gallay ka hisab|cash in hand)$/.test(lower))
        return [{action:"cash_balance"}];
      if (/^(sab khatay|kis ka kitna udhaar hai|all balances|sab ka udhaar)$/.test(lower))
        return [{action:"all_balances"}];
      if (/^(supplier ka udhaar|suppliers ka udhaar|hum par kitna udhaar hai|all supplier balances)$/.test(lower))
        return [{action:"all_supplier_balances"}];
      if (/^(recent entries|pichli entries|recent transactions|last entries dikhao|entries dikhao)$/.test(lower))
        return [{action:"list_recent_transactions"}];
      if (/^(aaj ka kharcha|is hafte ka kharcha|kharcha report|expense report|total kharcha)$/.test(lower))
        return [{action:"expense_report",period:"daily"}];
      // Single-word fast sale: only for a bare, unambiguous exact-ish product name
      // with nothing else in the message (no qty words, no customer, no payment talk).
      // Common one-word greetings/acknowledgements are excluded outright so a
      // fuzzy name-similarity match can never silently record a fake sale for
      // something like "acha"/"theek"/"ok" just because it resembles a product.
      // Anything with real phrasing goes to the AI so intent understanding stays AI-driven.
      const CASUAL_ONE_WORDERS=/^(acha|ok|okay|theek|thik|shukriya|thanks|thank|hmm|hm|haan|han|nahi|no|yes|salam|assalam|hello|hi|bye|khuda|allah|hafiz)$/;
      if (!/\s/.test(lower)&&!CASUAL_ONE_WORDERS.test(lower)&&!/^(stats|report|reports|chat|wapis|return)$/.test(lower)&&strongProductMatch(lower,products))
        return [{action:"sale",payment:"cash",items:[{product:message.trim(),qty:1}]}];
      // NOTE: intentionally no other shortcut-guessing here. All multi-word,
      // slang, mixed-language, or rough-phrasing commands — single or multi-part — are parsed by the AI.

      const customers = await getCustomersCached();
      return normalizeParts(await requestGroqParsing(message, products, customers));
    }

    // ─── BUSINESS LOGIC ───────────────────────────────────────
    function processListProducts(products) {
      const keys=Object.keys(products||{});
      if (!keys.length) return {ok:true,reply:"📭 Firebase mein koi products nahi mile."};
      let reply="📦 All Products Catalog:\n\n";
      keys.forEach((k,i)=>{
        const p=products[k];
        reply+=`${i+1}. ${p.Name||k}\n   Price:Rs ${formatNumber(p.Price||0)} | Stock:${formatNumber(p.Stock||0)} ${p.Unit||"pcs"} | Cost:Rs ${formatNumber(p.Cost||0)}\n\n`;
      });
      return {ok:true,reply:reply.trim()};
    }
    function processLowStock(products) {
      const low=Object.keys(products||{}).filter(k=>Number(products[k].Stock||0)<=5);
      if (!low.length) return {ok:true,reply:"✅ Sab products ka stock theek hai."};
      let reply="⚠️ Low Stock (Stock ≤5):\n\n";
      low.forEach((k,i)=>{const p=products[k];reply+=`${i+1}. ${p.Name||k} — ${formatNumber(p.Stock||0)} ${p.Unit||"pcs"}\n`;});
      return {ok:true,reply:reply.trim()};
    }
    function processStock(command, products) {
      let p = products[command.product] ? {...products[command.product],_key:command.product} : null;
      if (!p) {
        const m=findProduct(command.product,products);
        if (m.status==="not_found") return {ok:false,reply:`❌ Product nahi mila: ${command.product}`};
        if (m.status==="multiple") return {ok:true,type:"need_clarification",reply:`⚠️ "${command.product}" ke liye ek se zyada products match huay. Sahi product select karein:`,options:m.matches,pending_context:command};
        p=m.product;
      }
      return {ok:true,reply:`📦 ${p.Name||p._key}\nStock:${formatNumber(p.Stock||0)} ${p.Unit||"pcs"}\nSale Price:Rs ${formatNumber(p.Price||0)}\nCost:Rs ${formatNumber(p.Cost||0)}`};
    }

    async function processSale(command, products) {
      const items=command.items||[];
      if (!items.length) return {ok:false,reply:"❌ Product aur quantity batayein."};
      const customer=command.customer?String(command.customer).trim():"";
      const rawPay=String(command.payment||"").toLowerCase().trim();
      const saysSplit=rawPay==="split"||rawPay==="partial"||(command.paid_amount!==undefined&&customer);
      const saysCash=rawPay==="cash"||rawPay==="naqad"||/\b(naqad|cash|nqd)\b/i.test(command.user_text||"");
      let payment="cash";
      if (saysSplit) { if (!customer) return {ok:false,reply:"❌ Split payment ke liye customer ka naam batayein."}; payment="split"; }
      else if (customer) {
        // Customer named: default is credit (udhaar) unless an explicit cash word is present.
        // This holds even if the AI mistakenly sent payment:"cash" without cash wording in the
        // original text, so a named customer never silently becomes a cash sale.
        payment=saysCash?"cash":"credit";
      }
      else if (rawPay==="credit"||rawPay==="udhaar") return {ok:false,reply:"❌ Udhaar ke liye customer ka naam batayein."};

      const missing=[];
      for (let i=0;i<items.length;i++) {
        const itm=items[i];
        if (itm.is_misc||itm._resolvedProduct) continue;
        const m=findProduct(itm.product,products);
        if (m.status==="not_found") missing.push({index:i,product:itm.product,qty:itm.qty||1,amount:itm.amount||null});
        else if (m.status==="multiple") return {ok:true,type:"need_clarification",reply:`⚠️ "${itm.product}" ke liye ek se zyada products match huay. Sahi product select karein:`,options:m.matches,pending_context:{action:"sale",customer,payment,target_index:i,items}};
      }
      if (missing.length) return {ok:true,type:"need_missing_resolution",reply:`⚠️ Yeh products database mein nahi mile:\n👉 ${missing.map(m=>`"${m.product}"`).join(", ")}\n\nSkip karke baqi bechna hai, ya unlisted price lagani hai?`,missing_items:missing,pending_context:{action:"sale",customer,payment,items}};

      const updates={}, txItems=[], stockUsed={};
      let total=0;

      for (const item of items) {
        if (item.is_misc) {
          const amt=Number(item.amount||item.price||item.qty||0);
          if (amt>0){total+=amt;txItems.push({product:item.product||"Khula Misc",qty:1,price:amt,cost:0,total:amt,is_misc:true});}
          continue;
        }
        const p=item._resolvedProduct||findProduct(item.product,products).product;
        const price=Number(p.Price||0);
        if (price<=0) return {ok:false,reply:`❌ ${p.Name||p._key} ka sale price set nahi hai.`};
        let saleTotal=0,finalQty=0;
        if (item.amount>0){saleTotal=Number(item.amount);finalQty=saleTotal/price;}
        else if(item.qty>0){finalQty=Number(item.qty);saleTotal=finalQty*price;}
        else{finalQty=1;saleTotal=price;}
        const curStock=Number(p.Stock||0), already=stockUsed[p._key]||0;
        if (finalQty+already>curStock+0.001) return {ok:false,reply:`❌ ${p.Name||p._key} ka stock sirf ${formatNumber(curStock)} hai.`};
        stockUsed[p._key]=already+finalQty;
        addInc(updates,`Products/${sanitizeFirebaseKey(p._key)}/Stock`,-finalQty);
        total+=saleTotal;
        txItems.push({product:p.Name||p._key,qty:finalQty,price,cost:Number(p.Cost||0),total:saleTotal});
      }

      const gross=total;
      let disc=Number(command.discount||0);
      if (command.discount_percent>0) disc+=gross*(Number(command.discount_percent)/100);
      disc=Math.max(0,Math.min(disc,gross));
      total=gross-disc;

      let paidNow=0,creditPortion=0;
      if (payment==="split") {
        paidNow=Math.max(0,Math.min(Number(command.paid_amount||0),total));
        creditPortion=total-paidNow;
        if (creditPortion<=0.001) payment="cash";
        else if (paidNow<=0.001) payment="credit";
      }

      const txId=command.client_txn_id||("T"+Date.now());
      const tx={id:txId,client_txn_id:command.client_txn_id||"",type:"sale",items:txItems,total,discount:disc,paid_amount:payment==="split"?paidNow:undefined,customer,customer_key:customer?custKey(command):"",payment,timestamp:Date.now(),date:getTodayString()};
      updates[`Transactions/${txId}`]=tx;
      if (customer&&payment==="credit"){const ck=custKey(command);addInc(updates,`Customers/${ck}/Balance`,total);updates[`Customers/${ck}/Name`]=customer;}
      else if(customer&&payment==="split"){const ck=custKey(command);addInc(updates,`Customers/${ck}/Balance`,creditPortion);updates[`Customers/${ck}/Name`]=customer;addInc(updates,"CashManagement/CashInHand",paidNow);}
      else if(payment==="cash") addInc(updates,"CashManagement/CashInHand",total);
      addStatsDeltas(updates,tx);

      let reply="✅ Sale recorded\n"+txItems.map(x=>x.is_misc?`➕ Rs ${formatNumber(x.total)} (${x.product})`:`${formatNumber(x.qty)} × ${x.product} (Rs ${formatNumber(x.total)})`).join("\n");
      if (disc>0.001) reply+=`\n🏷️ Discount:-Rs ${formatNumber(disc)}`;
      reply+=`\n💰 Total:Rs ${formatNumber(total)}`;
      if (payment==="split") reply+=`\n💵 Naqad:Rs ${formatNumber(paidNow)}\n🧾 Khate Mein:Rs ${formatNumber(creditPortion)}`;
      else reply+=payment==="cash"?"\n💵 Naqad":"\n🧾 Udhaar";
      if (customer) reply+=`\n👤 ${customer}`;
      return {ok:true,type:"completed",reply,transaction:tx,updates};
    }

    async function processReturn(command, products) {
      const items=command.items||[];
      if (!items.length) return {ok:false,reply:"❌ Return item aur miqdaar batayein."};
      const customer=command.customer?String(command.customer).trim():"";
      const cashRefund=!customer||String(command.payment||"").toLowerCase()==="cash"||/\b(naqad|cash)\b/i.test(command.user_text||"");
      const payment=cashRefund?"cash":"credit";
      const updates={}, txItems=[];
      let total=0;
      for (let i=0;i<items.length;i++) {
        const item=items[i];
        const cleanName=String(item.product||"").replace(/\b(wapis|wapos|wapas|return)\b/gi,"").trim();
        const m=item._resolvedProduct?{status:"found",product:item._resolvedProduct}:findProduct(cleanName,products);
        if (m.status==="multiple") return {ok:true,type:"need_clarification",reply:`⚠️ "${cleanName}" ke liye ek se zyada products match huay. Sahi product select karein:`,options:m.matches,pending_context:{action:"return",customer,target_index:i,items}};
        if (m.status!=="found") return {ok:false,reply:`❌ Return product database mein nahi mila: ${cleanName}`};
        const p=m.product, price=Number(p.Price||0), cost=Number(p.Cost||0);
        let returnQty=0, lineTotal=0;
        if(item.amount>0){lineTotal=Number(item.amount);returnQty=price>0?lineTotal/price:1;}
        else if(item.qty>0){returnQty=Number(item.qty);lineTotal=returnQty*price;}
        else{returnQty=1;lineTotal=price;}
        if (!isFinite(returnQty)||returnQty<=0) return {ok:false,reply:`❌ Return quantity galat hai: ${cleanName}`};
        addInc(updates,`Products/${sanitizeFirebaseKey(p._key)}/Stock`,returnQty);
        total+=lineTotal;
        txItems.push({product:p.Name||p._key,qty:returnQty,price,cost,total:lineTotal});
      }
      const txId=command.client_txn_id||("R"+Date.now());
      const tx={id:txId,client_txn_id:command.client_txn_id||"",type:"return",items:txItems,total,customer,customer_key:customer?custKey(command):"",payment,timestamp:Date.now(),date:getTodayString()};
      updates[`Transactions/${txId}`]=tx;
      if(customer&&payment==="credit"){const ck=custKey(command);addInc(updates,`Customers/${ck}/Balance`,-total);updates[`Customers/${ck}/Name`]=customer;}
      else addInc(updates,"CashManagement/CashInHand",-total);
      addStatsDeltas(updates,tx);
      let reply=`↩️ Return recorded\n${txItems.map(x=>`${formatNumber(x.qty)} × ${x.product} (Rs ${formatNumber(x.total)})`).join("\n")}\n💰 Total:Rs -${formatNumber(total)}`;
      reply+=customer?(payment==="credit"?`\n👤 ${customer} (Khata se minus)`:`\n👤 ${customer} (Naqad wapis)`):`\n💵 Naqad wapis`;
      return {ok:true,reply,transaction:tx,updates};
    }

    async function processVoidTransaction(command, products) {
      const search=String(command.search||command.user_text||"").trim();
      if (!search) return {ok:false,reply:'❌ Kis entry ko cancel karna hai? (naam, amount, ya item)'};
      const all=await firebaseRequest("Transactions","GET")||{};
      const rows=Object.keys(all).map(k=>all[k]).filter(t=>t&&!t.voided&&t.type!=="void").sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
      if (!rows.length) return {ok:false,reply:"📭 Koi transaction nahi mili."};
      let target=null;
      const ref=search.match(/\bT(\d{1,2})\b/i);
      if (ref){const idx=Number(ref[1])-1;if(idx>=0&&idx<rows.length)target=rows[idx];}
      if (!target) {
        const nW=normMatch(search).split(" ").filter(Boolean);
        let best=null,bestScore=-1;
        rows.slice(0,40).forEach(t=>{
          const hay=normMatch([t.customer,t.supplier,t.category,t.total,t.amount,(t.items||[]).map(i=>i.product).join(" ")].filter(Boolean).join(" "));
          let score=0;nW.forEach(w=>{if(hay.includes(w))score+=w.length>=3?2:1;});
          if(score>bestScore){bestScore=score;best=t;}
        });
        if (best&&bestScore>0) target=best;
      }
      if (!target) return {ok:false,reply:`❌ "${search}" se milti koi entry nahi mili. "recent entries dikhao" bol kar list dekh lein.`};
      return voidSpecificTransaction(target, products);
    }

    async function voidSpecificTransaction(tx, products) {
      if (tx.voided) return {ok:true,reply:"ℹ️ Yeh entry pehle hi cancel ho chuki hai."};
      const updates={};
      const ck=tx.customer_key||sanitizeFirebaseKey(tx.customer||"");
      const sk=tx.supplier_key||sanitizeFirebaseKey(tx.supplier||"");
      const total=Number(tx.total||0), amount=Number(tx.amount||0);
      const payment=tx.payment||(tx.customer?"credit":"cash");
      const stockFor=(item,sign)=>{
        if (item.is_misc) return;
        const key=products[item.product]?item.product:(findProduct(item.product,products).product||{})._key;
        if(key) addInc(updates,`Products/${sanitizeFirebaseKey(key)}/Stock`,sign*Number(item.qty||0));
      };
      let label;
      if (tx.type==="sale") {
        (tx.items||[]).forEach(it=>stockFor(it,1));
        if (payment==="split"&&ck) {
          const paidNow=Number(tx.paid_amount||0);
          addInc(updates,`Customers/${ck}/Balance`,-(total-paidNow));
          addInc(updates,"CashManagement/CashInHand",-paidNow);
        } else if(payment==="credit"&&ck) addInc(updates,`Customers/${ck}/Balance`,-total);
        else addInc(updates,"CashManagement/CashInHand",-total);
        label=`Sale Rs ${formatNumber(total)}`;
      } else if (tx.type==="return") {
        (tx.items||[]).forEach(it=>stockFor(it,-1));
        if(payment==="credit"&&ck) addInc(updates,`Customers/${ck}/Balance`,total);
        else addInc(updates,"CashManagement/CashInHand",total);
        label=`Return Rs ${formatNumber(total)}`;
      } else if (tx.type==="payment") {
        addInc(updates,`Customers/${ck}/Balance`,amount);
        addInc(updates,"CashManagement/CashIn",-amount);
        addInc(updates,"CashManagement/CashInHand",-amount);
        label=`Cash In Rs ${formatNumber(amount)} (${tx.customer})`;
      } else if (tx.type==="cash_out") {
        addInc(updates,`Customers/${ck}/Balance`,-amount);
        addInc(updates,"CashManagement/CashOut",-amount);
        addInc(updates,"CashManagement/CashInHand",amount);
        label=`Cash Out Rs ${formatNumber(amount)} (${tx.customer})`;
      } else if (tx.type==="expense") {
        addInc(updates,"CashManagement/CashOut",-amount);
        addInc(updates,"CashManagement/CashInHand",amount);
        label=`Expense Rs ${formatNumber(amount)} (${tx.category})`;
      } else if (tx.type==="supplier_purchase") {
        addInc(updates,`Suppliers/${sk}/Balance`,-total);
        label=`Supplier Purchase Rs ${formatNumber(total)} (${tx.supplier})`;
      } else if (tx.type==="supplier_payment") {
        addInc(updates,`Suppliers/${sk}/Balance`,amount);
        addInc(updates,"CashManagement/CashOut",-amount);
        addInc(updates,"CashManagement/CashInHand",amount);
        label=`Supplier Payment Rs ${formatNumber(amount)} (${tx.supplier})`;
      } else if (tx.type==="purchase") {
        (tx.items||[]).forEach(it=>stockFor(it,-1));
        addInc(updates,"CashManagement/CashInHand",total);
        label=`Purchase Rs ${formatNumber(total)}`;
      } else {
        return {ok:false,reply:"❌ Is qism ki entry cancel nahi ho sakti."};
      }
      addStatsDeltas(updates,tx,true);
      updates[`Transactions/${tx.id}/voided`]=true;
      updates[`Transactions/${tx.id}/voidedAt`]=Date.now();
      updates[`Transactions/UNDO_${tx.id}`]={id:`UNDO_${tx.id}`,type:"void",ref:tx.id,timestamp:Date.now(),date:getTodayString()};
      const items=(tx.items||[]).map(it=>`${formatNumber(it.qty)} × ${it.product}`).join(", ");
      return {ok:true,reply:`↩️ Cancel ho gaya: ${label}${items?`\n📦 ${items}`:""}\nStock, cash aur khata wapis theek kar diya.`,updates};
    }
