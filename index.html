    function normalizePeriod(period) {
      period=String(period||"daily").toLowerCase();
      if (["today","daily","day"].includes(period)) return "daily";
      if (["yesterday","kal"].includes(period)) return "yesterday";
      if (["week","weekly"].includes(period)) return "weekly";
      if (["month","monthly"].includes(period)) return "monthly";
      if (["year","yearly"].includes(period)) return "yearly";
      if (["all","lifetime"].includes(period)) return "lifetime";
      return period.includes("previous_")?period:"daily";
    }

    function formatStatsReport(stats, period, globalCash) {
      const map={
        daily:"Today's",yesterday:"Yesterday's",weekly:"This Week's",
        previous_week:"Previous Week",monthly:"This Month's",
        previous_month:"Previous Month",yearly:"This Year's",
        previous_year:"Previous Year",lifetime:"Lifetime"
      };
      let reply=`📊 ${map[normalizePeriod(period)]||"General"} Report\n\n`;
      reply+=`💰 Total Sales:Rs ${formatNumber(stats.TotalSales||0)}\n`;
      reply+=`📦 Total Cost:Rs ${formatNumber(stats.TotalCost||0)}\n`;
      reply+=`📈 Total Profit:Rs ${formatNumber(stats.TotalProfit||0)}\n`;
      reply+=`💵 Naqad Sales:Rs ${formatNumber(stats.TotalCash||0)}\n`;
      reply+=`🧾 Udhaar Sales:Rs ${formatNumber(stats.TotalCredit||0)}\n`;
      if (stats.TotalReturns>0) reply+=`↩️ Returns:Rs ${formatNumber(stats.TotalReturns||0)} (${formatNumber(stats.ReturnCount||0)})\n`;
      if (stats.TotalExpense>0) reply+=`💸 Kharcha:Rs ${formatNumber(stats.TotalExpense||0)}\n`;
      if (stats.CashIn>0||stats.CashOut>0) reply+=`\n💱 Cash Flow:\n   Cash In(+):Rs ${formatNumber(stats.CashIn||0)}\n   Cash Out(-):Rs ${formatNumber(stats.CashOut||0)}\n`;
      reply+=`\n🏦 Cash In Hand:Rs ${formatNumber(globalCash.CashInHand||0)}\n🛒 Sales Count:${formatNumber(stats.SaleCount||0)}`;
      const rows=Object.keys(stats.Products||{}).map(k=>stats.Products[k]).filter(p=>p.Revenue!==0||p.Qty!==0).sort((a,b)=>b.Revenue-a.Revenue);
      if (rows.length) {
        reply+="\n\n🛍️ Product Sales:";
        rows.forEach((p,i)=>{reply+=`\n\n${i+1}. ${p.Name}\n   Sold:${formatNumber(p.Qty||0)} | Times:${formatNumber(p.TimesSold||0)}\n   Rev:Rs ${formatNumber(p.Revenue||0)} | Profit:Rs ${formatNumber(p.Profit||0)}`;});
      }
      return {ok:true,reply};
    }

    async function processReport(command) {
      const period=normalizePeriod(command.period);
      const globalCash=await firebaseRequest("CashManagement","GET")||{CashInHand:0,CashIn:0,CashOut:0};
      if (["daily","weekly","monthly","yearly","lifetime"].includes(period)) {
        const stats=await firebaseRequest(getStatsBucketPaths(new Date())[period],"GET");
        if (stats&&typeof stats==="object") return formatStatsReport(stats,period,globalCash);
        return {ok:true,reply:"📊 Is period ka abhi koi data nahi hai."};
      }
      if (period==="yesterday") {
        const y=new Date();y.setDate(y.getDate()-1);
        const stats=await firebaseRequest(getStatsBucketPaths(y).daily,"GET");
        if (stats&&typeof stats==="object") return formatStatsReport(stats,period,globalCash);
        return {ok:true,reply:"📊 Kal ka koi data nahi mila."};
      }
      if (period==="previous_month") {
        const m=new Date();m.setDate(1);m.setMonth(m.getMonth()-1);
        const stats=await firebaseRequest(getStatsBucketPaths(m).monthly,"GET");
        if (stats&&typeof stats==="object") return formatStatsReport(stats,period,globalCash);
        return {ok:true,reply:"📊 Pichle mahine ka koi data nahi mila."};
      }
      return {ok:true,reply:"📊 Yeh period abhi support nahi hai."};
    }

    async function processProductReport(command, products) {
      const m=findProduct(command.product,products);
      if (m.status!=="found") return {ok:false,reply:"❌ Product nahi mila."};
      const p=m.product, targetName=canonicalName(p.Name||p._key), period=normalizePeriod(command.period||"monthly");
      if (["daily","weekly","monthly","yearly","lifetime"].includes(period)) {
        const stats=await firebaseRequest(getStatsBucketPaths(new Date())[period],"GET");
        if (stats?.Products) {
          for (const k of Object.keys(stats.Products)) {
            if (canonicalName(k)===targetName||canonicalName(stats.Products[k].Name)===targetName) {
              const pp=stats.Products[k];
              return {ok:true,reply:`📊 ${p.Name||p._key}\nPeriod:${period}\nSold:${formatNumber(pp.Qty||0)}\n🔢 Times:${formatNumber(pp.TimesSold||0)}\n💰 Revenue:Rs ${formatNumber(pp.Revenue||0)}\n📦 Cost:Rs ${formatNumber(pp.Cost||0)}\n📈 Profit:Rs ${formatNumber(pp.Profit||0)}`};
            }
          }
        }
      }
      return {ok:false,reply:"📊 No data found for this period."};
    }

    async function processChatHistory() {
      const now=new Date(), dates=[];
      for (let i=0;i<7;i++){const d=new Date(now-i*86400000);dates.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`);}
      const responses=await firebaseParallelGet(dates.map(d=>`ChatHistory/${d}`));
      let allChats=[];
      responses.forEach(day=>{if(day)Object.values(day).forEach(c=>allChats.push(c));});
      if (!allChats.length) return {ok:true,reply:"📭 Pichle 7 din ki koi chat history nahi mili."};
      allChats.sort((a,b)=>a.timestamp-b.timestamp);
      let reply="📜 Last 7 Days Chat History:\n\n";
      allChats.slice(-40).forEach(c=>{
        const d=new Date(c.timestamp);
        const t=`${d.getDate()} ${d.toLocaleString("default",{month:"short"})}, ${d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}`;
        reply+=`👤 [${t}]\n💬 You:${c.user}\n🤖 AI:${c.ai}\n${"-".repeat(20)}\n`;
      });
      return {ok:true,reply:reply.trim()};
    }

    async function processAddToKhata(command) {
      const customer=String(command.customer||"").trim();
      const items=command.items||[];
      if (!customer) return {ok:false,reply:"❌ Customer ka naam batayein."};
      if (!items.length) return {ok:false,reply:"❌ Kaunsa item khate mein add karna hai batayein."};
      const label=items.map(it=>`${formatNumber(it.qty||1)} × ${it.product}`).join(", ");
      const ck=custKey(command);
      const updates={};
      updates[`Customers/${ck}/Name`]=customer;
      const txId=command.client_txn_id||("NOTE_"+Date.now());
      updates[`Transactions/${txId}`]={id:txId,type:"khata_note",customer,customer_key:ck,items,note:label,timestamp:Date.now(),date:getTodayString()};
      return {ok:true,reply:`📝 Khate mein note add ho gaya\n👤 ${customer}\n📦 ${label}\n\nℹ️ Yeh sirf note hai, price/balance nahi badla. Agar yeh sale/udhaar hai to "sale" bol kar dein.`,updates,transaction:{type:"khata_note"}};
    }

    async function processAddNewProduct(command) {
      if (!command.product) return {ok:false,reply:"❌ Product ka naam batayein."};
      const name=String(command.product).trim();
      const productKey=sanitizeFirebaseKey(name);
      const existing=await firebaseRequest(`Products/${productKey}`,"GET");
      if (existing) return {ok:false,reply:`⚠️ Ye product pehle se database mein mojood hai: ${name}`};
      const price=Number(command.price||0), cost=Number(command.cost||0);
      const stock=Number(command.stock||0), unit=String(command.unit||"pcs").trim();
      const updates={[`Products/${productKey}`]:{Name:name,Price:price,Cost:cost,Stock:stock,Unit:unit,updatedAt:Date.now()}};
      return {ok:true,reply:`✅ New Product Added!\n📦 ${name}\n💰 Sale Price:Rs ${formatNumber(price)}\n📉 Cost:Rs ${formatNumber(cost)}\n📊 Stock:${formatNumber(stock)} (${unit})`,updates};
    }

    // Appends the customer's current balance to a result's reply, whenever this
    // action just changed it. Covers "uska balance kitna reh gaya" automatically.
    async function appendBalanceFootnote(res, command) {
      if (res?.ok&&res?.saved&&command?.customer) {
        try {
          const ck=command.customer_key||custKey(command);
          const bal=Number(await firebaseRequest(`Customers/${ck}/Balance`,"GET")||0);
          res.reply=(res.reply||"")+`\n⚖️ Naya Balance:Rs ${formatNumber(bal)}`;
        } catch(e){}
      }
      return res;
    }

    // ─── MASTER EXECUTOR ──────────────────────────────────────
    async function executeCommand(command, products) {
      if (command?.user_text) __curText=command.user_text; else if (command?.pending_context?.__multi_orig) __curText=command.pending_context.__multi_orig;
      if (!command?.action) return {ok:false,reply:"Command samajh nahi aayi."};
      const action=String(command.action).toLowerCase();

      if (action==="chat") return {ok:true,reply:command.reply||"Acha g, batayein aur kya madad kar sakta hoon?"};
      if (action==="add_new_product_form") return {ok:true,type:"need_add_product_form",reply:command.reply||"📦 Naya product add karne ke liye form fill karein:"};

      // Direct update actions → confirm first
      if (["update_price_direct","update_cost_direct","update_stock_direct","update_stock_add"].includes(action)) {
        const val=Number(command.value);
        if (!command.product||!isFinite(val)) return {ok:false,reply:"❌ Product ya value theek se samajh nahi aayi."};
        let p=products[command.product]?{...products[command.product],_key:command.product}:null;
        if (!p){const m=findProduct(command.product,products);if(m.status==="not_found")return{ok:false,reply:`❌ Product nahi mila: ${command.product}`};if(m.status==="multiple")return{ok:true,type:"need_clarification",reply:`⚠️ "${command.product}" ke liye ek se zyada products match huay. Sahi product select karein:`,options:m.matches,pending_context:command};p=m.product;}
        const fieldLabel=action==="update_cost_direct"?"Cost":action.includes("stock")?"Stock":"Price";
        const isAdd=action==="update_stock_add"||(String(command.value_mode||"").toLowerCase()==="add"&&action.includes("stock"));
        const curVal=action==="update_cost_direct"?Number(p.Cost||0):action.includes("stock")?Number(p.Stock||0):Number(p.Price||0);
        const finalVal=isAdd?curVal+val:val;
        const changeNote=isAdd?` (${curVal} + ${val})`:"";
        return {ok:true,type:"need_direct_update_confirmation",reply:`⚠️ Kya aap ${p.Name||p._key} ka ${fieldLabel} update kar ke ${finalVal} karna chahte hain?${changeNote}`,product_key:p._key,product_name:p.Name||p._key,field:action,value:finalVal};
      }

      if (action==="resolve_direct_update") {
        const pKey=sanitizeFirebaseKey(command.product_key);
        const dbField=command.field==="update_cost_direct"?"Cost":command.field.includes("stock")?"Stock":"Price";
        const val=Number(command.value);
        const updates={[`Products/${pKey}/${dbField}`]:val,[`Products/${pKey}/updatedAt`]:Date.now()};
        await firebaseRequest("","PATCH",updates);
        patchLocalCaches(updates);
        return {ok:true,saved:true,reply:`✅ ${dbField} updated to ${val} for ${command.product_name}!`};
      }

      // _request actions → show form
      if (["update_price_request","update_cost_request","update_stock_request"].includes(action)) {
        if (!command.product) return {ok:false,reply:"❌ Kis product ki detail update karni hai uska naam batayein."};
        let p=products[command.product]?{...products[command.product],_key:command.product}:null;
        if (!p){const m=findProduct(command.product,products);if(m.status==="not_found")return{ok:false,reply:`❌ Product nahi mila: ${command.product}`};if(m.status==="multiple")return{ok:true,type:"need_clarification",reply:`⚠️ "${command.product}" ke liye ek se zyada products match huay. Sahi product select karein:`,options:m.matches,pending_context:command};p=m.product;}
        const fieldType=action.replace("_request","");
        return {ok:true,type:"need_update_field_form",reply:`✏️ Update ${p.Name||p._key} (${fieldType.replace("update_","").toUpperCase()})`,product_key:p._key,product_name:p.Name||p._key,field:fieldType};
      }

      if (action==="resolve_update_field") {
        const pKey=sanitizeFirebaseKey(command.product_key);
        const dbField=command.field==="update_cost"?"Cost":command.field==="update_stock"?"Stock":"Price";
        const val=Number(command.value);
        if (!isFinite(val)||val<0) return {ok:false,reply:"❌ Value galat hai."};
        const updates={[`Products/${pKey}/${dbField}`]:val,[`Products/${pKey}/updatedAt`]:Date.now()};
        await firebaseRequest("","PATCH",updates);
        patchLocalCaches(updates);
        return {ok:true,saved:true,reply:`✅ ${dbField} updated to ${val} for ${command.product_name}!`};
      }

      // Customer resolution middleware
      if (command.customer&&!command.customer_resolved&&action!=="resolve_customer_clarification") {
        const customers=await getCustomersCached();
        const m=findCustomer(command.customer,customers);
        if (m.status==="multiple") return {ok:true,type:"need_customer_clarification",reply:`⚠️ "${command.customer}" naam se miltay jultay khatey hain. Sahi khata select karein ya naya banayein:`,options:m.matches,pending_context:command};
        if (m.status==="found") { command.customer=m.customer.Name||m.customer._key; command.customer_key=m.customer._key; }
        else {
          if (action==="customer_balance") return {ok:false,reply:`❌ "${command.customer}" naam ka koi khata nahi mila.`};
          return {ok:true,type:"need_customer_clarification",reply:`🆕 "${command.customer}" naam ka khata nahi mila. Naya khata banayein?`,options:[],pending_context:command};
        }
        command.customer_resolved=true;
      }

      if (action==="resolve_customer_clarification") {
        const ctx=command.pending_context;
        if (!ctx) return {ok:false,reply:"❌ Session context expire ho gaya hai."};
        if (command.client_txn_id) ctx.client_txn_id=command.client_txn_id;
        ctx.customer=command.selected_customer;
        if (command.selected_customer_key) ctx.customer_key=command.selected_customer_key; else delete ctx.customer_key;
        ctx.customer_resolved=true;
        return executeCommand(ctx,products);
      }

      // Supplier resolution middleware
      if (command.supplier&&!command.supplier_resolved&&action!=="resolve_supplier_clarification") {
        const suppliers=await firebaseRequest("Suppliers","GET")||{};
        const m=findSupplier(command.supplier,suppliers);
        if (m.status==="multiple") return {ok:true,type:"need_customer_clarification",reply:`⚠️ "${command.supplier}" naam se miltay jultay suppliers hain. Sahi select karein ya naya banayein:`,options:m.matches,pending_context:command,is_supplier:true};
        if (m.status==="found") { command.supplier=m.supplier.Name||m.supplier._key; command.supplier_key=m.supplier._key; }
        else {
          if (action==="supplier_balance") return {ok:false,reply:`❌ "${command.supplier}" naam ka koi supplier khata nahi mila.`};
          return {ok:true,type:"need_customer_clarification",reply:`🆕 "${command.supplier}" naam ka supplier khata nahi mila. Naya banayein?`,options:[],pending_context:command,is_supplier:true};
        }
        command.supplier_resolved=true;
      }

      if (action==="resolve_supplier_clarification") {
        const ctx=command.pending_context;
        if (!ctx) return {ok:false,reply:"❌ Session context expire ho gaya hai."};
        if (command.client_txn_id) ctx.client_txn_id=command.client_txn_id;
        ctx.supplier=command.selected_customer;
        if (command.selected_customer_key) ctx.supplier_key=command.selected_customer_key; else delete ctx.supplier_key;
        ctx.supplier_resolved=true;
        return executeCommand(ctx,products);
      }

      if (action==="resolve_clarification") {
        const ctx=command.pending_context;
        if (!ctx) return {ok:false,reply:"❌ Session context expire ho gaya hai."};
        if (command.client_txn_id) ctx.client_txn_id=command.client_txn_id;
        const selKey=command.selected_product_key||command.selected_product;
        if (ctx.items) {
          const idx=command.target_index!==undefined?command.target_index:(ctx.target_index||0);
          let matched=null;
          if (products[selKey]) matched={...products[selKey],_key:selKey};
          else { const m=findProduct(command.selected_product,products); if(m.status==="found") matched=m.product; }
          if (matched){ctx.items[idx]._resolvedProduct=matched;ctx.items[idx].product=matched.Name||matched._key;}
          else ctx.items[idx].product=command.selected_product;
          ctx.user_text=command.user_text;
          return appendBalanceFootnote(await commitResult(await (ctx.action==="return"?processReturn(ctx,products):processSale(ctx,products))), ctx);
        } else {
          ctx.product=selKey;
          return executeCommand(ctx,products);
        }
      }

      if (action==="resolve_missing") {
        const ctx=command.pending_context, decision=command.decision;
        if (!ctx?.items) return {ok:false,reply:"❌ Session context expire ho gaya hai."};
        if (decision==="cancel") return {ok:true,reply:"🚫 Transaction cancel kar di gayi."};
        const missingIdx=(command.missing_indices||[]).map(Number);
        if (decision==="skip") {
          ctx.items=ctx.items.filter((_,i)=>!missingIdx.includes(i));
          if (!ctx.items.length) return {ok:false,reply:"❌ Sari items missing theen."};
          if (command.client_txn_id) ctx.client_txn_id=command.client_txn_id;
          return appendBalanceFootnote(await commitResult(await (ctx.action==="return"?processReturn(ctx,products):processSale(ctx,products))), ctx);
        }
        if (decision==="manual") {
          const mp=command.manual_prices||{};
          ctx.items.forEach((item,i)=>{
            if (!missingIdx.includes(i)) return;
            const pv=Number(mp[i]!==undefined?mp[i]:mp[String(i)]||0);
            item.is_misc=true;item.amount=pv;item.price=pv;item.qty=1;item._resolvedProduct=null;
            item.product=String(item.product).replace(/\s*\(Unlisted\)/gi,"")+" (Unlisted)";
          });
          if (command.client_txn_id) ctx.client_txn_id=command.client_txn_id;
          return appendBalanceFootnote(await commitResult(await (ctx.action==="return"?processReturn(ctx,products):processSale(ctx,products))), ctx);
        }
        return {ok:false,reply:"❌ Galat decision option."};
      }

      if ((action==="sale"||action==="return")&&!command.items&&command.product)
        command.items=[command];

      let res;
      switch(action) {
        case "sale":               res=await commitResult(await processSale(command,products)); break;
        case "return":             res=await commitResult(await processReturn(command,products)); break;
        case "purchase":           res=await commitResult(await processPurchase(command,products)); break;
        case "add_new_product":    res=await commitResult(await processAddNewProduct(command)); break;
        case "add_to_khata":       res=await commitResult(await processAddToKhata(command)); break;
        case "customer_payment":   res=await commitResult(await processCustomerPayment(command)); break;
        case "customer_cash_out":  res=await commitResult(await processCustomerCashOut(command)); break;
        case "expense_add":        res=await commitResult(await processExpenseAdd(command)); break;
        case "expense_report":     res=await processExpenseReport(command); break;
        case "supplier_purchase":  res=await commitResult(await processSupplierPurchase(command,products)); break;
        case "supplier_payment":   res=await commitResult(await processSupplierPayment(command)); break;
        case "supplier_balance":   res=await (async()=>{if(!command.supplier)return{ok:false,reply:"❌ Supplier ka naam batayein."};const sk=supKey(command);const b=Number(await firebaseRequest(`Suppliers/${sk}/Balance`,"GET")||0);const naturalLine=b>0.005?`${command.supplier} ko Rs ${formatNumber(b)} dena hai.`:b<-0.005?`${command.supplier} se Rs ${formatNumber(-b)} wapis lene hain.`:`${command.supplier} ka hisaab clear hai.`;return{ok:true,reply:`${naturalLine}\n\n🏭 ${command.supplier} ko dena hai:Rs ${formatNumber(b)}`};})(); break;
        case "all_supplier_balances": res=await processAllSupplierBalances(); break;
        case "list_recent_transactions": res=await processListRecentTransactions(); break;
        case "void_transaction":   res=await commitResult(await processVoidTransaction(command,products)); if(res.saved)localStorage.removeItem(LAST_TXN_KEY); break;
        case "list_products":      res=processListProducts(products); break;
        case "low_stock":          res=processLowStock(products); break;
        case "stock":
        case "product_search":     res=processStock(command,products); break;
        case "customer_balance":   res=await processCustomerBalance(command); break;
        case "all_balances":       res=await processAllBalances(); break;
        case "cash_balance":       res=await processCashBalance(); break;
        case "undo_last":          res=await commitResult(await processUndoLast(command,products)); if(res.saved)localStorage.removeItem(LAST_TXN_KEY); break;
        case "report":             res=await processReport(command); break;
        case "product_report":     res=await processProductReport(command,products); break;
        case "chat_history":       res=await processChatHistory(); break;
        default:                   res={ok:false,reply:`❌ Unknown action: ${command.action}`};
      }
      // Auto-append the customer's updated balance whenever this action just
      // changed it (sale/return/payment/cash-out for a named customer), so the
      // user doesn't have to ask separately — covers "uska balance kitna reh gaya".
      if (["sale","return","customer_payment","customer_cash_out"].includes(action)) res=await appendBalanceFootnote(res,command);
      return res;
    }

    // ─── QUEUE ENGINE ─────────────────────────────────────────
    let commandQueue = JSON.parse(localStorage.getItem(QUEUE_KEY))||[];
    let isProcessingQueue=false, isAwaitingInput=false;
    function saveQueue(){ localStorage.setItem(QUEUE_KEY,JSON.stringify(commandQueue)); }

    window.addEventListener("DOMContentLoaded",()=>{
      preloadCaches();
      if (!navigator.onLine) {
        latencyBadge.textContent="Offline";connDot.style.background="var(--warning-color)";connDot.style.boxShadow="0 0 6px var(--warning-color)";
      }
      commandQueue.forEach(item=>{
        const row=appendUserMessage(item.displayLabel,item.id);
        if (item.status==="interactive"&&item.interactiveData){
          updateBubbleStatus(row,"delivered");isAwaitingInput=true;toggleInput(true);
          renderInteractiveWidgets(item.interactiveData,item.id,item.originalMessage);
        } else updateBubbleStatus(row,item.status==="failed"?"failed":"queued");
      });
      if (commandQueue.length>0&&navigator.onLine) processQueue();
    });

    window.addEventListener("online",()=>{
      latencyBadge.textContent="Turbo Ready";connDot.style.background="var(--success-green)";connDot.style.boxShadow="0 0 6px var(--success-green)";
      if (commandQueue.length>0) processQueue();
    });
    window.addEventListener("offline",()=>{
      latencyBadge.textContent="Offline";connDot.style.background="var(--warning-color)";connDot.style.boxShadow="0 0 6px var(--warning-color)";
    });
    setInterval(()=>{if(commandQueue.length>0&&navigator.onLine&&!isProcessingQueue)processQueue();},2000);

    function enqueueCommand(payload,displayLabel){
      const id="txn_"+Date.now();
      commandQueue.push({id,payload,displayLabel,originalMessage:displayLabel,status:"queued",timestamp:Date.now(),mode:MODE});
      saveQueue();
      updateBubbleStatus(appendUserMessage(displayLabel,id),"queued");
      processQueue();
    }

    const DIRECT_ACTIONS=new Set(["resolve_clarification","resolve_missing","resolve_customer_clarification","resolve_supplier_clarification","resolve_update_field","resolve_direct_update","add_new_product","update_price_direct","update_cost_direct","update_stock_direct","update_stock_add","add_to_khata"]);
    const NON_SAVING_LOGGED_ACTIONS=new Set(["report","product_report","stock","chat","customer_balance","all_balances","cash_balance","list_products","low_stock","add_new_product_form","update_price_request","update_cost_request","update_stock_request","expense_report","supplier_balance","all_supplier_balances","list_recent_transactions"]);

    // Runs a list of parsed commands (multi-action) one after another against a
    // LIVE, continuously-refreshed products snapshot so a later part always sees
    // stock/balance changes made by an earlier part in the same message. Stops
    // and surfaces an interactive widget the moment a part needs one; earlier
    // parts' results stay committed and their replies are already combined in.
    // remaining is the not-yet-run tail of parts (part 0 = the one to run now).
    // startIndex lets a resumed (post-clarification) call keep generating
    // unique per-part transaction ids instead of reusing an earlier part's id.
    async function runMultiCommand(remaining, txnId, origText, priorReplies, startIndex) {
      const replies = priorReplies || [];
      let idx = startIndex || 0;
      while (remaining.length) {
        const cmd = remaining[0];
        // Each part MUST get its own unique transaction id — reusing the queue
        // item's id across parts makes commitResult() think part 2+ is a
        // duplicate of part 1 (same Transactions/{id} key) and silently skip
        // saving it while reporting "already recorded".
        cmd.client_txn_id = `${txnId}_p${idx}`;
        cmd.user_text = origText;
        const products = await getProductsCached(); // re-read so earlier parts' stock/balance edits are visible
        const data = await executeCommand(cmd, products);

        const INTERACTIVE=new Set(["need_missing_resolution","need_clarification","need_customer_clarification","need_add_product_form","need_update_field_form","need_direct_update_confirmation"]);
        if (INTERACTIVE.has(data.type)) {
          // Pause here so the eventual resolve_* call can resume the loop with
          // the remaining parts intact. Carried on pending_context when that
          // exists (sale/return/customer flows); otherwise as top-level fields
          // (product field-update flows, which don't use pending_context).
          const carry = {__multi_remaining: remaining.slice(1), __multi_replies: replies, __multi_orig: origText, __multi_index: idx};
          if (data.pending_context) data.pending_context = {...data.pending_context, ...carry};
          else Object.assign(data, carry);
          return {ok:true, paused:true, data, replies};
        }

        if (data.ok&&(data.transaction||data.saved||NON_SAVING_LOGGED_ACTIONS.has(cmd.action))) {
          const ds=getTodayString();
          firebaseRequest(`ChatHistory/${ds}/${txnId}_p${idx}`,"PUT",{user:origText,ai:data.reply,timestamp:Date.now()}).catch(()=>{});
        }
        if (data.reply) replies.push(data.reply);
        remaining = remaining.slice(1);
        idx++;
      }
      return {ok:true, paused:false, replies};
    }

    function combineReplies(replies) {
      return replies.filter(Boolean).join("\n\n" + "─".repeat(18) + "\n\n");
    }

    async function processQueue(){
      if (isProcessingQueue||!navigator.onLine||commandQueue.length===0) return;
      const item=commandQueue[0];
      if (item.status==="interactive"){isAwaitingInput=true;return;}
      if (item.status==="failed"){
        item.retries=(item.retries||0)+1;
        if (item.retries>2){commandQueue.shift();saveQueue();await streamModelResponse("❌ Yeh command process nahi ho saki. Baraye meherbani dobara likhein.");return;}
      }
      isProcessingQueue=true;
      const bubble=document.getElementById(item.id);
      if (bubble) updateBubbleStatus(bubble,"sending");
      latencyBadge.textContent="Processing...";
      const shimmer=appendShimmer();setNetworkProgress(true);

      try {
        const payload={...item.payload,client_txn_id:item.id};
        const t0=performance.now();
        LEDGER_TOK.last=0;
        const products=await getProductsCached();
        let data;

        if (payload.action?.startsWith("resolve_ledger_")||payload.action==="create_ledger_customer") {
          const lCarrier = (payload.pending_context && Array.isArray(payload.pending_context.__multi_remaining)) ? payload.pending_context
                         : (Array.isArray(payload.__multi_remaining) ? payload : null);
          if (lCarrier) {
            const resumedRemaining = lCarrier.__multi_remaining;
            const priorReplies = lCarrier.__multi_replies || [];
            const origText = lCarrier.__multi_orig || item.originalMessage;
            const pausedIndex = Number(lCarrier.__multi_index||0);
            delete lCarrier.__multi_remaining; delete lCarrier.__multi_replies; delete lCarrier.__multi_orig; delete lCarrier.__multi_index;
            const stepRes = await executeLedgerCommand(payload); // resolves THIS part
            if (LEDGER_INTERACTIVE.has(stepRes.type)) {
              // Resolving this part itself needs another round (e.g. name→still
              // not found) — re-attach the carry so it resumes after THAT too.
              const carry2 = {__multi_remaining: resumedRemaining, __multi_replies: priorReplies, __multi_orig: origText, __multi_index: pausedIndex};
              if (stepRes.pending_context) Object.assign(stepRes.pending_context, carry2); else Object.assign(stepRes, carry2);
              data = stepRes;
            } else {
              if (stepRes.reply||stepRes.card) priorReplies.push({reply:stepRes.reply,card:stepRes.card});
              const rest = await runLedgerMultiCommand(resumedRemaining, item.id, origText, priorReplies, pausedIndex+1);
              if (rest.paused) { data = rest.data; }
              else { data = {ok:true, saved:true, ...ledgerCombine(rest.replies)}; }
            }
          } else {
            data = await executeLedgerCommand(payload);
            if (data.ok&&(data.transaction||data.saved)) {
              const ds=getTodayString();
              firebaseRequest(`ChatHistory/${ds}/${item.id}`,"PUT",{user:item.originalMessage,ai:data.reply,timestamp:Date.now()}).catch(()=>{});
            }
          }
        } else if (item.mode==="ledger"&&!(DIRECT_ACTIONS.has(payload.action)||payload.action?.startsWith("resolve_"))) {
          const msg=String(payload.message||"").trim();
          const parts=await safeUnderstandLedgerCommand(msg);
          const run=await runLedgerMultiCommand(parts, item.id, item.originalMessage, []);
          if (run.paused) { data = run.data; }
          else { data = {ok:true, saved:true, ...ledgerCombine(run.replies)}; if (!data.reply&&!data.cards) data.reply="Done."; }
        } else if (DIRECT_ACTIONS.has(payload.action)||payload.action?.startsWith("resolve_")) {
          // A resolve_* payload may be resuming a paused multi-command: if its
          // pending_context (or, for field-update flows, the payload itself)
          // carries __multi_remaining, continue the loop instead of treating
          // this as a single isolated action.
          const carrier = (payload.pending_context && Array.isArray(payload.pending_context.__multi_remaining)) ? payload.pending_context
                         : (Array.isArray(payload.__multi_remaining) ? payload : null);
          if (carrier) {
            const resumedRemaining = carrier.__multi_remaining;
            const priorReplies = carrier.__multi_replies || [];
            const origText = carrier.__multi_orig || item.originalMessage;
            const pausedIndex = Number(carrier.__multi_index||0);
            delete carrier.__multi_remaining; delete carrier.__multi_replies; delete carrier.__multi_orig; delete carrier.__multi_index;
            const stepRes = await executeCommand(payload, products); // resolves THIS part
            if (stepRes.reply) priorReplies.push(stepRes.reply);
            const rest = await runMultiCommand(resumedRemaining, item.id, origText, priorReplies, pausedIndex+1);
            if (rest.paused) { data = rest.data; }
            else { data = {ok:true, saved:true, reply: combineReplies(rest.replies)}; }
          } else {
            data=await executeCommand(payload,products);
            if (data.ok&&(data.transaction||data.saved||payload.action?.startsWith("resolve_")||payload.action==="add_new_product"||payload.action==="add_to_khata")) {
              const ds=getTodayString();
              firebaseRequest(`ChatHistory/${ds}/${item.id}`,"PUT",{user:item.originalMessage,ai:data.reply,timestamp:Date.now()}).catch(()=>{});
            }
          }
        } else {
          const msg=String(payload.message||"").replace(/(\d),(?=\d{3}(?!\d))/g,"$1").replace(/\s+/g," ").trim();
          const parts=await safeUnderstandCommand(msg,products);
          const run = await runMultiCommand(parts, item.id, item.originalMessage, []);
          if (run.paused) { data = run.data; }
          else { data = {ok:true, saved:true, reply: combineReplies(run.replies) || "Done."}; }
        }

        latencyBadge.textContent=`${Math.round(performance.now()-t0)}ms`+(item.mode==="ledger"?` · ${LEDGER_TOK.last}t`:"");
        shimmer.remove();setNetworkProgress(false);

        const INTERACTIVE=new Set(["need_missing_resolution","need_clarification","need_customer_clarification","need_add_product_form","need_update_field_form","need_direct_update_confirmation","need_ledger_customer_name","need_ledger_customer_pick","need_ledger_new_customer_confirm","need_ledger_new_customer_form","need_ledger_missing_price","need_ledger_op_confirm"]);
        if (INTERACTIVE.has(data.type)) {
          item.status="interactive";item.interactiveData=data;saveQueue();
          isAwaitingInput=true;toggleInput(true);
          if (bubble) updateBubbleStatus(bubble,"delivered");
          renderInteractiveWidgets(data,item.id,item.originalMessage);
        } else {
          commandQueue.shift();saveQueue();isAwaitingInput=false;toggleInput(false);
          if (bubble) updateBubbleStatus(bubble,"delivered");
          if (data.cards?.length) await renderLedgerResponse(data.cards);
          else if (data.card) await renderLedgerResponse([{reply:data.reply,card:data.card}]);
          else await streamModelResponse(data.reply||"Done.");
        }
      } catch(err) {
        shimmer.remove();setNetworkProgress(false);latencyBadge.textContent="Error";
        item.status="failed";saveQueue();
        if (bubble) updateBubbleStatus(bubble,"failed");
        console.error(err);
      } finally {
        isProcessingQueue=false;
        setTimeout(()=>{if(commandQueue.length>0&&navigator.onLine)processQueue();},300);
      }
    }

    function cancelInteractiveItem(qId, baseReply, remainingList) {

    // ═══════════════════════════════════════════════════════════
    // ─── LEDGER MODE (khata app) ────────────────────────────────
    // Entirely separate code path from POS. Reuses shared low-level helpers
    // (firebaseRequest, findCustomer, commitResult, appendBalanceFootnote,
    // processCustomerPayment/CashOut/Balance/AllBalances/ExpenseAdd/
    // ListRecentTransactions/VoidTransaction/UndoLast) since those already work
    // purely off Customers/Balance + Transactions and don't touch Products/stock.
    // ═══════════════════════════════════════════════════════════

    // ═══ LEDGER AI ═══
    // Ledger mode mein koi regex / local parser / shortcut nahi hai.
    // User ka har message seedha AI ko jata hai; AI command JSON banata hai aur neeche ka executor usay chalata hai.
    const LEDGER_SYSTEM_PROMPT = `You are the brain of a Pakistani shop khata (ledger) app. The shopkeeper writes in Roman Urdu, Urdu or English. Understand what they mean and answer ONLY with JSON: {"parts":[command, ...]} in the order they were spoken. Use the exact spelling of a name if it already exists in the lists given.
Commands (field "action" + fields):
CUSTOMERS: ledger_entry{customer,items:[{product,amount,qty?}]} (maal udhaar diya; amount = total Rs of that line) | customer_payment{customer,amount} (customer ne paise diye) | customer_cash_out{customer,amount} (customer ko cash diya / khate me daala) | customer_balance{customer} | all_balances | create_customer{customer,mobile?}
SUPPLIERS: supplier_purchase{supplier,items:[{product,amount,qty?}]} (supplier se maal udhaar liya; amount = total Rs of that line) | supplier_payment{supplier,amount} (supplier ko paise diye) | supplier_balance{supplier} | all_supplier_balances | create_supplier{supplier,mobile?}
EXPENSES & CASH: expense_add{category,amount,note?} | expense_report{period: daily|weekly|monthly|yearly|lifetime} | cash_balance
ENTRIES: list_recent_transactions | void_transaction{search} | undo_last
OTHER: smart{request} for anything not listed above (rename, mobile change, delete a khata, totals, history, any question about the data) | chat{reply} for plain talk.
If the item price is not given, omit "amount". If the name is not given, omit the name field.`;

    const LEDGER_VALID_ACTIONS = new Set(["ledger_entry","expense_add","customer_payment","customer_cash_out","customer_balance","all_balances","create_customer","supplier_purchase","supplier_payment","supplier_balance","all_supplier_balances","create_supplier","expense_report","cash_balance","list_recent_transactions","void_transaction","undo_last","smart","chat"]);
    // Ledger-only interactive widget types, kept as one shared list so the queue
    // engine (pause/resume) and the multi-part runner always agree on what
    // counts as "needs the user" vs. "done".
    const LEDGER_INTERACTIVE_TYPES = ["need_ledger_customer_name","need_ledger_customer_pick","need_ledger_new_customer_confirm","need_ledger_new_customer_form","need_ledger_missing_price","need_ledger_op_confirm"];
    const LEDGER_INTERACTIVE = new Set(LEDGER_INTERACTIVE_TYPES);
    const LEDGER_NON_SAVING_ACTIONS = new Set(["customer_balance","all_balances","supplier_balance","all_supplier_balances","expense_report","cash_balance","list_recent_transactions","smart","chat"]);

    function normalizeLedgerCommand(cmd, msg) {
      // Anything the parser can't map to a known action goes to the "smart"
      // planner (which reads real data / proposes a confirmed change) instead of
      // a dead-end "samajh nahi aaya".
      const fallback = msg ? {action:"smart",request:msg} : {action:"chat",reply:"Maaf kijiye, samajh nahi aaya. Thora saaf likh dein?"};
      if (!cmd||typeof cmd!=="object"||Array.isArray(cmd)) return fallback;
      cmd.action = String(cmd.action||"").toLowerCase().trim();
      if (!LEDGER_VALID_ACTIONS.has(cmd.action)) return cmd.reply?{action:"chat",reply:String(cmd.reply)}:fallback;
      ["customer","supplier","mobile","period","category","note","search","request"].forEach(f=>{ if (cmd[f]!==undefined) cmd[f]=String(cmd[f]==null?"":cmd[f]).trim(); });
      if (!cmd.customer) delete cmd.customer;
      if (!cmd.supplier) delete cmd.supplier;
      if (!cmd.mobile) delete cmd.mobile;
      const num=v=>{const n=Number(String(v).replace(/,/g,""));return isFinite(n)?n:undefined;};
      if (cmd.amount!==undefined){const n=num(cmd.amount);if(n===undefined)delete cmd.amount;else cmd.amount=n;}
      if (Array.isArray(cmd.items)) {
        cmd.items = cmd.items.slice(0,20).map(it=>{
          if (!it||typeof it!=="object") return null;
          const o={product:String(it.product||"").trim()};
          if (it.amount!==undefined){const n=num(it.amount);if(n!==undefined&&n>0)o.amount=n;}
          if (it.qty!==undefined){const q=num(it.qty);if(q!==undefined&&q>0)o.qty=q;}
          return o.product?o:null;
        }).filter(Boolean);
      } else if (cmd.items!==undefined) delete cmd.items;
      return cmd;
    }

    // Normalizes the AI's raw reply into a flat array of individual ledger
    // commands. Accepts {parts:[...]} (multi-instruction shape), a bare single
    // command (legacy/fallback shape), or a bare array — always Array<cmd>.
    function normalizeLedgerParts(raw, msg) {
      if (raw?.__llm_error) { const e=raw.__llm_error; return [{action:"chat",reply:`${e.title}. ${e.hint}`,__card:{kind:"error",...e}}]; }
      if (!raw||typeof raw!=="object") return [normalizeLedgerCommand(raw,msg)];
      let list;
      if (Array.isArray(raw.parts)) list=raw.parts;
      else if (Array.isArray(raw)) list=raw;
      else list=[raw];
      if (!list.length) return [{action:"chat",reply:"Yeh samajh nahi aaya — thora detail se likhein, jaise: Zaheer ko 200 ki daal dia."}];
      return list.slice(0,10).map(c=>normalizeLedgerCommand(c,msg));
    }

    // ─── REAL ERROR REPORTING (no more vague "AI busy") ─────────
    // Token accounting (Ledger mode). Visible in the browser console + header badge.
    const LEDGER_TOK={last:0,session:0,calls:0};
    function ledgerLogTokens(label,u){
      const p=u?.prompt_tokens||0, c=u?.completion_tokens||0, t=u?.total_tokens||(p+c), r=u?.completion_tokens_details?.reasoning_tokens;
      LEDGER_TOK.last+=t; LEDGER_TOK.session+=t; LEDGER_TOK.calls++;
      console.log(`%c[Ledger AI] ${label} → in ${p} · out ${c}${r!==undefined?` (reasoning ${r})`:""} · total ${t} tokens | session ${LEDGER_TOK.session} (${LEDGER_TOK.calls} AI calls)`,"color:#7cacf8;font-weight:bold");
    }

    async function groqCall(payload,label="call") {
      const attempt=async(p)=>{
        let r;
        try { r=await fetch(GROQ_URL,{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${GROQ_API_KEY}`},body:JSON.stringify(p)}); }
        catch(e){ return {ok:false,kind:"network",detail:String(e?.message||e)}; }
        if (r.ok) { const d=await r.json(); ledgerLogTokens(label,d.usage); return {ok:true,content:d.choices?.[0]?.message?.content||"",finish:d.choices?.[0]?.finish_reason}; }
        let msg="",failed=""; try{ const j=await r.json(); msg=j?.error?.message||""; failed=j?.error?.failed_generation||""; }catch(e){}
        console.warn(`[Ledger AI] ${label} failed: HTTP ${r.status} ${msg}`,failed?`\nmodel output: ${failed}`:"");
        return {ok:false,kind:"http",status:r.status,detail:msg,failed};
      };
      let res=await attempt(payload);
      // 400 "failed_generation" = the model answered but not as valid JSON (or ran out of
      // tokens mid-answer). Its raw text is returned to the caller to salvage — no blind retry.
      if (!res.ok&&res.status===400&&!res.failed) { const {reasoning_effort,reasoning_format,...lite}=payload; res=await attempt(lite); }
      if (!res.ok&&(res.kind==="network"||res.status===429||res.status>=500)) { await new Promise(r=>setTimeout(r,900)); res=await attempt(payload); }
      return res;
    }
    // Pulls a JSON object out of model text (fences/think-tags/extra prose tolerated).
    function ledgerJsonFrom(text){
      const c=String(text||"").replace(/<think>[\s\S]*?<\/think>/gi,"").replace(/^```json\s*/i,"").replace(/^```\s*/i,"").replace(/\s*```$/i,"").trim();
      const i=c.indexOf("{"), j=c.lastIndexOf("}");
      if (i!==-1&&j>i) { try { return JSON.parse(c.substring(i,j+1)); } catch(e){} }
      return null;
    }
    function llmErrorInfo(res) {
      const d=String(res.detail||"").slice(0,220);
      if (res.kind==="network") return {title:"Server tak pohanch nahi saka",hint:"Internet check karein — ya browser/network Groq (api.groq.com) ko block to nahi kar raha.",detail:d||"network error"};
      if (res.kind==="parse")   return {title:"AI ka jawab samajh nahi aaya",hint:"Baat thore alag lafzon mein dobara likh kar dekhein.",detail:d};
      const st=res.status;
      if (st===401||st===403) return {title:"API key qabool nahi hui",hint:"GROQ_API_KEY galat ya expire hai — code mein sahi key daal dein.",detail:`HTTP ${st} ${d}`};
      if (st===404) return {title:"AI model nahi mila",hint:"GROQ_MODEL ka naam check karein.",detail:`HTTP ${st} ${d}`};
      if (st===413) return {title:"Data bohot bada ho gaya",hint:"Sawal ko chhota/specific karein (jaise kisi ek customer ka).",detail:`HTTP ${st} ${d}`};
      if (st===429) return {title:"Groq ki limit lag gayi (rate limit)",hint:"Kuch der ruk kar dobara try karein — free plan ki limit reset hone mein thora waqt lagta hai.",detail:`HTTP ${st} ${d}`};
      if (st>=500)  return {title:"Groq server par masla hai",hint:"Yeh unki taraf ki dikkat hai — thori der baad dobara try karein.",detail:`HTTP ${st} ${d}`};
      return {title:"AI ne request reject kar di",hint:"Yeh technical masla hai — neeche detail dekhein.",detail:`HTTP ${st} ${d}`};
    }

    // Existing khata / supplier ke naam AI ko diye jate hain taake woh sahi spelling use kare.
    async function ledgerNamesContext() {
      try {
        const [c,sp]=await Promise.all([getCustomersCached(),firebaseRequest("Suppliers","GET")]);
        const names=o=>Object.keys(o||{}).slice(0,400).map(k=>String(o[k]?.Name||k)).join(", ");
        return `Customers: ${names(c)||"-"}\nSuppliers: ${names(sp)||"-"}\n`;
      } catch(e){ return ""; }
    }

    async function requestGroqLedgerParsing(message) {
      // NOTE: gpt-oss counts hidden reasoning tokens against max_completion_tokens — keep the cap generous.
      const ctx=await ledgerNamesContext();
      const res=await groqCall({
        model: GROQ_MODEL,
        messages:[{role:"system",content:LEDGER_SYSTEM_PROMPT},{role:"user",content:`${ctx}Message: ${message}`}],
        temperature:0.1, max_completion_tokens:1500, reasoning_effort:"medium",
        reasoning_format:"hidden", response_format:{type:"json_object"}, top_p:1
      },"parse");
      const text=res.ok?res.content:res.failed;   // failed_generation = what the model actually wrote
      if (text) {
        const obj=ledgerJsonFrom(text);
        if (obj) return obj;
        const plain=String(text).replace(/<think>[\s\S]*?<\/think>/gi,"").trim();
        if (plain) return {action:"chat",reply:plain};     // model just talked — show it as chat
      }
      if (!res.ok) return {__llm_error:llmErrorInfo(res)};
      return {__llm_error:llmErrorInfo({kind:"parse",detail:res.finish==="length"?"jawab beech mein kat gaya (token limit)":"khali jawab"})};
    }

    // Har message seedha AI ko. Koi local shortcut nahi.
    async function safeUnderstandLedgerCommand(message) {
      return normalizeLedgerParts(await requestGroqLedgerParsing(message), message);
    }

    // Resolves command.customer against existing khatay. Returns:
    //  {status:"found"}        → command.customer/.customer_key set, proceed
    //  {status:"missing"}      → no customer name at all was given
    //  {status:"interactive",result:{...}} → return result straight to the UI
    async function ledgerResolveCustomer(command) {
      if (command.customer_resolved) return {status:"found"};
      if (!command.customer) return {status:"missing"};
      const customers = await getCustomersCached();
      const m = findCustomer(command.customer, customers);
      if (m.status==="found") { command.customer=m.customer.Name||m.customer._key; command.customer_key=m.customer._key; command.customer_resolved=true; return {status:"found"}; }
      if (m.status==="multiple") return {status:"interactive",result:{ok:true,type:"need_ledger_customer_pick",reply:`"${command.customer}" se milte-julte naam ke khatay hain — sahi wala chun lein, ya naya bana dein:`,options:m.matches,pending_context:command}};
      return {status:"interactive",result:{ok:true,type:"need_ledger_new_customer_confirm",reply:`"${command.customer}" ke naam se koi khata nahi mila — naya khata bana doon?`,pending_context:command}};
    }
    async function ledgerNeedsCustomerFirst(command) {
      const r = await ledgerResolveCustomer(command);
      if (r.status==="interactive") return r.result;
      if (r.status==="missing") return {ok:true,type:"need_ledger_customer_name",reply:"Accha, yeh kis ke khate mein likhna hai? Naam bata dein:",pending_context:command};
      return null;
    }
    function checkLedgerMissingAmounts(command) {
      const items=command.items||[];
      const missing=[];
      items.forEach((it,i)=>{ if (!(Number(it.amount)>0)) missing.push({product:it.product,i}); });
      if (missing.length) return {ok:true,type:"need_ledger_missing_price",reply:"In cheezon ki qeemat bata dein (Rs mein):",missing_items:missing,pending_context:command};
      return null;
    }

    async function processLedgerEntryCommit(command) {
      const customer=String(command.customer||"").trim();
      const items=command.items||[];
      if (!customer) return {ok:false,reply:"Customer ka naam batayein."};
      if (!items.length) return {ok:false,reply:"Koi item samajh nahi aaya."};
      const total=items.reduce((s,it)=>s+Number(it.amount||0),0);
      if (!(total>0)) return {ok:false,reply:"Total amount 0 ban raha hai — dobara likh dein."};
      const ck=command.customer_key||sanitizeFirebaseKey(customer);
      const updates={};
      updates[`Customers/${ck}/Name`]=customer;
      addInc(updates,`Customers/${ck}/Balance`,total);
      const txId=command.client_txn_id||("LEDGER_"+Date.now());
      const tx={id:txId,type:"ledger_entry",customer,customer_key:ck,items,total,timestamp:Date.now(),date:getTodayString()};
      updates[`Transactions/${txId}`]=tx;
      const reply = items.length===1
        ? `Theek hai, ${customer} ke khate mein ${items[0].qty>0?formatNumber(items[0].qty)+"x ":""}${items[0].product} — Rs ${formatNumber(items[0].amount)} likh diya.`
        : `Theek hai, ${customer} ke khate mein likh diya:\n${items.map(it=>`• ${it.qty>0?formatNumber(it.qty)+"x ":""}${it.product} — Rs ${formatNumber(it.amount)}`).join("\n")}\nTotal Rs ${formatNumber(total)}.`;
      return {ok:true,reply,updates,transaction:tx,card:{kind:"entry",customer,items,total,newAccount:!!command.__created}};
    }

    // Same "current balance" footnote idea as POS's appendBalanceFootnote, but
    // phrased conversationally for Ledger mode — kept separate so POS's own
    // footnote text (shared with POS-only flows) never changes.
    async function appendLedgerBalanceFootnote(res, command) {
      if (res?.ok&&res?.saved&&command?.customer) {
        try {
          const ck=command.customer_key||sanitizeFirebaseKey(command.customer);
          const bal=Number(await firebaseRequest(`Customers/${ck}/Balance`,"GET")||0);
          const line = bal>0.005 ? `Ab ${command.customer} ka kul udhaar Rs ${formatNumber(bal)} hai.`
                     : bal<-0.005 ? `${command.customer} ko ab Rs ${formatNumber(-bal)} wapis karne hain.`
                     : `${command.customer} ka hisaab ab barabar hai.`;
          res.reply=(res.reply||"")+`\n${line}`;
          if (res.card) res.card.balance=bal;
        } catch(e){}
      }
      return res;
    }

    // ─── SMART FALLBACK (AI plans what code doesn't hard-wire) ──
    // Reads: AI answers from a real data snapshot (read-only, runs immediately).
    // Writes: AI proposes a list of small ops; they are validated against a strict
    // allow-list, shown to the user as a preview, and only run after "Ok".
    // Old values are stored so the change can be undone with the normal undo/cancel.
    function validateLedgerOps(ops) {
      if (!Array.isArray(ops)||!ops.length||ops.length>20) throw new Error("Ek baar mein 1 se 20 changes hi allowed hain.");
      const seg=/^[^.#$\[\]\/]+$/;
      return ops.map(o=>{
        const op=String(o?.op||"").toLowerCase();
        const parts=String(o?.path||"").split("/");
        if (!["set","increment","delete"].includes(op)) throw new Error("Aisa change type supported nahi (sirf set / add-kam / delete).");
        if (!parts.every(p=>seg.test(p))) throw new Error("Change ka path sahi nahi ban saka.");
        const root=parts[0];
        if (root==="Customers"||root==="Suppliers") {
          if (op==="delete") { if (parts.length<2||parts.length>3) throw new Error("Delete sirf ek customer ya uski ek field ka ho sakta hai."); }
          else if (parts.length!==3) throw new Error("Change customer ki kisi ek field par hona chahiye (Name/Mobile/Balance...).");
          if (op==="increment"&&parts[2]!=="Balance") throw new Error("Number add/kam sirf balance mein ho sakta hai.");
        } else if (root==="Transactions") {
          if (op!=="set"||parts.length!==3) throw new Error("Purani entry ko sirf edit kar sakta hoon — hatane ke liye \"T2 cancel karo\" likhein.");
        } else throw new Error("Sirf khata (customers/suppliers) aur entries mein change ho sakta hai — products, stock ya cash register mein nahi.");
        const out={op,path:parts.join("/")};
        if (op==="increment") { const n=Number(o.value); if (!isFinite(n)||n===0) throw new Error("Add/kam karne ki amount sahi nahi."); out.value=n; }
        if (op==="set") {
          const v=o.value;
          if (typeof v==="number"&&isFinite(v)) out.value=v;
          else if (typeof v==="boolean") out.value=v;
          else if (typeof v==="string"&&v.length<=200) out.value=v;
          else throw new Error("Nayi value sahi nahi (sirf chhota text ya number chalega).");
        }
        if (o.prev!==undefined&&o.prev!==null&&typeof o.prev!=="object") out.prev=o.prev;
        return out;
      });
    }

    // Lean planner (~200 input tokens): local code picks only the relevant customers /
    // entries or builds totals itself, so the AI never sees the whole database.
    const LEDGER_PLANNER_PROMPT = `Khata helper(Roman Urdu). Lines starting "S " are suppliers (path Suppliers/<key>/Name|Mobile|Balance), others customers. JSON:{"m":"a|w|x","t":"..","o":[["s|i|d","path","val"]]}
a=jawab(t). w=edit(t=1 line summary,o: s set,i inc,d del; path Customers/<key>/Name|Mobile|Balance, d: Customers/<key> ya /field). x=nahi ho sakta(t=asal wajah). Naam badalna=set Name(key wahi rahegi).
Data key|balance(+=customer ne dena)|mobile. Entry: date code amt items(e maal,p payment,c charge,x kharcha).`;

    async function ledgerSmartContext(request) {
      const [customers,txAll,suppliers]=await firebaseParallelGet(["Customers","Transactions","Suppliers"]);
      const req=request.toLowerCase();
      const cs=Object.entries(customers||{}).map(([k,v])=>({key:k,name:String(v?.Name||k),bal:Number(v?.Balance||0),mob:v?.Mobile||""}));
      const txs=Object.values(txAll||{}).filter(t=>t&&!t.voided&&t.type!=="void"&&!t.ai_mirror).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
      const ss=Object.entries(suppliers||{}).map(([k,v])=>({key:k,name:String(v?.Name||k),bal:Number(v?.Balance||0),mob:v?.Mobile||"",sup:true}));
      const hit=cs.concat(ss).filter(c=>{const n=c.name.toLowerCase(); return req.includes(n)||n.split(" ").some(w=>w.length>=3&&req.includes(w));}).slice(0,3);
      const line=c=>`${c.sup?"S ":""}${c.key}|${formatNumber(c.bal)}|${c.mob}`;
      const code={ledger_entry:"e",payment:"p",cash_out:"c",expense:"x",supplier_purchase:"m",supplier_payment:"y"};
      if (hit.length) {
        const keys=new Set(hit.map(c=>c.key));
        const es=txs.filter(t=>keys.has(t.customer_key||t.supplier_key||sanitizeFirebaseKey(t.customer||t.supplier||""))).slice(0,8)
          .map(t=>`${String(t.date||"").slice(5)} ${code[t.type]||t.type} ${formatNumber(t.total||t.amount||0)} ${(t.items||[]).slice(0,4).map(i=>i.product+formatNumber(i.amount)).join(",")}`.trim());
        return hit.map(line).join("\n")+(es.length?"\n"+es.join("\n"):"");
      }
      const sum=(cut)=>{const r={e:0,p:0,c:0,x:0};txs.forEach(t=>{if((t.timestamp||0)>=cut&&code[t.type]) r[code[t.type]]+=Number(t.total||t.amount||0);});return `e${formatNumber(r.e)} p${formatNumber(r.p)} c${formatNumber(r.c)} x${formatNumber(r.x)}`;};
      const d0=new Date();d0.setHours(0,0,0,0);
      const top=cs.filter(c=>Math.abs(c.bal)>0.005).sort((a,b)=>Math.abs(b.bal)-Math.abs(a.bal)).slice(0,12).map(line).join("\n");
      return `${top}\naaj ${sum(d0.getTime())}; 7din ${sum(Date.now()-7*864e5)}`;
    }

    async function planSmartLedgerRequest(request) {
      const ctx=await ledgerSmartContext(request);
      const res=await groqCall({
        model:GROQ_MODEL,
        messages:[{role:"system",content:LEDGER_PLANNER_PROMPT},{role:"user",content:`${ctx}\nQ:${request}`}],
        temperature:0.1,max_completion_tokens:900,reasoning_effort:"low",reasoning_format:"hidden",response_format:{type:"json_object"},top_p:1
      },"smart");
      const raw=res.ok?res.content:res.failed;
      let plan=raw?ledgerJsonFrom(raw):null;
      if (!plan&&raw&&String(raw).trim()) return {mode:"answer",reply:String(raw).replace(/<think>[\s\S]*?<\/think>/gi,"").trim()};
      if (!plan) return {mode:"error",error:llmErrorInfo(res.ok?{kind:"parse",detail:res.finish==="length"?"jawab beech mein kat gaya":"khali jawab"}:res)};
      const text=String(plan.t||"");
      if (plan.m==="w") {
        const OPS={s:"set",i:"increment",d:"delete"};
        let ops;
        try { ops=validateLedgerOps((plan.o||[]).map(o=>({op:OPS[o[0]]||o[0],path:o[1],value:o[2]}))); } catch(e) { return {mode:"unsupported",reply:e.message}; }
        const prevs=await firebaseParallelGet(ops.map(o=>o.path));
        ops.forEach((o,i)=>{ const p=prevs[i]; if (p!==null&&p!==undefined&&typeof p!=="object") o.prev=p; else delete o.prev; });
        return {mode:"write",summary:text||"Yeh change hoga:",ops};
      }
      if (plan.m==="a"&&text) return {mode:"answer",reply:text};
      return {mode:"unsupported",reply:text||"Yeh request data se poori nahi ho saki — thora aur detail ke sath likh dein."};
    }

    // ─── LEDGER RESPONSE CARDS ──────────────────────────────────
    const lgE=t=>escapeHtml(String(t==null?"":t)), lgF=n=>formatNumber(n);
    const lgTime=()=>new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
    function lgAvatar(name){
      let h=0; for (const ch of String(name)) h=(h*31+ch.charCodeAt(0))%360;
      const ini=(String(name).trim()[0]||"?").toUpperCase();
      return `<div class="lg-avatar" style="background:linear-gradient(135deg,hsl(${h} 72% 60%),hsl(${(h+45)%360} 66% 46%))">${lgE(ini)}</div>`;
    }
    const lgCheck=()=>`<svg class="lg-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5"/><path d="M7 12.5l3.2 3.2L17 9"/></svg>`;
    const lgMoney=(n,cls,pre="Rs ")=>`<span class="${cls||""}" data-count="${Number(n)}" data-pre="${pre}">${pre}${lgF(n)}</span>`;
    function lgBalChip(name,bal){
      if (bal===undefined||bal===null||!isFinite(Number(bal))) return "";
      bal=Number(bal);
      if (bal>0.005)  return `<div class="lg-chip owe">⏳ Ab ${lgE(name)} ka udhaar <b>Rs ${lgF(bal)}</b></div>`;
      if (bal<-0.005) return `<div class="lg-chip credit">💙 ${lgE(name)} ko wapis dene hain <b>Rs ${lgF(-bal)}</b></div>`;
      return `<div class="lg-chip clear">✅ Hisaab barabar</div>`;
    }
    function lgSupChip(name,bal){
      if (bal===undefined||bal===null||!isFinite(Number(bal))) return "";
      bal=Number(bal);
      if (bal>0.005)  return `<div class="lg-chip owe">⏳ Ab ${lgE(name)} ko <b>Rs ${lgF(bal)}</b> dene hain</div>`;
      if (bal<-0.005) return `<div class="lg-chip credit">💙 ${lgE(name)} se <b>Rs ${lgF(-bal)}</b> wapis lene hain</div>`;
      return `<div class="lg-chip clear">✅ Hisaab barabar</div>`;
    }
    const lgExpIcon=c=>{c=String(c||"").toLowerCase();
      if (/fruit|phal/.test(c)) return "🍎"; if (/bill|bijli|gas|net|wifi/.test(c)) return "🧾"; if (/shop/.test(c)) return "🛍️";
      if (/ration|grocer|saman/.test(c)) return "🛒"; if (/khana|food|lunch|dinner/.test(c)) return "🍽️"; if (/kiray|kiraya|rent/.test(c)) return "🏠"; return "💸";};
    function lgWrap(tone,inner,cd){ return `<div class="lg-card tone-${tone}" style="--cd:${cd}s"><div class="lg-shine"></div>${inner}</div>`; }

    function lgCardHtml(c,cd){
      switch (c.kind) {

    function lgAnimateCounts(root){
      if (window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      root.querySelectorAll("[data-count]").forEach(el=>{
        const target=Number(el.dataset.count), pre=el.dataset.pre||"Rs ";
        if (!isFinite(target)) return;
        const t0=performance.now()+250, dur=800;
        const step=now=>{ if (now<t0){requestAnimationFrame(step);return;}
          const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3);
          el.textContent=pre+lgF(p<1?Math.round(target*e):target);
          if (p<1) requestAnimationFrame(step); };
        el.textContent=pre+"0"; requestAnimationFrame(step);
      });
    }

    // entries: [{reply, card}] — cards render as rich cards, card-less parts as plain chat text
    async function renderLedgerResponse(entries){
      const row=document.createElement("div");row.className="message-row model";

      row.innerHTML=`${AVATAR_HTML}<div class="lg-stack">${html}</div>`;
      chatFeed.appendChild(row);
      lgAnimateCounts(row);
      [0,300,700,1100].forEach(t=>setTimeout(scrollBottom,t));
    }

    function ledgerCombine(replies){
      const list=replies.filter(Boolean).map(r=>typeof r==="string"?{reply:r}:r);
      const reply=list.map(r=>r.reply).filter(Boolean).join("\n\n");
