<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>Sunny AI POS - Ultra Fast</title>
  
  <link rel="preconnect" href="https://api.groq.com" crossorigin>
  <link rel="dns-prefetch" href="https://api.groq.com">

  <style>
    :root {
      --bg-main: #131314; --surface: #1e1f20; --surface-variant: #282a2c;
      --text-primary: #e3e3e3; --text-secondary: #c4c7c5; --text-muted: #8e918f;
      --accent-blue: #a8c7fa; --accent-spark: #7cacf8; --input-bg: #1e1f20;
      --border-subtle: #444746; --danger-color: #f28b82; --warning-color: #fdd663;
      --success-green: #34a853; --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family); -webkit-tap-highlight-color: transparent; }
    html, body { background-color: var(--bg-main); color: var(--text-primary); width: 100%; height: 100%; height: 100dvh; overflow: hidden; position: fixed; }
    body { display: flex; flex-direction: column; }

    header { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background: rgba(19, 19, 20, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255, 255, 255, 0.06); z-index: 10; position: relative; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 1.1rem; font-weight: 500; }
    .gemini-spark { width: 20px; height: 20px; fill: url(#gemini-gradient); }
    .status-group { display: flex; align-items: center; gap: 8px; }
    .connection-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success-green); box-shadow: 0 0 6px var(--success-green); transition: background 0.3s, box-shadow 0.3s; }
    .tag-badge { font-size: 0.75rem; background: var(--surface-variant); color: var(--text-secondary); padding: 3px 9px; border-radius: 12px; border: 1px solid var(--border-subtle); font-family: monospace; }
    
    .network-bar { position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; background: transparent; overflow: hidden; }
    .network-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, var(--accent-spark), var(--accent-blue)); transition: width 0.3s ease; }
    .network-bar.active .network-bar-fill { width: 80%; animation: pulseProgress 1.8s infinite ease-in-out; }
    @keyframes pulseProgress { 0% { transform: translateX(-100%); width: 40%; } 50% { transform: translateX(50%); width: 60%; } 100% { transform: translateX(150%); width: 40%; } }

    main { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 16px; display: flex; flex-direction: column; gap: 20px; max-width: 800px; width: 100%; margin: 0 auto; scroll-behavior: smooth; }
    .message-row { display: flex; gap: 12px; width: 100%; contain: layout; }
    .message-row.user { justify-content: flex-end; }
    .avatar { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--surface); }
    
    .content-block { max-width: 84%; font-size: 0.94rem; line-height: 1.55; color: var(--text-primary); white-space: pre-wrap; word-break: break-word; }
    .message-row.user .content-block { background: var(--surface); padding: 10px 16px; border-radius: 18px; border-bottom-right-radius: 4px; color: #ffffff; display: flex; flex-direction: column; align-items: flex-end; }
    
    .quote-block { font-size: 0.82rem; color: var(--text-secondary); background: rgba(124, 172, 248, 0.1); padding: 6px 10px; border-left: 3px solid var(--accent-spark); border-radius: 4px; margin-bottom: 10px; font-style: italic; word-break: break-word; }
    .msg-meta { display: flex; align-items: center; gap: 6px; font-size: 0.7rem; color: var(--text-muted); margin-top: 5px; }
    .status-tick { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; }
    
    .mini-spinner { width: 10px; height: 10px; border: 1.5px solid rgba(255, 255, 255, 0.2); border-top-color: var(--accent-blue); border-radius: 50%; animation: spin 0.75s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .message-row.model .content-block { padding-top: 2px; }

    .shimmer-container { display: flex; flex-direction: column; gap: 8px; width: 220px; padding-top: 6px; }
    .shimmer-line { height: 13px; border-radius: 6px; background: linear-gradient(90deg, #1e1f20 25%, #2d2f31 50%, #1e1f20 75%); background-size: 200% 100%; animation: geminiShimmer 1.4s infinite; }
    .shimmer-line.short { width: 55%; }
    @keyframes geminiShimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    .interactive-card { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
    .actions-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .option-chip { background: var(--surface); border: 1px solid var(--border-subtle); color: var(--text-primary); padding: 8px 14px; border-radius: 12px; font-size: 0.86rem; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.2s; }
    .option-chip:hover:not(:disabled) { background: var(--surface-variant); border-color: var(--accent-spark); }
    .option-chip.cancel-chip { color: var(--danger-color); border-color: rgba(242, 139, 130, 0.3); }
    .option-chip:disabled { opacity: 0.45; cursor: not-allowed; pointer-events: none; }
    .chip-meta { font-size: 0.72rem; color: var(--text-muted); background: rgba(0, 0, 0, 0.3); padding: 2px 6px; border-radius: 6px; }

    .manual-price-box { background: var(--surface); border: 1px solid var(--border-subtle); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .manual-item-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 6px; }
    .manual-item-name { font-size: 0.88rem; color: var(--text-secondary); flex: 1; }
    .manual-input { width: 120px; background: #131314; border: 1px solid var(--border-subtle); border-radius: 8px; padding: 7px 10px; color: #fff; font-size: 0.9rem; outline: none; text-align: right; }
    .manual-input:focus { border-color: var(--accent-blue); }
    .form-btn-group { display: flex; gap: 8px; margin-top: 6px; }
    .submit-prices-btn { background: var(--accent-blue); color: #04101d; font-weight: 600; border: none; padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 0.86rem; flex: 1; }
    .cancel-form-btn { background: rgba(242, 139, 130, 0.15); color: var(--danger-color); font-weight: 600; border: 1px solid rgba(242, 139, 130, 0.3); padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 0.86rem; }
    .submit-prices-btn:disabled, .cancel-form-btn:disabled { opacity: 0.5; }

    .input-wrapper { flex-shrink: 0; padding: 10px 16px 18px 16px; max-width: 800px; width: 100%; margin: 0 auto; }
    .input-box { background: var(--input-bg); border-radius: 30px; display: flex; align-items: center; padding: 5px 12px 5px 18px; border: 1px solid transparent; transition: border-color 0.2s, background 0.2s; }
    .input-box:focus-within { border-color: var(--border-subtle); background: #232427; }
    .input-box input { flex: 1; background: transparent; border: none; outline: none; color: var(--text-primary); font-size: 0.98rem; line-height: 1.5; }
    .input-box input::placeholder { color: var(--text-muted); }
    .input-box input:disabled { opacity: 0.5; }
    .send-btn { background: transparent; border: none; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted); transition: color 0.2s; }
    .send-btn.active { color: var(--accent-blue); }
    .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  </style>
</head>
<body>

  <svg style="width:0;height:0;position:absolute;" aria-hidden="true" focusable="false">
    <linearGradient id="gemini-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7cacf8" /><stop offset="50%" stop-color="#9b7bf7" /><stop offset="100%" stop-color="#d96570" />
    </linearGradient>
  </svg>

  <header>
    <div class="brand">
      <svg class="gemini-spark" viewBox="0 0 24 24"><path d="M12 2C12 7.52285 7.52285 12 2 12C7.52285 12 12 16.4771 12 22C12 16.4771 16.4771 12 22 12C16.4771 12 12 7.52285 12 2Z"/></svg>
      Sunny AI POS
    </div>
    <div class="status-group">
      <div class="connection-dot" id="connDot" title="Live Link Active"></div>
      <div class="tag-badge" id="latencyBadge">True Semantic v1.0</div>
    </div>
    <div class="network-bar" id="networkBar"><div class="network-bar-fill"></div></div>
  </header>

  <main id="chatFeed">
    <div class="message-row model">
      <div class="avatar"><svg class="gemini-spark" viewBox="0 0 24 24"><path d="M12 2C12 7.52285 7.52285 12 2 12C7.52285 12 12 16.4771 12 22C12 16.4771 16.4771 12 22 12C16.4771 12 12 7.52285 12 2Z"/></svg></div>
      <div class="content-block">Salam! Ab main rigid rules se azaad hoon. "Udhaar", "Khata", "Lene hain", "Balance"—jo marzi bolein, main ek insaan ki tarah neeyat samajh kar action lunga. ⚡</div>
    </div>
  </main>

  <div class="input-wrapper">
    <form class="input-box" id="commandForm" onsubmit="handleFormSubmit(event)">
      <input type="text" id="userInput" placeholder="Type sale, report, search, or chat..." autocomplete="off" />
      <button type="submit" id="submitBtn" class="send-btn" disabled><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
    </form>
  </div>

  <script>
    // ---------------------------------------------------------
    // CONFIGURATION
    // ---------------------------------------------------------
    const FIREBASE_URL = "https://shop-pos-59971-default-rtdb.firebaseio.com";
    const GROQ_URL = "https://sunnypos.iamhasnainyousaf.workers.dev/";
    const GROQ_MODELS = ["openai/gpt-oss-20b"];
    
    const PRODUCT_CACHE_KEY = "SUNNY_PRODUCTS_CACHE_V32";
    const CUSTOMER_CACHE_KEY = "SUNNY_CUSTOMERS_CACHE_V1";
    const CATALOG_INDEX_KEY = "SUNNY_AI_CATALOG_VOCABULARY";
    const QUEUE_KEY = "sunny_pos_queue";

    const chatFeed = document.getElementById("chatFeed");
    const userInput = document.getElementById("userInput");
    const submitBtn = document.getElementById("submitBtn");
    const latencyBadge = document.getElementById("latencyBadge");
    const connDot = document.getElementById("connDot");
    const networkBar = document.getElementById("networkBar");

    // ---------------------------------------------------------
    // FIREBASE REST INTERFACE
    // ---------------------------------------------------------
    async function firebaseRequest(path, method = "GET", data = null) {
      const url = `${FIREBASE_URL}/${path.replace(/^\/+|\/+$/g, "")}.json`;
      const options = { method: method, headers: {} };
      if (data !== null) {
        options.headers["Content-Type"] = "application/json";
        options.body = JSON.stringify(data);
      }
      const response = await fetch(url, options);
      if (!response.ok) return null;
      return await response.json();
    }

    async function firebaseParallelGet(paths) {
      const requests = paths.map(p => fetch(`${FIREBASE_URL}/${p.replace(/^\/+|\/+$/g, "")}.json`));
      const responses = await Promise.all(requests);
      return await Promise.all(responses.map(async r => r.ok ? await r.json() : null));
    }

    // ---------------------------------------------------------
    // CACHING & DATA SYNC
    // ---------------------------------------------------------
    async function getProductsCached() {
      const cached = localStorage.getItem(PRODUCT_CACHE_KEY);
      if (cached) {
          const parsed = JSON.parse(cached);
          if (Date.now() - parsed.timestamp < 300000) return parsed.data;
      }
      const products = await firebaseRequest("Products", "GET") || {};
      localStorage.setItem(PRODUCT_CACHE_KEY, JSON.stringify({timestamp: Date.now(), data: products}));
      return products;
    }

    async function getCustomersCached() {
      const cached = localStorage.getItem(CUSTOMER_CACHE_KEY);
      if (cached) {
          const parsed = JSON.parse(cached);
          if (Date.now() - parsed.timestamp < 300000) return parsed.data;
      }
      const customers = await firebaseRequest("Customers", "GET") || {};
      localStorage.setItem(CUSTOMER_CACHE_KEY, JSON.stringify({timestamp: Date.now(), data: customers}));
      return customers;
    }

    function clearCaches() { 
      localStorage.removeItem(PRODUCT_CACHE_KEY); 
      localStorage.removeItem(CUSTOMER_CACHE_KEY); 
    }

    async function syncInventoryToAIBrain() {
      clearCaches();
      const products = await firebaseRequest("Products", "GET") || {};
      const keys = Object.keys(products);
      if (!keys.length) return { ok: false, reply: "⚠️ Firebase mein koi products nahi mile." };

      const uniqueNames = new Set();
      keys.forEach(k => {
        const name = (products[k].Name) ? String(products[k].Name).trim() : k.trim();
        if (name) uniqueNames.add(name);
      });

      localStorage.setItem(CATALOG_INDEX_KEY, JSON.stringify(Array.from(uniqueNames)));
      return { ok: true, reply: `🧠 AI Synced! Total ${Array.from(uniqueNames).length} items cached.` };
    }

    // ---------------------------------------------------------
    // PURE SEMANTIC AI BRAIN (NO HARDCODED RULE TRAPS)
    // ---------------------------------------------------------
    function preprocessMessage(text) {
      return text.replace(/\b(aur|or|te|and)\b/gi, "+")
        .replace(/,/g, "+")
        .replace(/\+/g, " + ")
        .replace(/\s+/g, " ")
        .trim();
    }

    async function requestGroqParsingWithFallback(message, products) {
      const systemPrompt = `Sunny AI POS. Universal Semantic Brain. Return ONLY valid JSON.
Actions: sale, return, stock, report, chat, customer_balance, customer_payment, customer_cash_out, add_new_product_form, update_price_request, update_cost_request, update_stock_request, update_price_direct, update_cost_direct, update_stock_direct, update_stock_add, low_stock, list_products

COGNITIVE INSTRUCTIONS:
1. Act like an intelligent human store manager. Understand the user's intent implicitly, regardless of how they phrase it, use slang, or make typos.
2. LANGUAGE & TONE MIRRORING: Always mirror the user's exact language, script, dialect, and tone in the "reply" field when talking or prompting.
3. CORE INTENT MAPPING:
   - CUSTOMER BALANCE / UDHAAR INQUIRY: Any question checking a customer's ledger, balance, dues, "khata", "hisaab", "udhaar dena/lena" -> {"action":"customer_balance","customer":"CustomerName"}
   - SALE (Cash / Credit): Customer name + items -> credit sale. Amount-based sale ("200 ki daal") -> amount sale.
   - RETURNS: Any phrasing indicating wapsi or returning items -> {"action":"return", ...}
   - STOCK / PRICE INQUIRY: Inquiring about stock or price ("Pepsi ka stock dikhao", "batao kitna hai") -> {"action":"stock","product":"ProductName"}
   - MODIFICATIONS / UPDATES: Changing prices, costs, or stock levels (with or without explicit values) -> appropriate update actions.
   - CHAT / CONVERSATION: General greetings or chat -> {"action":"chat","reply":"[Mirror user language/style]"}

OUTPUT FORMAT: Return ONLY a valid JSON object. No explanations.`;

      let lastError = "";

      for (let i = 0; i < GROQ_MODELS.length; i++) {
        const payload = { 
          model: GROQ_MODELS[i], 
          messages: [{ role: "system", content: systemPrompt }, { role: "user", content: `Input: "${message}"` }], 
          temperature: 1, 
          max_completion_tokens: 250,
          reasoning_effort: "low",
          top_p: 1
        };

        try {
          const response = await fetch(GROQ_URL, {
            method: "post", 
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(payload)
          });
          
          if (!response.ok) {
            if(response.status === 404) continue; 
            throw new Error(`HTTP ${response.status}`);
          }
          
          const data = await response.json();
          let content = data.choices[0].message.content || "";
          content = content.replace(/^```json\s*/i, "").replace(/^```\s*/i, "").replace(/\s*```$/i, "").trim();
          const firstBrace = content.indexOf("{");
          const lastBrace = content.lastIndexOf("}");
          if (firstBrace !== -1 && lastBrace !== -1) content = content.substring(firstBrace, lastBrace + 1);
          
          try {
            return JSON.parse(content);
          } catch(pe) {
            return { action: "chat", reply: content || "Maaf kijiye, samajh nahi aaya." };
          }
        } catch(e) {
          lastError = e.message;
          await new Promise(r => setTimeout(r, 800));
        }
      }
      return { action: "chat", reply: "Network or AI server busy. Please try again." };
    }

    async function safeUnderstandCommand(message, products) {
      const lower = message.toLowerCase().trim();
      
      // Explicit routing for common standard queries to bypass AI
      if (/^(stats|report|reports|aj ki report|aaj ki report|today report|today stats|aaj ki sale|aj ki sale|total sale|total naqad sale|total naqad sales|naqad sale|sale dikhao)$/.test(lower)) return { action: "report", period: "daily" };
      if (/^(yesterday report|kal ki report|pichle din|yesterday stats|yesterday|kal|kal ki sale)$/.test(lower)) return { action: "report", period: "yesterday" };
      if (/^(is month|is mahine|this month|monthly report|is month ki report|this month stats|is month ki sale)$/.test(lower)) return { action: "report", period: "monthly" };
      if (/^(pichle month|last month|previous month|pichlay mahine)$/.test(lower)) return { action: "report", period: "previous_month" };
      
      if (/^(chat history|show chat history|pichli chat|last 7 days chat|history dikhao)$/.test(lower)) return { action: "chat_history" };
      if (/^(all products|list products|list items|sari items|sab saman|tamam products|products list)$/.test(lower)) return { action: "list_products" };
      if (/^(low stock|kam stock|khatam hone wala saman)$/.test(lower)) return { action: "low_stock" };

      // ZERO-AI BYPASS FOR SINGLE WORD ITEMS (Super Fast & Accurate Sale)
      const words = lower.split(/\s+/);
      if (words.length === 1 && !/^(stats|report|reports|chat|wapis|return)$/.test(lower)) {
         return { action: "sale", payment: "cash", items: [{ product: message.trim(), qty: 1 }] };
      }

      return await requestGroqParsingWithFallback(message, products);
    }

    // ---------------------------------------------------------
    // ROBUST FUZZY FINDER & MATCHERS (TOKEN-LEVEL TYPO TOLERANCE)
    // ---------------------------------------------------------
    function sanitizeFirebaseKey(key) { return String(key || "").replace(/[.#$\[\]\/]/g, "_").trim(); }
    function canonicalProductName(text) { text = String(text || ""); try { text = decodeURIComponent(text); } catch (e) {} return text.toLowerCase().trim().replace(/\s+/g, " "); }
    function normalizeForMatching(text) { return canonicalProductName(text).replace(/[^a-z0-9]+/gi, " ").replace(/\s+/g, " ").trim(); }
    
    function levenshteinDistance(a, b) {
      if (a.length === 0) return b.length; if (b.length === 0) return a.length;
      const matrix = [];
      for (let i = 0; i <= a.length; i++) matrix[i] = [i];
      for (let j = 0; j <= b.length; j++) matrix[0][j] = j;
      for (let i = 1; i <= a.length; i++) {
        for (let j = 1; j <= b.length; j++) {
          const cost = a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1;
          matrix[i][j] = Math.min(matrix[i - 1][j] + 1, matrix[i][j - 1] + 1, matrix[i - 1][j - 1] + cost);
        }
      }
      return matrix[a.length][b.length];
    }
    
    function similarityScore(a, b) {
      a = normalizeForMatching(a); b = normalizeForMatching(b);
      if (!a || !b) return 0; if (a === b) return 100;
      const max = Math.max(a.length, b.length);
      return !max ? 100 : Math.round((1 - levenshteinDistance(a, b) / max) * 100);
    }

    function findProduct(searchName, products) {
      const query = canonicalProductName(searchName), nQ = normalizeForMatching(searchName);
      if (!query) return { status: "not_found" };

      const candidates = [], keys = Object.keys(products || {});
      
      keys.forEach(k => {
        const p = products[k] || {};
        const pName = canonicalProductName(p.Name || k);
        const pNorm = normalizeForMatching(p.Name || k);
        
        if (nQ === pNorm || query === pName) {
          candidates.push({ product: { ...p, _key: k }, score: 100 });
          return;
        }

        const queryWords = nQ.split(" ");
        const dbWords = pNorm.split(" ");
        
        let maxWordScore = 0;
        queryWords.forEach(qw => {
          dbWords.forEach(dw => {
            const score = similarityScore(qw, dw);
            if (score > maxWordScore) maxWordScore = score;
          });
        });

        const fullScore = similarityScore(nQ, pNorm);
        const bestScore = Math.max(maxWordScore, fullScore);

        if (bestScore >= 60) {
          candidates.push({ product: { ...p, _key: k }, score: bestScore });
        }
      });

      if (!candidates.length) return { status: "not_found" };
      candidates.sort((a, b) => b.score - a.score);
      const best = candidates[0];
      if (best.score < 60) return { status: "not_found" };

      const eligible = candidates.filter(x => x.score >= 60 && (best.score - x.score) <= 10);
      if (eligible.length > 1) {
        return { 
          status: "multiple", 
          matches: eligible.slice(0, 5).map(x => ({ 
            key: String(x.product._key), 
            name: String(x.product.Name || x.product._key), 
            price: Number(x.product.Price || 0), 
            stock: Number(x.product.Stock || 0) 
          })) 
        };
      }

      return { status: "found", product: best.product };
    }

    function findCustomer(searchName, customers) {
      if (!searchName) return { status: "not_found" };
      const query = canonicalProductName(searchName), nQ = normalizeForMatching(searchName);
      if (!query) return { status: "not_found" };

      const candidates = [], keys = Object.keys(customers || {});
      
      for (let i = 0; i < keys.length; i++) {
        const cName = customers[keys[i]].Name || keys[i];
        if (canonicalProductName(cName) === query) {
          return { status: "found", customer: { _key: keys[i], Name: cName } };
        }
      }

      keys.forEach(k => {
        const cName = customers[k].Name || k, n = canonicalProductName(cName);
        let score = 0;
        
        if (n === query) {
          score = 100;
        } else if (n.includes(query) || query.includes(n)) {
          let diff = Math.abs(n.length - query.length);
          score = 90 - (diff * 2); 
        } else {
          score = Math.round((similarityScore(query, n) + similarityScore(query, canonicalProductName(k)))/2);
        }
        
        if (score >= 60) candidates.push({ customer: { _key: k, Name: cName }, score: score, canonicalName: n });
      });

      if (!candidates.length) return { status: "not_found" };
      const unique = candidates.sort((a, b) => b.score - a.score);
      const best = unique[0];
      
      if (best.score < 60) return { status: "not_found" };
      if (best.score >= 90) return { status: "found", customer: best.customer };
      
      const eligible = unique.filter(x => x.score >= 60 && (best.score - x.score) <= 15).slice(0, 4);
      return { status: "multiple", matches: eligible.map(x => ({ key: String(x.customer._key), name: String(x.customer.Name) })) };
    }

    function formatNumber(value) {
      const n = Number(value); if (!isFinite(n)) return "0";
      if (Math.abs(n - Math.round(n)) < 0.000001) return String(Math.round(n));
      return n.toFixed(3).replace(/0+$/, "").replace(/\.$/, "");
    }

    function getTodayString() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function getStatsBucketPaths(date) {
      const d = date || new Date();
      const daily = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const dCopy = new Date(d.getTime()); dCopy.setHours(0, 0, 0, 0); dCopy.setDate(dCopy.getDate() + 3 - (dCopy.getDay() + 6) % 7);
      const week1 = new Date(dCopy.getFullYear(), 0, 4);
      const weekly = `${dCopy.getFullYear()}-W${("0" + (1 + Math.round(((dCopy - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7))).slice(-2)}`;
      const monthly = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      return { daily: `Stats/Daily/${daily}`, weekly: `Stats/Weekly/${weekly}`, monthly: `Stats/Monthly/${monthly}`, yearly: `Stats/Yearly/${d.getFullYear()}`, lifetime: "Stats/Lifetime/All" };
    }

    function applyTransactionToStats(stats, transaction) {
      if (!stats.Products) stats.Products = {};
      if (transaction.type === "sale") {
        let totalCost = 0;
        (transaction.items || []).forEach(item => {
          const qty = Number(item.qty || 0), cost = Number(item.cost || 0), revenue = Number(item.total !== undefined ? item.total : qty * Number(item.price || 0)), itemCost = qty * cost;
          totalCost += itemCost;
          const productKey = sanitizeFirebaseKey(canonicalProductName(item.product));
          if (!stats.Products[productKey]) stats.Products[productKey] = { Name: String(item.product || "").trim(), Qty: 0, TimesSold: 0, Revenue: 0, Cost: 0, Profit: 0 };
          const ps = stats.Products[productKey];
          ps.Qty = Number(ps.Qty || 0) + qty; ps.TimesSold = Number(ps.TimesSold || 0) + 1;
          ps.Revenue = Number(ps.Revenue || 0) + revenue; ps.Cost = Number(ps.Cost || 0) + itemCost; ps.Profit = Number(ps.Profit || 0) + (revenue - itemCost);
        });
        stats.TotalSales = Number(stats.TotalSales || 0) + Number(transaction.total || 0);
        stats.TotalCost = Number(stats.TotalCost || 0) + totalCost;
        stats.TotalProfit = Number(stats.TotalProfit || 0) + (Number(transaction.total || 0) - totalCost);
        stats.SaleCount = Number(stats.SaleCount || 0) + 1;
        if (String(transaction.payment || "").toLowerCase() === "credit") stats.TotalCredit = Number(stats.TotalCredit || 0) + Number(transaction.total || 0); else stats.TotalCash = Number(stats.TotalCash || 0) + Number(transaction.total || 0);
      } else if (transaction.type === "return") {
        let returnCost = 0;
        (transaction.items || []).forEach(item => {
          const qty = Number(item.qty || 0), cost = Number(item.cost || 0), revenue = Number(item.total !== undefined ? item.total : qty * Number(item.price || 0)), itemCost = qty * cost;
          returnCost += itemCost;
          const productKey = sanitizeFirebaseKey(canonicalProductName(item.product));
          if (!stats.Products[productKey]) stats.Products[productKey] = { Name: String(item.product || "").trim(), Qty: 0, TimesSold: 0, Revenue: 0, Cost: 0, Profit: 0 };
          const ps = stats.Products[productKey];
          ps.Qty = Math.max(0, Number(ps.Qty || 0) - qty); ps.Revenue = Number(ps.Revenue || 0) - revenue; ps.Cost = Number(ps.Cost || 0) - itemCost; ps.Profit = Number(ps.Profit || 0) - (revenue - itemCost);
        });
        stats.TotalSales = Number(stats.TotalSales || 0) - Number(transaction.total || 0);
        stats.TotalCost = Number(stats.TotalCost || 0) - returnCost;
        stats.TotalProfit = Number(stats.TotalProfit || 0) - (Number(transaction.total || 0) - returnCost);
      } else if (transaction.type === "payment") {
        stats.CashIn = Number(stats.CashIn || 0) + Number(transaction.amount || 0);
      } else if (transaction.type === "cash_out") {
        stats.CashOut = Number(stats.CashOut || 0) + Number(transaction.amount || 0);
      }
    }

    async function buildStatsPatchClient(transaction) {
      const timestamp = Number(transaction.timestamp || 0);
      if (!timestamp) return {};
      const paths = getStatsBucketPaths(new Date(timestamp));
      const patch = {};
      
      const keys = Object.keys(paths);
      const fetchPaths = keys.map(k => paths[k]);
      const results = await firebaseParallelGet(fetchPaths);
      
      keys.forEach((period, idx) => {
        const path = paths[period];
        let existing = results[idx];
        if (!existing || typeof existing !== "object") existing = { TotalSales: 0, TotalCost: 0, TotalProfit: 0, TotalCredit: 0, TotalCash: 0, SaleCount: 0, CashIn: 0, CashOut: 0, Products: {} };
        applyTransactionToStats(existing, transaction);
        patch[path] = existing;
      });
      return patch;
    }

    function processListProducts(products) {
      const keys = Object.keys(products || {});
      if (!keys.length) return { ok: true, reply: "📭 Firebase mein koi products nahi mile." };
      let reply = "📦 All Products Catalog:\n\n";
      keys.forEach((k, idx) => {
        const p = products[k];
        reply += `${idx + 1}. ${p.Name || k} \n   Price: Rs ${formatNumber(p.Price || 0)} | Stock: ${formatNumber(p.Stock || 0)} ${p.Unit || 'pcs'} | Cost: Rs ${formatNumber(p.Cost || 0)}\n\n`;
      });
      return { ok: true, reply: reply.trim() };
    }

    function processLowStock(products) {
      const keys = Object.keys(products || {});
      const lowItems = keys.filter(k => Number(products[k].Stock || 0) <= 5);
      if (!lowItems.length) return { ok: true, reply: "✅ Sab products ka stock theek hai (Low stock par koi item nahi hai)." };
      let reply = "⚠️ Low Stock Products (Stock <= 5):\n\n";
      lowItems.forEach((k, idx) => {
        const p = products[k];
        reply += `${idx + 1}. ${p.Name || k} — Current Stock: ${formatNumber(p.Stock || 0)} ${p.Unit || 'pcs'}\n`;
      });
      return { ok: true, reply: reply.trim() };
    }

    function processStock(command, products) {
      let p;
      if (products[command.product]) {
        p = { ...products[command.product], _key: command.product };
      } else {
        const match = findProduct(command.product, products);
        if (match.status === "not_found") return { ok: false, reply: `❌ Product nahi mila: ${command.product}` };
        if (match.status === "multiple") return { 
          ok: true, type: "need_clarification", 
          reply: `⚠️ "${command.product}" ke liye ek se zyada products match huay hain. Sahi product select karein:`,
          options: match.matches, pending_context: command 
        };
        p = match.product;
      }
      return { ok: true, reply: `📦 ${p.Name || p._key}\nStock: ${formatNumber(p.Stock || 0)} ${p.Unit || 'pcs'}\nSale Price: Rs ${formatNumber(p.Price || 0)}\nCost: Rs ${formatNumber(p.Cost || 0)}` };
    }

    async function processSale(command, products) {
      const items = command.items || [];
      if (!items.length) return { ok: false, reply: "❌ Product aur quantity batayein." };

      const customer = command.customer ? String(command.customer).trim() : "";
      const rawPayment = String(command.payment || "").toLowerCase().trim();
      let payment = "cash";
      if (customer && rawPayment !== "cash" && rawPayment !== "naqad") payment = "credit";
      else if (rawPayment === "credit" || rawPayment === "udhaar") payment = "credit";

      const missingItems = [];
      for (let i = 0; i < items.length; i++) {
        const itm = items[i];
        if (itm.is_misc || itm._resolvedProduct) continue;
        const match = findProduct(itm.product, products);
        if (match.status === "not_found") missingItems.push({ index: i, product: itm.product, qty: itm.qty || 1, amount: itm.amount || null });
        else if (match.status === "multiple") {
          return {
            ok: true, type: "need_clarification",
            reply: `⚠️ "${itm.product}" ke liye ek se zyada products match huay hain. Sahi product select karein:`,
            options: match.matches, pending_context: { action: "sale", customer, payment, target_index: i, items }
          };
        }
      }

      if (missingItems.length > 0) {
        return {
          ok: true, type: "need_missing_resolution",
          reply: `⚠️ Yeh products database mein nahi mile:\n👉 ${missingItems.map(m => `"${m.product}"`).join(", ")}\n\nKya missing items ko skip karke baqi bechna hai, ya unlisted price lagani hai?`,
          missing_items: missingItems, pending_context: { action: "sale", customer, payment, items }
        };
      }

      for (let i = 0; i < items.length; i++) {
        if (items[i].is_misc || items[i]._resolvedProduct) continue;
        const match = findProduct(items[i].product, products);
        if (match.status === "multiple") {
          return {
            ok: true, type: "need_clarification",
            reply: `⚠️ "${items[i].product}" ke liye ek se zyada products match huay hain. Sahi product select karein:`,
            options: match.matches, pending_context: { action: "sale", customer, payment, target_index: i, items }
          };
        }
      }

      const updates = {};
      const transactionItems = [];
      let total = 0;

      for (let i = 0; i < items.length; i++) {
        const item = items[i];
        if (item.is_misc) {
          const miscAmount = Number(item.amount || item.price || item.qty || 0);
          if (miscAmount > 0) {
            total += miscAmount;
            transactionItems.push({ product: item.product || "Khula Misc", qty: 1, price: miscAmount, cost: 0, total: miscAmount, is_misc: true });
          }
          continue;
        }

        let p = item._resolvedProduct || findProduct(item.product, products).product;
        const price = Number(p.Price || 0);
        if (price <= 0) return { ok: false, reply: `❌ ${p.Name || p._key} ka sale price set nahi hai.` };

        let saleTotal = 0, finalQty = 0;
        if (item.amount > 0) { saleTotal = Number(item.amount); finalQty = saleTotal / price; } 
        else if (item.qty > 0) { finalQty = Number(item.qty); saleTotal = finalQty * price; } 
        else { finalQty = 1; saleTotal = price; }

        const currentStock = Number(p.Stock || 0);
        if (finalQty > (currentStock + 0.001)) return { ok: false, reply: `❌ ${p.Name || p._key} ka stock sirf ${formatNumber(currentStock)} hai.` };

        updates[`Products/${sanitizeFirebaseKey(p._key)}/Stock`] = Math.max(0, currentStock - finalQty);
        total += saleTotal;
        transactionItems.push({ product: p.Name || p._key, qty: finalQty, price, cost: Number(p.Cost||0), total: saleTotal });
      }

      const transactionId = command.client_txn_id || ("T" + Date.now());
      const transaction = { id: transactionId, client_txn_id: command.client_txn_id||"", type: "sale", items: transactionItems, total, customer, payment, timestamp: Date.now(), date: getTodayString() };
      updates[`Transactions/${transactionId}`] = transaction;

      const parallelFetches = [];
      let custIndex = -1, cashIndex = -1;

      if (customer && payment === "credit") {
        parallelFetches.push(`Customers/${sanitizeFirebaseKey(customer)}/Balance`);
        custIndex = parallelFetches.length - 1;
      }
      if (payment === "cash") {
        parallelFetches.push(`CashManagement`);
        cashIndex = parallelFetches.length - 1;
      }

      if (parallelFetches.length > 0) {
        const responses = await firebaseParallelGet(parallelFetches);
        if (custIndex !== -1) {
          updates[`Customers/${sanitizeFirebaseKey(customer)}/Balance`] = Number(responses[custIndex] || 0) + total;
          updates[`Customers/${sanitizeFirebaseKey(customer)}/Name`] = customer;
        }
        if (cashIndex !== -1) {
          updates[`CashManagement/CashInHand`] = Number((responses[cashIndex] || {}).CashInHand || 0) + total;
        }
      }

      const statsPatch = await buildStatsPatchClient(transaction);
      Object.assign(updates, statsPatch);

      let reply = "✅ Sale recorded\n" + transactionItems.map(x => x.is_misc ? `➕ Rs ${formatNumber(x.total)} (${x.product})` : `${formatNumber(x.qty)} × ${x.product} (Rs ${formatNumber(x.total)})`).join("\n") + `\n💰 Total: Rs ${formatNumber(total)}` + (payment === "cash" ? "\n💵 Naqad" : "\n🧾 Udhaar") + (customer ? `\n👤 ${customer}` : "");

      return { ok: true, type: "completed", reply, transaction, updates, saved_atomically: false }; 
    }

    async function processReturn(command, products) {
      const items = command.items || [];
      if (!items.length) return { ok: false, reply: "❌ Return item aur miqdaar batayein." };

      const customer = command.customer ? String(command.customer).trim() : "";

      const updates = {};
      const transactionItems = [];
      let total = 0;

      for (let i = 0; i < items.length; i++) {
        const item = items[i];
        let cleanProductName = String(item.product || "").replace(/\b(wapis|wapos|wapas|return)\b/gi, "").trim();
        const match = findProduct(cleanProductName, products);

        if (match.status === "multiple") {
          return {
            ok: true, type: "need_clarification",
            reply: `⚠️ "${cleanProductName}" ke liye ek se zyada products match huay hain. Sahi product select karein:`,
            options: match.matches, pending_context: { action: "return", customer, items }
          };
        }
        if (match.status !== "found") return { ok: false, reply: `❌ Return product database mein nahi mila: ${cleanProductName}` };

        const p = match.product;
        const price = Number(p.Price || 0);
        const cost = Number(p.Cost || 0);
        let returnQty = 0, lineTotal = 0;

        if (item.amount > 0) {
          lineTotal = Number(item.amount);
          returnQty = price > 0 ? lineTotal / price : 1;
        } else if (item.qty > 0) {
          returnQty = Number(item.qty);
          lineTotal = returnQty * price;
        } else {
          returnQty = 1;
          lineTotal = price;
        }

        if (!isFinite(returnQty) || returnQty <= 0) return { ok: false, reply: `❌ Return quantity galat hai: ${cleanProductName}` };

        updates[`Products/${sanitizeFirebaseKey(p._key)}/Stock`] = Number(p.Stock || 0) + returnQty;
        total += lineTotal;
        transactionItems.push({ product: p.Name || p._key, qty: returnQty, price: price, cost: cost, total: lineTotal });
      }

      const transactionId = command.client_txn_id || ("R" + Date.now());
      const transaction = { id: transactionId, client_txn_id: command.client_txn_id||"", type: "return", items: transactionItems, total, customer, timestamp: Date.now(), date: getTodayString() };
      updates[`Transactions/${transactionId}`] = transaction;

      const parallelFetches = [];
      let custIndex = -1, cashIndex = -1;

      if (customer) {
        parallelFetches.push(`Customers/${sanitizeFirebaseKey(customer)}/Balance`);
        custIndex = parallelFetches.length - 1;
      } else {
        parallelFetches.push(`CashManagement`);
        cashIndex = parallelFetches.length - 1;
      }

      if (parallelFetches.length > 0) {
        const responses = await firebaseParallelGet(parallelFetches);
        if (custIndex !== -1) {
          updates[`Customers/${sanitizeFirebaseKey(customer)}/Balance`] = Number(responses[custIndex] || 0) - total;
          updates[`Customers/${sanitizeFirebaseKey(customer)}/Name`] = customer;
        }
        if (cashIndex !== -1) {
          updates[`CashManagement/CashInHand`] = Number((responses[cashIndex] || {}).CashInHand || 0) - total;
        }
      }

      const statsPatch = await buildStatsPatchClient(transaction);
      Object.assign(updates, statsPatch);

      let reply = "↩️ Return recorded\n" + transactionItems.map(x => `${formatNumber(x.qty)} × ${x.product} (Rs ${formatNumber(x.total)})`).join("\n") + `\n💰 Total: Rs -${formatNumber(total)}` + (customer ? `\n👤 ${customer} (Balance Updated)` : "");
      return { ok: true, reply, updates };
    }

    async function processPurchase(command, products) {
      const items = command.items || [];
      if (!items.length) return { ok: false, reply: "❌ Purchase item batayein." };

      const updates = {};
      const messages = [];
      const transactionItems = [];
      let total = 0;

      items.forEach(item => {
        const match = findProduct(item.product, products);
        if (match.status !== "found") throw new Error("Product issue: " + item.product);

        const p = match.product;
        const qty = Number(item.qty || 0);
        if (!isFinite(qty) || qty <= 0) throw new Error("Quantity galat: " + item.product);

        const cleanKey = sanitizeFirebaseKey(p._key);
        updates[`Products/${cleanKey}/Stock`] = Number(p.Stock || 0) + qty;

        const cost = Number(item.cost !== undefined ? item.cost : p.Cost || 0);
        if (cost > 0) updates[`Products/${cleanKey}/Cost`] = cost;

        total += cost * qty;
        transactionItems.push({ product: p.Name || p._key, qty: qty, cost: cost, total: cost * qty });
        messages.push(`📦 ${formatNumber(qty)} × ${p.Name || p._key}`);
      });

      const transactionId = command.client_txn_id || ("P" + Date.now());
      const transaction = { id: transactionId, client_txn_id: command.client_txn_id||"", type: "purchase", items: transactionItems, total, timestamp: Date.now(), date: getTodayString() };
      updates[`Transactions/${transactionId}`] = transaction;

      const currentCashManagement = await firebaseRequest("CashManagement", "GET") || { CashInHand: 0 };
      updates[`CashManagement/CashInHand`] = Number(currentCashManagement.CashInHand || 0) - total;

      const reply = `✅ Purchase recorded\n${messages.join("\n")}\n💰 Total cost: Rs -${formatNumber(total)}`;
      return { ok: true, reply, updates };
    }

    async function processAddStock(command, products) {
      const items = command.items || [];
      if (!items.length) return { ok: false, reply: "❌ Product aur quantity batayein." };

      const updates = {};
      const messages = [];

      items.forEach(item => {
        const match = findProduct(item.product, products);
        if (match.status !== "found") throw new Error("Product issue: " + item.product);
        const p = match.product;
        const qty = Number(item.qty || 0);
        if (!isFinite(qty) || qty <= 0) throw new Error("Quantity galat: " + item.product);

        const newStock = Number(p.Stock || 0) + qty;
        updates[`Products/${sanitizeFirebaseKey(p._key)}/Stock`] = newStock;
        messages.push(`➕ ${formatNumber(qty)} × ${p.Name || p._key} → Stock ${formatNumber(newStock)}`);
      });

      return { ok: true, reply: `✅ Stock updated\n${messages.join("\n")}`, updates };
    }

    async function processAddNewProduct(command) {
      if (!command.product) return { ok: false, reply: "❌ Product ka naam batayein." };
      const name = String(command.product).trim();
      const price = Number(command.price || 0);
      const cost = Number(command.cost || 0);
      const stock = Number(command.stock || 0);
      const unit = String(command.unit || "pcs").trim();

      const productKey = sanitizeFirebaseKey(name);
      const existing = await firebaseRequest(`Products/${productKey}`, "GET");
      if (existing) return { ok: false, reply: `⚠️ Ye product pehle se database mein mojood hai: ${name}` };

      const updates = {};
      updates[`Products/${productKey}`] = { Name: name, Price: price, Cost: cost, Stock: stock, Unit: unit, updatedAt: Date.now() };
      return { ok: true, reply: `✅ New Product Added!\n📦 Name: ${name}\n💰 Sale Price: Rs ${formatNumber(price)}\n📉 Cost: Rs ${formatNumber(cost)}\n📊 Stock: ${formatNumber(stock)} (${unit})`, updates };
    }

    async function processCustomerPayment(command) {
      const customer = String(command.customer).trim();
      const amount = Number(command.amount);
      const safeCustomerKey = sanitizeFirebaseKey(customer);
      const responses = await firebaseParallelGet([`Customers/${safeCustomerKey}/Balance`, `CashManagement`]);
      
      const newBalance = Number(responses[0] || 0) - amount;
      const updates = {};
      updates[`Customers/${safeCustomerKey}/Balance`] = newBalance;
      updates[`Customers/${safeCustomerKey}/Name`] = customer; 
      
      const transactionId = command.client_txn_id || ("PAY_" + Date.now());
      const transaction = { id: transactionId, type: "payment", amount, customer, timestamp: Date.now(), date: getTodayString() };
      updates[`Transactions/${transactionId}`] = transaction;
      updates[`CashManagement/CashIn`] = Number((responses[1]||{}).CashIn || 0) + amount;
      updates[`CashManagement/CashInHand`] = Number((responses[1]||{}).CashInHand || 0) + amount;
      
      const statsPatch = await buildStatsPatchClient(transaction);
      Object.assign(updates, statsPatch);

      return { ok: true, reply: `✅ Cash In Recorded\n👤 ${customer}\n💵 Amount: Rs +${formatNumber(amount)}\n⚖️ Remaining Balance: Rs ${formatNumber(newBalance)}`, updates };
    }

    async function processCustomerCashOut(command) {
      const customer = String(command.customer).trim();
      const amount = Number(command.amount);
      const safeCustomerKey = sanitizeFirebaseKey(customer);
      const responses = await firebaseParallelGet([`Customers/${safeCustomerKey}/Balance`, `CashManagement`]);
      
      const newBalance = Number(responses[0] || 0) + amount;
      const updates = {};
      updates[`Customers/${safeCustomerKey}/Balance`] = newBalance;
      updates[`Customers/${safeCustomerKey}/Name`] = customer; 
      
      const transactionId = command.client_txn_id || ("CASHOUT_" + Date.now());
      const transaction = { id: transactionId, type: "cash_out", amount, customer, timestamp: Date.now(), date: getTodayString() };
      updates[`Transactions/${transactionId}`] = transaction;
      updates[`CashManagement/CashOut`] = Number((responses[1]||{}).CashOut || 0) + amount;
      updates[`CashManagement/CashInHand`] = Number((responses[1]||{}).CashInHand || 0) - amount;
      
      const statsPatch = await buildStatsPatchClient(transaction);

    async function processCustomerBalance(command) {
      if (!command.customer) return { ok: false, reply: "❌ Customer ka naam batayein." };
      const customer = String(command.customer).trim();
      const safeCustomerKey = sanitizeFirebaseKey(customer);
      const balance = await firebaseRequest(`Customers/${safeCustomerKey}/Balance`, "GET") || 0;
      return { ok: true, reply: `⚖️ Balance for ${customer}:\nRs ${formatNumber(balance)}\n\n(Note: Agar balance positive (+) hai to iska matlab customer ne udhaar dena hai. Agar negative (-) hai to aap ne wapis karna hai.)` };
    }

    // ---------------------------------------------------------
    // MASTER COMMAND EXECUTOR (ROUTES ALL ACTIONS)
    // ---------------------------------------------------------
    async function executeCommand(command, products) {
      if (!command || !command.action) return { ok: false, reply: "Command samajh nahi aayi." };
      
      const action = String(command.action).toLowerCase();

      if (action === "chat") {
        return { ok: true, reply: command.reply || "Acha g, batayein aur kya madad kar sakta hoon?" };
      }

      if (action === "add_new_product_form") {
        return { ok: true, type: "need_add_product_form", reply: command.reply || `📦 Naya product add karne ke liye neechay form fill karein:` };
      }

      if (action === "update_price_direct" || action === "update_cost_direct" || action === "update_stock_direct" || action === "update_stock_add") {
        const searchProd = command.product;
        const val = Number(command.value);
        if (!searchProd || !isFinite(val)) return { ok: false, reply: "❌ Product ya value theek se samajh nahi aayi." };
        
        let p;
        if (products[searchProd]) p = { ...products[searchProd], _key: searchProd };
        else {
          const match = findProduct(searchProd, products);
          if (match.status === "not_found") return { ok: false, reply: `❌ Product nahi mila: ${searchProd}` };
          if (match.status === "multiple") {
            return {
              ok: true, type: "need_clarification",
              reply: `⚠️ "${searchProd}" ke liye ek se zyada products match huay hain. Sahi product select karein:`,
              options: match.matches, pending_context: command
            };
          }
          p = match.product;
        }

        let fieldLabel = "Price";
        if (action === "update_cost_direct") fieldLabel = "Cost";
        if (action === "update_stock_direct" || action === "update_stock_add") fieldLabel = action === "update_stock_add" ? "Stock (Add)" : "Stock";

        let finalTargetVal = val;
        if (action === "update_stock_add") {
          finalTargetVal = Number(p.Stock || 0) + val;
        }

        return {
          ok: true, type: "need_direct_update_confirmation",
          reply: `⚠️ Kya aap ${p.Name || p._key} ka ${fieldLabel} update kar ke **${finalTargetVal}** karna chahte hain?`,
          product_key: p._key, product_name: p.Name || p._key, field: action, value: finalTargetVal
        };
      }

      if (action === "resolve_direct_update") {
        const pKey = sanitizeFirebaseKey(command.product_key);
        const field = command.field; 
        const val = Number(command.value);
        
        let dbField = "Price";
        if (field === "update_cost_direct") dbField = "Cost";
        if (field === "update_stock_direct" || field === "update_stock_add") dbField = "Stock";

        const updates = { [`Products/${pKey}/${dbField}`]: val, [`Products/${pKey}/updatedAt`]: Date.now() };
        await firebaseRequest("", "PATCH", updates);
        clearCaches();
        return { ok: true, reply: `✅ Successfully updated ${dbField} to ${val} for ${command.product_name}!` };
      }

      if (action === "update_price_request" || action === "update_cost_request" || action === "update_stock_request") {
        const searchProd = command.product;
        if (!searchProd) return { ok: false, reply: "❌ Kis product ki detail update karni hai uska naam batayein." };
        
        let p;
        if (products[searchProd]) p = { ...products[searchProd], _key: searchProd };
        else {
          const match = findProduct(searchProd, products);
          if (match.status === "not_found") return { ok: false, reply: `❌ Product nahi mila: ${searchProd}` };
          if (match.status === "multiple") {
            return {
              ok: true, type: "need_clarification",
              reply: `⚠️ "${searchProd}" ke liye ek se zyada products match huay hain. Sahi product select karein:`,
              options: match.matches, pending_context: command
            };
          }
          p = match.product;
        }
        
        const fieldType = action.replace("_request", "");
        return {
          ok: true, type: "need_update_field_form",
          reply: `✏️ Update ${p.Name || p._key} (${fieldType.replace("update_", "").toUpperCase()})`,
          product_key: p._key, product_name: p.Name || p._key, field: fieldType
        };
      }

      if (action === "resolve_update_field") {
        const pKey = sanitizeFirebaseKey(command.product_key);
        const field = command.field;
        const val = Number(command.value);
        if (!isFinite(val) || val < 0) return { ok: false, reply: "❌ Value galat hai." };

        let dbField = "Price";
        if (field === "update_cost") dbField = "Cost";
        if (field === "update_stock") dbField = "Stock";

        const updates = { [`Products/${pKey}/${dbField}`]: val, [`Products/${pKey}/updatedAt`]: Date.now() };
        await firebaseRequest("", "PATCH", updates);
        clearCaches();
        return { ok: true, reply: `✅ Successfully updated ${dbField} to ${val} for ${command.product_name}!` };
      }

      if (command.customer && !command.customer_resolved && action !== "resolve_customer_clarification") {
        const customers = await getCustomersCached();
        const match = findCustomer(command.customer, customers);
        
        if (match.status === "multiple") {
          return {
            ok: true, type: "need_customer_clarification",
            reply: `⚠️ "${command.customer}" naam se miltay jultay khatey mojood hain. Sahi khata select karein ya naya banayein:`,
            options: match.matches,
            pending_context: command
          };
        } else if (match.status === "found") {
          command.customer = match.customer.Name || match.customer._key;
        }
        command.customer_resolved = true;
      }

      if (action === "resolve_customer_clarification") {
        const context = command.pending_context;
        context.customer = command.selected_customer;
        context.customer_resolved = true;
        return await executeCommand(context, products);
      }

      if (action === "resolve_clarification") {
        const context = command.pending_context;
        if (!context) return { ok: false, reply: "❌ Session context expire ho gaya hai." };
        if (command.client_txn_id) context.client_txn_id = command.client_txn_id;

        const selectedKey = command.selected_product_key || command.selected_product;

        if (context.items) {
            const idx = command.target_index !== undefined ? command.target_index : (context.target_index || 0);

            let matchedProduct = null;
            if (products[selectedKey]) matchedProduct = { ...products[selectedKey], _key: selectedKey };
            else {
              const match = findProduct(command.selected_product, products);
              if (match.status === "found") matchedProduct = match.product;
            }

            if (matchedProduct) {
              context.items[idx]._resolvedProduct = matchedProduct;
              context.items[idx].product = matchedProduct.Name || matchedProduct._key;
            } else {
              context.items[idx].product = command.selected_product;
            }

            context.user_text = command.user_text;
            const res = await (context.action === "return" ? processReturn(context, products) : processSale(context, products));
            if(res.updates) { await firebaseRequest("", "PATCH", res.updates); delete res.updates; clearCaches(); }
            return res;
        } else {
            context.product = selectedKey; 
            return await executeCommand(context, products);
        }
      }

      if (action === "resolve_missing") {
        const context = command.pending_context;
        const decision = command.decision;

        if (!context || !context.items) return { ok: false, reply: "❌ Session context expire ho gaya hai." };
        if (decision === "cancel") return { ok: true, reply: "🚫 Transaction cancel kar di gayi hai." };

        const rawMissingIndices = command.missing_indices || [];
        const missingIndices = rawMissingIndices.map(Number);

        if (decision === "skip") {
          context.items = context.items.filter((_, idx) => !missingIndices.includes(Number(idx)));
          if (!context.items.length) return { ok: false, reply: "❌ Sari items missing theen, transaction cancel kar di gayi." };
          if (command.client_txn_id) context.client_txn_id = command.client_txn_id;
          context.user_text = command.user_text;
          const res = await (context.action === "return" ? processReturn(context, products) : processSale(context, products));
          if(res.updates) { await firebaseRequest("", "PATCH", res.updates); delete res.updates; clearCaches(); }
          return res;
        }

        if (decision === "manual") {
          const manualPrices = command.manual_prices || {};
          context.items.forEach((item, idx) => {
            const numericIdx = Number(idx);
            if (missingIndices.includes(numericIdx)) {
              const priceVal = Number(manualPrices[numericIdx] !== undefined ? manualPrices[numericIdx] : manualPrices[String(numericIdx)] || 0);
              item.is_misc = true;
              item.amount = priceVal;
              item.price = priceVal;
              item.qty = 1;
              item._resolvedProduct = null;
              item.product = String(item.product).replace(/\s*\(Unlisted\)/gi, "") + " (Unlisted)";
            }
          });
          if (command.client_txn_id) context.client_txn_id = command.client_txn_id;
          context.user_text = command.user_text;
          const res = await (context.action === "return" ? processReturn(context, products) : processSale(context, products));
          if(res.updates) { await firebaseRequest("", "PATCH", res.updates); delete res.updates; clearCaches(); }
          return res;
        }

        return { ok: false, reply: "❌ Galat decision option." };
      }

      if ((action === "sale" || action === "return") && !command.items && command.product) command.items = [command];

      let res;
      switch (action) {
        case "sale": 
          res = await processSale(command, products); 
          if(res.updates) { await firebaseRequest("", "PATCH", res.updates); delete res.updates; clearCaches(); } break;
        case "return": 
          res = await processReturn(command, products); 
          if(res.updates) { await firebaseRequest("", "PATCH", res.updates); delete res.updates; clearCaches(); } break;
        case "purchase": 
          res = await processPurchase(command, products); 
          if(res.updates) { await firebaseRequest("", "PATCH", res.updates); delete res.updates; clearCaches(); } break;
        case "add_stock": 
          res = await processAddStock(command, products); 
          if(res.updates) { await firebaseRequest("", "PATCH", res.updates); delete res.updates; clearCaches(); } break;
        case "update_price": 
          res = await processUpdatePrice(command, products); 
          if(res.updates) { await firebaseRequest("", "PATCH", res.updates); delete res.updates; clearCaches(); } break;
        case "update_cost": 
          res = await processUpdateCost(command, products); 
          if(res.updates) { await firebaseRequest("", "PATCH", res.updates); delete res.updates; clearCaches(); } break;
        case "add_new_product": 
          res = await processAddNewProduct(command); 
          if(res.updates) { await firebaseRequest("", "PATCH", res.updates); delete res.updates; } 
          syncInventoryToAIBrain(); break; 
        case "customer_payment": 
          res = await processCustomerPayment(command); 
          if(res.updates) { await firebaseRequest("", "PATCH", res.updates); delete res.updates; clearCaches(); } break;
        case "customer_cash_out": 
          res = await processCustomerCashOut(command); 
          if(res.updates) { await firebaseRequest("", "PATCH", res.updates); delete res.updates; clearCaches(); } break;
        
        case "list_products": res = processListProducts(products); break;
        case "low_stock": res = processLowStock(products); break;
        case "stock": 
        case "product_search": res = processStock(command, products); break;
        case "customer_balance": res = await processCustomerBalance(command); break;
        case "report": res = await processReport(command); break;
        case "product_report": res = await processProductReport(command, products); break;
        case "chat_history": res = await processChatHistory(); break;
        case "chat": res = { ok: true, reply: command.reply || "Walaikum Assalam! Main Sunny AI POS brain hoon 🙂 Entry likhein." }; break;
        default: res = { ok: false, reply: `❌ Unknown action: ${command.action}` };
      }
      return res;
    }

    // ---------------------------------------------------------
    // TURBO QUEUE ENGINE (CLIENT UI LOGIC)
    // ---------------------------------------------------------
    let commandQueue = JSON.parse(localStorage.getItem(QUEUE_KEY)) || [];
    let isProcessingQueue = false;
    let isAwaitingInput = false;

    function saveQueue() { localStorage.setItem(QUEUE_KEY, JSON.stringify(commandQueue)); }

    window.addEventListener('DOMContentLoaded', () => {
      commandQueue.forEach(item => {
        const row = appendUserMessage(item.displayLabel, item.id);
        if (item.status === 'interactive' && item.interactiveData) {
          updateBubbleStatus(row, 'delivered');
          isAwaitingInput = true; toggleInput(true);
          renderInteractiveWidgets(item.interactiveData, item.id, item.originalMessage);
        } else updateBubbleStatus(row, item.status === 'failed' ? 'failed' : 'queued');
      });
      if (commandQueue.length > 0 && navigator.onLine) processQueue();
    });

    window.addEventListener('online', () => {
      latencyBadge.textContent = "Turbo Ready";
      connDot.style.background = "var(--success-green)";
      connDot.style.boxShadow = "0 0 6px var(--success-green)";
      if (commandQueue.length > 0) processQueue();
    });

    window.addEventListener('offline', () => {
      latencyBadge.textContent = "Offline";
      connDot.style.background = "var(--warning-color)";
      connDot.style.boxShadow = "0 0 6px var(--warning-color)";
    });

    setInterval(() => { if (commandQueue.length > 0 && navigator.onLine && !isProcessingQueue) processQueue(); }, 2000);

    function enqueueCommand(payload, displayLabel) {
      const id = 'txn_' + Date.now();
      commandQueue.push({ id, payload, displayLabel, originalMessage: displayLabel, status: 'queued', timestamp: Date.now() });
      saveQueue();
      updateBubbleStatus(appendUserMessage(displayLabel, id), 'queued');
      processQueue();
    }

    async function processQueue() {
      if (isProcessingQueue || !navigator.onLine || commandQueue.length === 0) return;
      const currentItem = commandQueue[0];
      if (currentItem.status === 'interactive') { isAwaitingInput = true; return; }

      if (currentItem.status === 'failed') {
        currentItem.retries = (currentItem.retries || 0) + 1;
        if (currentItem.retries > 2) {
          commandQueue.shift();
          saveQueue();
          await streamModelResponse("❌ Yeh command process nahi ho saki. Baraye meherbani saaf lafzo mein dobara likhein.");
          return;
        }
      }

      isProcessingQueue = true;
      const bubble = document.getElementById(currentItem.id);
      if (bubble) updateBubbleStatus(bubble, 'sending');
      
      latencyBadge.textContent = "Processing...";
      const shimmer = appendShimmer();
      setNetworkProgress(true);

      try {
        const payload = { ...currentItem.payload, client_txn_id: currentItem.id };
        const startTime = performance.now();

        const products = await getProductsCached();
        let data;
        
        const directActions = ["resolve_clarification", "resolve_missing", "resolve_customer_clarification", "resolve_update_field", "resolve_direct_update", "add_new_product", "update_price_direct", "update_cost_direct", "update_stock_direct", "update_stock_add"];
        
        if (directActions.includes(payload.action) || payload.action?.startsWith("resolve_")) {
           data = await executeCommand(payload, products);
           if(data.ok && (data.transaction || data.updates || payload.action?.startsWith("resolve_") || payload.action === "add_new_product")) {
               const dateStr = getTodayString();
               firebaseRequest(`ChatHistory/${dateStr}/${currentItem.id}`, "PUT", { user: currentItem.originalMessage, ai: data.reply, timestamp: Date.now() });
           }
        } else {
           const cleanedMessage = preprocessMessage(payload.message || "");
           const command = await safeUnderstandCommand(cleanedMessage, products);
           command.client_txn_id = payload.client_txn_id;
           command.user_text = currentItem.originalMessage;
           data = await executeCommand(command, products);
           
           if(data.ok && (data.transaction || data.updates || ["report", "stock", "chat", "customer_balance", "list_products", "low_stock", "add_new_product_form", "update_price_request", "update_cost_request", "update_stock_request"].includes(command.action))) {
               const dateStr = getTodayString();
               firebaseRequest(`ChatHistory/${dateStr}/${currentItem.id}`, "PUT", { user: command.user_text, ai: data.reply, timestamp: Date.now() });
           }
        }

        latencyBadge.textContent = `${Math.round(performance.now() - startTime)}ms`;
        shimmer.remove(); setNetworkProgress(false);

        if (["need_missing_resolution", "need_clarification", "need_customer_clarification", "need_add_product_form", "need_update_field_form", "need_direct_update_confirmation"].includes(data.type)) {
          currentItem.status = 'interactive'; currentItem.interactiveData = data; saveQueue();
          isAwaitingInput = true; toggleInput(true);
          if (bubble) updateBubbleStatus(bubble, 'delivered');
          renderInteractiveWidgets(data, currentItem.id, currentItem.originalMessage);
        } else {
          commandQueue.shift(); saveQueue();
          isAwaitingInput = false; toggleInput(false);
          if (bubble) updateBubbleStatus(bubble, 'delivered');
          await streamModelResponse(data.reply || "Done.");
        }

      } catch (err) {
        shimmer.remove(); setNetworkProgress(false); latencyBadge.textContent = "Error";
        currentItem.status = 'failed'; saveQueue();
        if (bubble) updateBubbleStatus(bubble, 'failed');
        console.error(err);
      } finally {
        isProcessingQueue = false;
        setTimeout(() => { if (commandQueue.length > 0 && navigator.onLine) processQueue(); }, 300);
      }
    }

    userInput.addEventListener("input", () => {
      const val = userInput.value.trim();
      submitBtn.disabled = val.length === 0;
      submitBtn.classList.toggle("active", val.length > 0);
    });

    function toggleInput(disabled) { userInput.disabled = disabled; userInput.placeholder = disabled ? "Please respond to prompts..." : "Type a sale, report, search, or chat..."; }
    function disableAllPreviousActions() { document.querySelectorAll(".interactive-card button, .interactive-card input").forEach(el => el.disabled = true); }

    function handleFormSubmit(e) {
      e.preventDefault(); const message = userInput.value.trim(); if (!message) return;
      disableAllPreviousActions(); userInput.value = ""; submitBtn.disabled = true; submitBtn.classList.remove("active");
      enqueueCommand({ message }, message);
    }

    // ---------------------------------------------------------
    // RENDER INTERACTIVE WIDGETS ROUTER
    // ---------------------------------------------------------
    function renderInteractiveWidgets(data, queueItemId, originalText) {
      if (data.type === "need_add_product_form") renderAddProductForm(data, queueItemId, originalText);
      else if (data.type === "need_update_field_form") renderUpdateFieldForm(data, queueItemId, originalText);
      else if (data.type === "need_direct_update_confirmation") renderDirectUpdateConfirmation(data, queueItemId, originalText);
      else if (data.type === "need_missing_resolution") renderMissingResolution(data, queueItemId, originalText);
      else if (data.type === "need_customer_clarification") renderCustomerClarification(data.reply, data.options, data.pending_context, queueItemId, originalText);
      else renderClarification(data.reply, data.options, data.pending_context, queueItemId, originalText);
    }

      const okBtn = document.createElement("button"); okBtn.className = "option-chip"; okBtn.style.borderColor = "var(--success-green)"; okBtn.textContent = "✅ Ok, Update karo";

        if (qItem) {

          qItem.displayLabel = `Confirm update for ${data.product_name}`; qItem.status = 'queued'; delete qItem.interactiveData;

    function handleCustomerSelection(selectedName, pendingContext, queueItemId) {
      disableAllPreviousActions(); isAwaitingInput = false; toggleInput(false);
      const qItem = commandQueue.find(q => q.id === queueItemId);
      if (qItem) {
        qItem.id = qItem.id + "_c_res_" + Date.now();
        qItem.payload = { action: "resolve_customer_clarification", selected_customer: selectedName, pending_context: pendingContext };
        qItem.displayLabel = `Selected Khata: ${selectedName}`; qItem.status = 'queued'; delete qItem.interactiveData;
        saveQueue(); updateBubbleStatus(appendUserMessage(qItem.displayLabel, qItem.id), 'queued'); processQueue();
      }
    }

    function renderCustomerClarification(msg, options, pendingContext, queueItemId, originalText) {
      const row = document.createElement("div"); row.className = "message-row model";
      row.innerHTML = `<div class="avatar"><svg class="gemini-spark" viewBox="0 0 24 24"><path d="M12 2C12 7.52285 7.52285 12 2 12C7.52285 12 12 16.4771 12 22C12 16.4771 16.4771 12 22 12C16.4771 12 12 7.52285 12 2Z"/></svg></div><div class="content-block">${originalText ? `<div class="quote-block">Replying to: <i>"${escapeHtml(originalText)}"</i></div>` : ''}<div>${escapeHtml(msg)}</div><div class="interactive-card actions-grid"></div></div>`;
      const grid = row.querySelector(".actions-grid");
      
      (options || []).forEach(opt => {
        const chip = document.createElement("button"); chip.className = "option-chip"; 
        chip.innerHTML = `<span>👤 ${escapeHtml(opt.name)}</span>`;
        chip.onclick = () => handleCustomerSelection(opt.name, pendingContext, queueItemId);
        grid.appendChild(chip);
      });

      const newChip = document.createElement("button"); newChip.className = "option-chip"; 
      newChip.style.borderColor = "var(--success-green)";
      newChip.innerHTML = `<span>➕ Naya Khata: "${escapeHtml(pendingContext.customer)}"</span>`;
      newChip.onclick = () => handleCustomerSelection(pendingContext.customer, pendingContext, queueItemId);
      grid.appendChild(newChip);

      chatFeed.appendChild(row); scrollBottom();
    }

    function handleDisambiguationSelection(selectedKey, selectedName, pendingContext, queueItemId) {
      disableAllPreviousActions(); isAwaitingInput = false; toggleInput(false);
      const qItem = commandQueue.find(q => q.id === queueItemId);
      if (qItem) {
        qItem.id = qItem.id + "_res_" + Date.now();
        qItem.payload = { action: "resolve_clarification", selected_product_key: selectedKey, selected_product: selectedName, pending_context: pendingContext };
        qItem.displayLabel = `Selected: ${selectedName}`; qItem.status = 'queued'; delete qItem.interactiveData;
        saveQueue(); updateBubbleStatus(appendUserMessage(qItem.displayLabel, qItem.id), 'queued'); processQueue();
      }
    }

    function handleMissingResolution(decision, dataBundle, queueItemId) {
      disableAllPreviousActions(); isAwaitingInput = false; toggleInput(false);
      let label = "Cancel Transaction";
      if (decision === "skip") label = "Skip Missing & Continue";
      if (decision === "manual") label = "Apply Manual Prices";
      const qItem = commandQueue.find(q => q.id === queueItemId);
      if (qItem) {
        qItem.id = qItem.id + "_res_" + Date.now();
        qItem.payload = { action: "resolve_missing", decision: decision, missing_indices: dataBundle.missingIndices, manual_prices: dataBundle.manualPrices || {}, pending_context: dataBundle.pendingContext };
        qItem.displayLabel = label; qItem.status = 'queued'; delete qItem.interactiveData;
        saveQueue(); updateBubbleStatus(appendUserMessage(label, qItem.id), 'queued'); processQueue();
      }
    }

    function renderClarification(msg, options, pendingContext, queueItemId, originalText) {
      const row = document.createElement("div"); row.className = "message-row model";
      row.innerHTML = `<div class="avatar"><svg class="gemini-spark" viewBox="0 0 24 24"><path d="M12 2C12 7.52285 7.52285 12 2 12C7.52285 12 12 16.4771 12 22C12 16.4771 16.4771 12 22 12C16.4771 12 12 7.52285 12 2Z"/></svg></div><div class="content-block">${originalText ? `<div class="quote-block">Replying to: <i>"${escapeHtml(originalText)}"</i></div>` : ''}<div>${escapeHtml(msg)}</div><div class="interactive-card actions-grid"></div></div>`;
      const grid = row.querySelector(".actions-grid");
      (options || []).forEach(opt => {
        const chip = document.createElement("button"); chip.className = "option-chip"; chip.innerHTML = `<span>${escapeHtml(opt.name)}</span><span class="chip-meta">Rs ${opt.price} | Stock: ${opt.stock}</span>`;
        chip.onclick = () => handleDisambiguationSelection(opt.key, opt.name, pendingContext, queueItemId);
        grid.appendChild(chip);
      });
      chatFeed.appendChild(row); scrollBottom();
    }

    function renderMissingResolution(data, queueItemId, originalText) {
      const row = document.createElement("div"); row.className = "message-row model";
      row.innerHTML = `<div class="avatar"><svg class="gemini-spark" viewBox="0 0 24 24"><path d="M12 2C12 7.52285 7.52285 12 2 12C7.52285 12 12 16.4771 12 22C12 16.4771 16.4771 12 22 12C16.4771 12 12 7.52285 12 2Z"/></svg></div><div class="content-block">${originalText ? `<div class="quote-block">Replying to: <i>"${escapeHtml(originalText)}"</i></div>` : ''}<div>${escapeHtml(data.reply)}</div><div class="interactive-card"><div class="actions-grid" id="missingGrid"></div><div id="manualPriceBox" style="display: none;"></div></div></div>`;
      const grid = row.querySelector("#missingGrid"), manualBox = row.querySelector("#manualPriceBox");
      const missingIndices = (data.missing_items || []).map(m => Number(m.index));
      
      const skipBtn = document.createElement("button"); skipBtn.className = "option-chip"; skipBtn.textContent = "Skip Missing & Continue"; skipBtn.onclick = () => handleMissingResolution("skip", { missingIndices, pendingContext: data.pending_context }, queueItemId); grid.appendChild(skipBtn);
      const manualBtn = document.createElement("button"); manualBtn.className = "option-chip"; manualBtn.textContent = "Enter Manual Price"; manualBtn.onclick = () => { grid.style.display = "none"; manualBox.style.display = "block"; scrollBottom(); }; grid.appendChild(manualBtn);
      const cancelBtn = document.createElement("button"); cancelBtn.className = "option-chip cancel-chip"; cancelBtn.textContent = "Cancel Transaction"; cancelBtn.onclick = () => handleMissingResolution("cancel", { missingIndices, pendingContext: data.pending_context }, queueItemId); grid.appendChild(cancelBtn);

      const form = document.createElement("div"); form.className = "manual-price-box"; form.innerHTML = `<div style="font-size: 0.8rem; color: var(--text-muted);">Missing items ki sale price likhein:</div>`;
      const inputMap = {};
      (data.missing_items || []).forEach(item => {
        const line = document.createElement("div"); line.className = "manual-item-row";
        line.innerHTML = `<span class="manual-item-name">${escapeHtml(item.product)} (${item.qty || 1}x)</span><input type="number" class="manual-input" placeholder="Price (Rs)" min="1" step="any" required />`;
        inputMap[Number(item.index)] = line.querySelector("input"); form.appendChild(line);
      });
      const confirmBtn = document.createElement("button"); confirmBtn.className = "submit-prices-btn"; confirmBtn.textContent = "Confirm & Proceed";
      confirmBtn.onclick = () => {
        const manualPrices = {}; let valid = true;
        for (const idx of missingIndices) { 
          const val = Number(inputMap[idx].value); 
          if (!val || val <= 0) { inputMap[idx].style.borderColor = "var(--danger-color)"; valid = false; } else { inputMap[idx].style.borderColor = "var(--border-subtle)"; manualPrices[idx] = val; } 
        }
        if (valid) handleMissingResolution("manual", { missingIndices, manualPrices, pendingContext: data.pending_context }, queueItemId);
      };
      form.appendChild(confirmBtn); manualBox.appendChild(form); chatFeed.appendChild(row); scrollBottom();
    }

    function appendUserMessage(text, id) {
      const row = document.createElement("div"); row.className = "message-row user"; if (id) row.id = id;
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      row.innerHTML = `<div class="content-block"><div>${escapeHtml(text)}</div><div class="msg-meta"><span class="status-time">${time}</span><span class="status-tick"></span></div></div>`;
      chatFeed.appendChild(row); scrollBottom(); return row;
    }
    function updateBubbleStatus(bubbleEl, status) {
      if (!bubbleEl) return; const tick = bubbleEl.querySelector(".status-tick");
      if (status === "queued") tick.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="var(--text-muted)"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>`;
      else if (status === "sending") tick.innerHTML = '<div class="mini-spinner"></div>';
      else if (status === "delivered") tick.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="var(--accent-blue)"><path d="M18 7l-1.41-1.41-6.34 6.34 1.41 1.41L18 7zm4.24-1.41L11.66 16.17 7.41 11.93l-1.41 1.41 5.66 5.66 12-12-1.42-1.41zM.41 13.34l5.66 5.66 1.41-1.41-5.66-5.66-1.41 1.41z"/></svg>`;
      else if (status === "failed") tick.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="var(--danger-color)"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>`;
    }
    function appendShimmer() {
      const row = document.createElement("div"); row.className = "message-row model";
      row.innerHTML = `<div class="avatar"><svg class="gemini-spark" viewBox="0 0 24 24"><path d="M12 2C12 7.52285 7.52285 12 2 12C7.52285 12 12 16.4771 12 22C12 16.4771 16.4771 12 22 12C16.4771 12 12 7.52285 12 2Z"/></svg></div><div class="shimmer-container"><div class="shimmer-line"></div><div class="shimmer-line short"></div></div>`;
      chatFeed.appendChild(row); scrollBottom(); return row;
    }
    async function streamModelResponse(fullText) {
      const row = document.createElement("div"); row.className = "message-row model";
      row.innerHTML = `<div class="avatar"><svg class="gemini-spark" viewBox="0 0 24 24"><path d="M12 2C12 7.52285 7.52285 12 2 12C7.52285 12 12 16.4771 12 22C12 16.4771 16.4771 12 22 12C16.4771 12 12 7.52285 12 2Z"/></svg></div><div class="content-block"></div>`; 
      chatFeed.appendChild(row);
      const block = row.querySelector(".content-block");
      const chunks = fullText.split(/(\n+)/);
      for (let i = 0; i < chunks.length; i++) { 
        block.textContent += chunks[i]; 
        scrollBottom(); 
        if(chunks[i].trim().length > 0) await new Promise(r => setTimeout(r, 4)); 
      }
    }
    function setNetworkProgress(active) { networkBar.classList.toggle("active", active); }
    function scrollBottom() { chatFeed.scrollTop = chatFeed.scrollHeight; }
    function escapeHtml(str) { const d = document.createElement("div"); d.textContent = str; return d.innerHTML; }
  </script>
</body>
</html>
