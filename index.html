            messages.push({role:"assistant",content:text},{role:"user",content:"[System] Data apni taraf se mat banao. Data ka sawal hai to pehle find_transactions / list_parties / db_query / db_search chalao; sirf baat cheet ho to say tool use karo."});
            continue;
          }
          return cards.length?{mode:"answer",reply:text,cards}:{mode:"chat",reply:text};
        }
        toolUsed=true;
        messages.push({role:"assistant",content:msg.content||"",tool_calls:calls});
        let dataCalls=0, enough=true;
        for (const c of calls) {
          let name=c.function?.name; let args={};
          try { args=JSON.parse(c.function?.arguments||"{}"); } catch(e) {}
          if (name==="find_transactions"||name==="list_parties") { const sc=await uaScopeFix(name,args,message); name=sc.name; args=sc.args; }
          if (name==="say") return {mode:"chat",reply:String(args.text||"").trim()||"Ji, boliye."};
          if (name==="business") { const op=String(args.op||"").toLowerCase(); return {mode:"commands",parts:[normalizeLedgerCommand({action:op==="switch"?"switch_business":op==="list"?"list_businesses":"current_business",business:String(args.name||"")},message)]}; }
          if (name==="recall_previous") { enough=false; messages.push({role:"tool",tool_call_id:c.id,content:JSON.stringify(UA_HIST.length?UA_HIST:{note:"Koi pichli baat nahi"})}); continue; }
          if (name==="ask_user_input") {
            const mp=/^(Customers|Suppliers)\/([^/]+)\/(Name|Mobile)$/i.exec(String(args.target_path||""));
            if (mp) return {mode:"commands",parts:[{action:"edit_party",[/^suppliers$/i.test(mp[1])?"supplier":"customer"]:decodeURIComponent(mp[2]),field:/^name$/i.test(mp[3])?"name":"mobile"}]};
            return {mode:"input",reply:args.ask_message,field:args.field_name,path:args.target_path};
          }
          if (name==="record"||name==="find_transactions"||name==="list_parties") {
            const conf=Number(args.confidence);
            if (Number.isFinite(conf)&&conf<UA_CONF_THRESHOLD) {
              enough=false;
              messages.push({role:"tool",tool_call_id:c.id,content:JSON.stringify({error:"low_confidence",note:`Confidence ${conf}% hai, ${UA_CONF_THRESHOLD}% se kam — yeh tool is baar nahi chalaya gaya, kisi bhi party/amount ka andaza mat lagao. Ab "say" tool se seedha, user ki wahi zaban/script mein, mukhtasar poocho ke samajh nahi aya aur sahi/mukammal naam ya tafseel dobara den.`})});
              continue;
            }
          }
          if (name==="record") {
            const cmds=(Array.isArray(args.commands)?args.commands:[]).filter(x=>x&&UA_WRITE_ACTIONS.has(String(x.action||"").toLowerCase()));
            if (cmds.length) return {mode:"commands",parts:cmds.slice(0,10).map(x=>normalizeLedgerCommand(x,message))};
            enough=false; messages.push({role:"tool",tool_call_id:c.id,content:JSON.stringify({error:"Koi sahi command nahi mili"})}); continue;
          }
          if (!opts.noAsk&&(name==="find_transactions"||name==="list_parties")) {
            const typed=String((name==="find_transactions"?args.party:args.name)||"").trim(), kind=name==="list_parties"?String(args.kind||"both").toLowerCase():"both";
            if (typed) {
              try {
                if (kind!=="supplier"&&findCustomer(typed,await ledgerGetParties("C")).status==="multiple") return {mode:"commands",parts:[{action:"agent_ask",customer:typed,request:message}]};   // purana selectable list
                if (kind!=="customer"&&findSupplier(typed,await ledgerGetParties("S")||{}).status==="multiple") return {mode:"commands",parts:[{action:"agent_ask",supplier:typed,request:message}]};
              } catch(e) { if (isTransient(e)) throw e; }
            }
          }
          let out;
          try {
            if (name==="find_transactions") out=await uaFindTransactions(args);
            else if (name==="list_parties") out=await uaListParties(args);
            else if (name==="db_query") out=await uaDbQuery(args);
            else if (name==="db_search") out=await uaDbSearch(args);
            else out=await runAgentTool(name,args,staged);
          } catch(e) { if (isTransient(e)) throw e; out={error:String(e?.message||e)}; }
          if (name==="find_transactions"||name==="list_parties") {
            dataCalls++;
            const made=uaCardsFor(name,args,out);
            if (args.cards_enough!==true||out?.error||!made.length) enough=false;
            made.forEach(cd=>{ if (cards.length<3&&!cards.some(x=>JSON.stringify(x)===JSON.stringify(cd))) cards.push(cd); });
          } else enough=false;
          messages.push({role:"tool",tool_call_id:c.id,content:JSON.stringify(uaCompact(name,out)).slice(0,UA_TOOL_CHARS+1500)});
        }
        // Cards hi kaafi hain => dusra AI call nahi (token + waqt ki bachat)
        if (dataCalls>0&&enough&&!staged.length&&cards.length) return {mode:"answer",reply:"",cards};
      }
      if (staged.length) return {mode:"write",summary:"Yeh changes hongay:",ops:staged,agent:true};
      if (cards.length) return {mode:"answer",reply:"",cards};
      return {mode:"unsupported",reply:"Bohat steps lag gaye, sawal thora chhota karke dobara likhein."};
    }

    async function agentUnderstandCommand(message,opts={}) {
      let plan;
      try { ledgerGetParties("C").catch(()=>{}); ledgerGetParties("S").catch(()=>{}); uaLeanMap().catch(()=>{}); } catch(e) {}   // AI soch raha ho tab khate pehle se aa jayen
      try { plan=await runUnifiedAgent(message,opts); } catch(e) { if (isTransient(e)) throw e; ledgerWarn("[Agent] failed",e); plan={mode:"error"}; }
      if (plan.mode==="error") return safeUnderstandLedgerCommand(message);   // purana raasta sirf backup
      const cardNote=(plan.cards||[]).map(c=>c.kind==="report"?`${c.title}: ${c.count} entries, Rs ${c.total}`:(c.customer||c.supplier||c.kind)+(c.balance!==undefined?` Rs ${c.balance}`:"")).join("; ");
      const note=plan.reply||cardNote||plan.summary||(plan.parts?"(entry likh di gayi)":"");
      if (plan.mode!=="commands"||!plan.parts.some(x=>x.action==="agent_ask")) {
        UA_HIST.push({user:String(opts.histText||message).slice(0,200),reply:String(note).slice(0,250)});
        UA_HIST=UA_HIST.slice(-3);
      }
      if (plan.mode==="commands") return plan.parts;
      if (plan.mode==="chat") return [{action:"chat",reply:plan.reply}];
      if (plan.mode==="answer") {
        const parts=(plan.cards||[]).map(cd=>({action:"chat",reply:cd.title||"—",__card:cd}));
        if (plan.reply) parts.push({action:"chat",reply:plan.reply});
        return parts;
      }
      return [{action:"smart",request:message,__plan:plan}];
    }

    function lgAnimateCounts(root){
      if (window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      root.querySelectorAll("[data-count]").forEach(el=>{
        const target=Number(el.dataset.count), pre=el.dataset.pre||"Rs ";
        if (!isFinite(target)) return;
        const t0=performance.now()+250, dur=800;
        const step=now=>{ if (now<t0){requestAnimationFrame(step);return;}
          const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3);
          el.textContent=pre+lgF(p<1?Math.round(target*e):target);
          if (p<1) requestAnimationFrame(step); };
        el.textContent=pre+"0"; requestAnimationFrame(step);
      });
    }

    async function processLedgerSupplierPurchase(command) {
      const supplier=String(command.supplier||"").trim();
      const items=command.items||[];
      const total=items.length?items.reduce((t,it)=>t+Number(it.amount||0),0):Number(command.amount||0);
      if (!supplier) return {ok:false,reply:"Supplier ka naam batayein."};
      if (!(total>0)) return {ok:false,reply:"Total amount 0 ban raha hai — dobara likh dein."};
      const sk=supKey(command);

      addInc(updates,`Suppliers/${sk}/Balance`,total);
      const txId=command.client_txn_id||("SP_"+Date.now());
      const txItems=items.map(it=>({product:it.product,qty:Number(it.qty||0),cost:it.qty>0?Number(it.amount)/Number(it.qty):Number(it.amount),amount:Number(it.amount),is_misc:true}));
      const tx={id:txId,type:"supplier_purchase",supplier,supplier_key:sk,items:txItems,total,timestamp:Date.now(),date:getTodayString()};

      if (!command?.action) return {ok:false,reply:"Command samajh nahi aayi."};

      if (action==="chat") return {ok:true,reply:command.reply||"Acha g, aur kuch madad kar sakta hoon?",card:command.__card};

      // ── Business: kaun sa khula hai / list / switch (confirmation ke saath) ──

        if (!typed) return pickAmong(l.filter(b=>!b.current));

        return {ok:true,type:"need_ledger_business_switch",mode:"confirm",from,target:{id:m.biz.id,name:m.biz.name},reply:`"${m.biz.name}" par switch karun?`,pending_context:command};
      }
      if (action==="resolve_ledger_business_pick") {
        const ctx=command.pending_context;

        const t=bizList().find(b=>b.id===String(command.business_id));

        return {ok:true,type:"need_ledger_business_switch",mode:"confirm",from:BIZ_NAME,target:{id:t.id,name:t.name},reply:`"${t.name}" par switch karun?`,pending_context:ctx};
      }
      if (action==="resolve_ledger_business_switch") {

      }

      if (action==="agent_ask") {
                const block=command.supplier?await ledgerSupplierGate(command,false):await ledgerNeedsCustomerFirst(command); if (block) return block;   // milte-julte naam => selectable list
        const parts=await agentUnderstandCommand(`${command.request}\n[${command.supplier?"Supplier":"Khata"} chuna gaya: ${command.supplier?command.supplier:command.customer} — isi poore naam se data dekho]`,{noAsk:true,histText:command.request});
        const run=await runLedgerMultiCommand(parts,(command.client_txn_id||("AQ_"+Date.now()))+"_a",command.request,[]);

      if (action==="create_ledger_customer"||action==="create_ledger_supplier") {

        const formBack=msg=>({ok:true,type:"need_ledger_new_customer_form",reply:msg,pending_context:pc||{__blank:true},prefill_name:name,prefill_mobile:String(command.mobile||""),party:isSup?"supplier":"customer"});

        if (isSup) return {ok:true,saved:true,reply:`${name} ka naya supplier khata bana diya.`,card:{kind:"newsupplier",name,mobile}};
        if (!ctx) return {ok:true,saved:true,reply:`${name} ka naya khata bana diya.`,card:{kind:"newcustomer",name,mobile}};

      if (action==="resolve_ledger_missing_price") {

      if (action==="smart") {

      if (action==="supplier_purchase") {
        const gate=await ledgerSupplierGate(command,true); if (gate) return gate;
        if ((command.items||[]).some(i=>!(Number(i.amount)>0))||(!(command.items||[]).length&&!(Number(command.amount)>0))) return lgNote("💬","amber","In cheezon ki qeemat (Rs) bhi likh dein, phir main supplier ke khate mein daal deta hoon.");
        const res=await commitResult(await processLedgerSupplierPurchase(command));
        if (res.ok&&res.saved) res.card={kind:"sup_entry",supplier:command.supplier,items:command.items||[],total:res.transaction?.total,newAccount:!!command.__created,balance:await ledgerSupBalance(command).catch(()=>undefined)};
        return res;
      }
      if (action==="supplier_payment") {
        const gate=await ledgerSupplierGate(command,true); if (gate) return gate;
        const res=await commitResult(await processSupplierPayment(command));
        if (res.ok&&res.saved) { res.reply=`Theek hai, ${command.supplier} ko Rs ${formatNumber(command.amount)} de diye.`; res.card={kind:"sup_payment",supplier:command.supplier,amount:Number(command.amount),balance:await ledgerSupBalance(command).catch(()=>undefined)}; }
        return res;
      }
      if (action==="supplier_balance") {
        const gate=await ledgerSupplierGate(command,false); if (gate) return gate;
        const sp=await ledgerGetParty("S",supKey(command))||{};
        const bal=Number(sp.Balance||0);
        return {ok:true,reply:bal>0.005?`${command.supplier} ko Rs ${formatNumber(bal)} dene hain.`:bal<-0.005?`${command.supplier} se Rs ${formatNumber(-bal)} wapis lene hain.`:`${command.supplier} ka hisaab barabar hai.`,card:{kind:"sup_balance",supplier:command.supplier,balance:bal,mobile:sp.Mobile||""}};
      }
      if (action==="all_supplier_balances") {
        const sup=await ledgerGetParties("S")||{};
        const rows=Object.keys(sup).map(k=>({name:sup[k]?.Name||k,bal:Number(sup[k]?.Balance||0)})).filter(r=>Math.abs(r.bal)>0.005).sort((a,b)=>b.bal-a.bal);
        if (!rows.length) return lgNote("🎉","green","Kisi supplier ka udhaar baqi nahi hai.","Sab saaf!");
        const total=rows.filter(r=>r.bal>0).reduce((t,r)=>t+r.bal,0);
        return {ok:true,reply:`Suppliers ka udhaar — total Rs ${formatNumber(total)}\n`+rows.map((r,i)=>`${i+1}. ${r.name} — Rs ${formatNumber(r.bal)}`).join("\n"),card:{kind:"sup_all",rows:rows.slice(0,15),total,count:rows.length}};
      }
      if (action==="expense_report") {
        const res=await processExpenseReport(command);
        return {ok:true,reply:res.reply,card:{kind:"notice",icon:"💸",tone:"violet",title:"Expense Report",text:String(res.reply||"").replace(/^[^\wاآ-ی]+/,"").replace(/^Expense Report\s*/,"")}};
      }
      if (action==="cash_balance") {
        const res=await processCashBalance();
        const cash=Number((await ledgerGetTotals()).cash_in_hand||0);
        return {ok:true,reply:res.reply,card:{kind:"notice",icon:"🏦",tone:"green",title:"Gallay mein cash",text:`Rs ${formatNumber(cash)}`}};
      }

      if (action==="customer_payment") {
        const block=await ledgerNeedsCustomerFirst(command); if (block) return block;
        const res=await commitResult(await processCustomerPayment(command));
        if (res.ok&&res.saved) { res.reply=`Theek hai, ${command.customer} ne Rs ${formatNumber(command.amount)} ada kar diye.`; res.card={kind:"payment",customer:command.customer,amount:command.amount}; }
        return appendLedgerBalanceFootnote(res,command);
      }
      if (action==="customer_cash_out") {
        const block=await ledgerNeedsCustomerFirst(command); if (block) return block;
        const res=await commitResult(await processCustomerCashOut(command));
        if (res.ok&&res.saved) { res.reply=`Theek hai, ${command.customer} ke khate mein Rs ${formatNumber(command.amount)} likh diya.`; res.card={kind:"cashout",customer:command.customer,amount:command.amount}; }
        return appendLedgerBalanceFootnote(res,command);
      }
      if (action==="customer_balance") {
        const block=await ledgerNeedsCustomerFirst(command); if (block) return block;
        const res=await processCustomerBalance(command);
        if (res.ok&&res.reply) {
          res.reply=res.reply.split("\n\n")[0];
          const c=await ledgerGetParty("C",command.customer_key||sanitizeFirebaseKey(command.customer))||{};
          res.card={kind:"balance",customer:command.customer,balance:Number(c.Balance||0),mobile:c.Mobile||""};
        }
        return res;
      }
      if (action==="all_balances") return ledgerAllBalances();
      if (action==="list_recent_transactions") return ledgerRecent();
      if (action==="void_transaction"||action==="undo_last") {
        const r=await commitResult(await (action==="void_transaction"?processVoidTransaction(command,{}):processUndoLast(command,{})));
        if (r.saved) localStorage.removeItem(LAST_TXN_KEY);
        if (r.reply) r.card={kind:"notice",icon:r.saved?"↩️":"ℹ️",tone:r.saved?"amber":"blue",title:r.saved?"Entry cancel ho gayi":undefined,text:String(r.reply).replace(/^[^\wاآ-ی]+/,"")};
        return r;
      }
      if (action==="expense_add") {
        if (!command.__confirmed) {   // hamesha pehle confirmation card (Cancel / Ok), default category "My Expenses"
          const cats=await getExpenseCategories(), amt=Number(command.amount);
          return {ok:true,type:"need_ledger_expense_confirm",reply:"",exp:{amount:amt>0?amt:"",note:String(command.note||"").trim(),category:EXP_DEFAULT_CAT,categories:cats},pending_context:command};
        }
        const res=await commitResult(await processExpenseAdd(command));
        if (res.ok&&res.saved) {
          const cat=String(command.category||EXP_DEFAULT_CAT);
          res.reply=`Theek hai, ${cat} mein Rs ${formatNumber(command.amount)} ka kharcha likh diya.`;
          res.card={kind:"expense",category:cat,amount:Number(command.amount),note:command.note||"",txId:res.transaction?.id};
        }
        return res;
      }

      if (action==="cash_in"||action==="cash_out") {
        const isIn=action==="cash_in";
        if (!command.__confirmed) {   // card: amount + customer (optional) + details (optional); command mein jo mila woh prefilled
          const amt=Number(command.amount);
          let customer="", details=String(command.details||"").trim();
          const person=String(command.person||command.customer||"").trim();
          if (person) {
            const m=findCustomer(person,await ledgerGetParties("C"));   // fuzzy match
            if (m.status==="found") customer=m.customer.Name||m.customer._key;
            else if (m.status==="multiple") customer=person;            // OK dabane par selectable list aayegi
            else if (!details) details=person;                          // khata nahi hai => sirf details mein
          }
          return {ok:true,type:"need_ledger_cash_confirm",reply:"",cash:{dir:isIn?"in":"out",amount:amt>0?amt:"",customer,details},pending_context:command};
        }
        const amount=Number(command.amount);
        if (!(amount>0)) return {ok:false,reply:"❌ Amount theek se samajh nahi aaya."};
        const details=String(command.details||"").trim();
        if (command.customer) {
          const block=await ledgerNeedsCustomerFirst(command); if (block) return block;
          const res=await commitResult(await (isIn?processCustomerPayment(command):processCustomerCashOut(command)));
          if (res.ok&&res.saved) {
            res.reply=isIn?`Theek hai, ${command.customer} ne Rs ${formatNumber(amount)} ada kar diye.`:`Theek hai, ${command.customer} ke khate mein Rs ${formatNumber(amount)} likh diya.`;
            res.card={kind:isIn?"payment":"cashout",customer:command.customer,amount,note:details};
          }
          return appendLedgerBalanceFootnote(res,command);
        }
        return commitResult(await processCashMisc(command,isIn));
      }

      if (action==="ledger_entry") {
        const block=await ledgerNeedsCustomerFirst(command); if (block) return block;
        const missing=checkLedgerMissingAmounts(command); if (missing) return missing;
        return appendLedgerBalanceFootnote(await commitResult(await processLedgerEntryCommit(command)),command);
      }

      return {ok:false,reply:`Yeh action samajh nahi aaya: ${command.action}`};
    }

    async function runLedgerMultiCommand(remaining, txnId, origText, priorReplies, startIndex) {
      const replies = priorReplies || [];
      let idx = startIndex || 0;
      while (remaining.length) {
        const cmd = remaining[0];
        cmd.client_txn_id = `${txnId}_p${idx}`;
        cmd.user_text = origText;
        const data = await executeLedgerCommand(cmd);

        if (LEDGER_INTERACTIVE.has(data.type)) {
          const carry = {__multi_remaining: remaining.slice(1), __multi_replies: replies, __multi_orig: origText, __multi_index: idx};
          if (data.pending_context) data.pending_context = {...data.pending_context, ...carry};
          else Object.assign(data, carry);
          return {ok:true, paused:true, data, replies};
        }

        if (data.ok&&(data.transaction||data.saved||LEDGER_NON_SAVING_ACTIONS.has(cmd.action))) {
          const ds=getTodayString();
          ledgerSaveChatHistory(origText,data.reply).catch(()=>{});
        }
        if (data.cards?.length) data.cards.forEach(x=>replies.push(x));
        else if (data.reply||data.card) replies.push({reply:data.reply,card:data.card});
        remaining = remaining.slice(1);
        idx++;
      }
      return {ok:true, paused:false, replies};
    }

    }

    // ─── 6) Changes confirm (purani → nayi value) ───────────

    // ─── Category picker (dropdown + nayi category) ─────────
    function exCatPicker(box,cats,selected,opts={}){
      const list=[]; [...(cats||[]),selected].forEach(c=>{ c=String(c||"").trim(); if (c&&!list.some(x=>catKey(x)===catKey(c))) list.push(c); });
      let chosen=String(selected||EXP_DEFAULT_CAT);

      box.innerHTML=`${open?"":`<div class="ex-cat"><span class="ex-cat-name">🏷️ <b data-n>${escapeHtml(chosen)}</b></span><button type="button" class="ex-cat-btn" data-change>Change category</button></div>`}<div class="ex-cat-edit" style="display:${open?"block":"none"};${open?"margin-top:0":""}"><div class="sx-input"><span class="ex-rs">🏷️</span><select data-sel>${list.map(c=>`<option value="${exAttr(c)}"${catKey(c)===catKey(chosen)?" selected":""}>${escapeHtml(c)}</option>`).join("")}<option value="__new__">➕ Nayi category add karein…</option></select></div><div class="sx-input" id="exNewW" data-neww style="display:none;margin-top:8px"><span class="ex-rs">✚</span><input data-new type="text" maxlength="40" placeholder="Nayi category ka naam" autocomplete="off"/></div></div>`;
      const edit=box.querySelector(".ex-cat-edit"), sel=box.querySelector("[data-sel]"), nw=box.querySelector("[data-neww]"), nin=box.querySelector("[data-new]");
      const nameEl=box.querySelector("[data-n]"), chg=box.querySelector("[data-change]");
      if (chg) chg.onclick=()=>{ edit.style.display=edit.style.display==="none"?"block":"none"; };
      sel.onchange=()=>{
        if (sel.value==="__new__") { nw.style.display="flex"; nin.focus(); return; }
        nw.style.display="none"; chosen=sel.value;
        if (nameEl) nameEl.textContent=chosen;
        if (!open) edit.style.display="none";
      };
      nin.addEventListener("input",()=>{ const v=nin.value.trim(); if (nameEl) nameEl.textContent=v||chosen; });
      return {
        isNew:()=>sel.value==="__new__",
        get(){
          if (sel.value==="__new__") { const v=nin.value.trim().replace(/\s+/g," ").slice(0,40); if (!v) return ""; return list.find(c=>catKey(c)===catKey(v))||v; }
          return chosen;
        }
      };
    }

  // ─── 8. Satah 2: chhota AI prompt ────────────────────────────
  function aiPrompt() {

        try { const all = await env.getAll(); if (all) { for (const [c, a] of Object.entries(all)) { const k = unck(c), e = { i: a && a.i, h: (a && a.h) | 0, c: (a && a.c) | 0, u: (a && a.u) | 0 }; if (ok(k, e)) map.set(k, e); } evict(); persist(); } } catch (e) {}

  }

  // lexicon ke ex[] se tayyar jawab (0 token, sync nahi hote)
  function buildSeeds() {

.bi-spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--border);border-top-color:var(--brand);animation:biSpin .9s linear infinite}
@keyframes biSpin{to{transform:rotate(360deg)}}
.bi-bmsg{font-size:.98rem;font-weight:600;max-width:320px}.bi-bsub{font-size:.76rem;color:var(--text-muted);max-width:300px;word-break:break-all}
.bi-bnote{font-size:.78rem;color:var(--amber);min-height:1em}
.bi-bar{width:240px;height:6px;border-radius:6px;background:var(--border);overflow:hidden}.bi-bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .3s}
.bi-link{background:none;border:none;color:var(--accent);font-size:.88rem;font-weight:700;padding:12px 14px;cursor:pointer}
.bi-review{flex:1;min-height:0;display:flex;flex-direction:column}
.bi-sum{padding:10px 14px 4px;font-size:.84rem;color:var(--text-secondary);line-height:1.5}.bi-sum b{color:var(--text-bright)}
.bi-tools{display:flex;gap:8px;padding:6px 14px 10px;flex-wrap:wrap}
.bi-chip{border:1px solid var(--border-strong);background:var(--surface-key);color:var(--text-secondary);border-radius:999px;padding:9px 14px;min-height:36px;font-size:.78rem;cursor:pointer}
.bi-tablewrap{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--divider)}
.bi-table{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}
.bi-table th{position:sticky;top:0;z-index:3;background:var(--surface-card);font-size:.62rem;letter-spacing:.8px;text-transform:uppercase;color:var(--text-muted);text-align:left;padding:9px 3px;font-weight:600}
.bi-table td{padding:5px 3px;border-bottom:1px solid var(--divider);vertical-align:top}
.bi-table .c0{width:34px;text-align:center}.bi-table th.c0{text-align:center}
.bi-table .cn{width:31%}.bi-table .cp{width:27%}.bi-table .cb{width:19%}.bi-table .ct{width:19%}.bi-table .cx{width:28px;padding:0}
.bi-table input[type=checkbox]{width:19px;height:19px;margin-top:8px;accent-color:var(--brand)}
.bi-in{width:100%;min-width:0;background:var(--surface-card);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text-bright);padding:8px 5px;font-size:.8rem;outline:none}
.bi-in:focus{border-color:var(--accent)}.bi-in.num{text-align:right}
.bi-sel{width:100%;min-width:0;background:var(--surface-card);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 2px;font-size:.78rem;font-weight:650;outline:none}.bi-sel.get{color:var(--red)}.bi-sel.give{color:var(--green)}
.bi-sel option{background:var(--surface-raised);color:var(--text-bright)}
.bi-x{border:none;background:transparent;color:var(--red);font-size:1rem;padding:8px 4px;cursor:pointer;width:100%}
.bi-flag{font-size:.64rem;color:var(--amber);margin-top:3px;min-height:0}
tr.bi-off .bi-in,tr.bi-off .bi-sel{opacity:.45}
.bi-foot{display:flex;gap:10px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--divider);flex-shrink:0;background:var(--bg-main)}
.bi-ghost,.bi-primary{border:none;border-radius:var(--r-xl);min-height:48px;padding:13px 16px;font-size:.92rem;font-weight:700;cursor:pointer}
.bi-ghost{flex:.7;background:var(--surface-key);color:var(--text-secondary);border:1px solid var(--border-strong)}
.bi-primary{flex:1.6;color:#fff;background:var(--brand)}
.bi-primary:disabled{opacity:.45}
.bi-big{font-size:2.4rem}.bi-dtitle{font-size:1.15rem;font-weight:700}.bi-dtext{font-size:.88rem;color:var(--text-secondary);line-height:1.6;max-width:320px;white-space:pre-wrap;word-break:break-word}
.bi-modal{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:24px}
.bi-mbox{background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--r-xl);padding:20px;max-width:320px;width:100%;display:flex;flex-direction:column;gap:16px}
.bi-mbox p{font-size:.92rem;line-height:1.5}.bi-mrow{display:flex;gap:10px}`;

  function build() {
    if (root) return;
    const s = document.createElement("style"); s.textContent = CSS; document.head.appendChild(s);
    root = document.createElement("div"); root.id = "biRoot";
    root.innerHTML = `
<div class="bi-head"><button class="bi-back" id="biBack" aria-label="Back">\u2039</button><div class="bi-title">Bulk Import</div></div>
<div class="bi-body" id="biChoose">
  <div class="bi-hello">Customers ya Suppliers ki file do (PDF, Excel, CSV ya photo). AI us me se naam, phone aur balance nikaal kar table me dikhayega.</div>
  <button class="bi-card" data-kind="customer"><span class="bi-ico">\uD83D\uDC65</span><span><b>Import Customers</b><small>PDF \u00B7 Excel \u00B7 CSV \u00B7 Photo</small></span></button>
  <button class="bi-card" data-kind="supplier"><span class="bi-ico">\uD83C\uDFED</span><span><b>Import Suppliers</b><small>PDF \u00B7 Excel \u00B7 CSV \u00B7 Photo</small></span></button>
  <div class="bi-note">Table me aap sab kuch edit kar sakte hain. Jab tak OK na dabayein kuch add nahi hoga.</div>
</div>
<div class="bi-body bi-center" id="biBusy" hidden>
  <div class="bi-spin"></div><div class="bi-bmsg" id="biBmsg"></div>
  <div class="bi-bar"><i id="biBar"></i></div><div class="bi-bsub" id="biBsub"></div><div class="bi-bnote" id="biBnote"></div>
  <button class="bi-link" id="biBcancel">Cancel</button>
</div>
<div class="bi-review" id="biReview" hidden>
  <div class="bi-sum" id="biSum"></div>
  <div class="bi-tools"><button class="bi-chip" id="biFlip">\u21C4 Lena/Dena ulta</button><button class="bi-chip" id="biAdd">+ Row</button></div>
  <div class="bi-tablewrap"><table class="bi-table"><thead><tr>
    <th class="c0"><input type="checkbox" id="biAll" checked></th><th class="cn">Name</th><th class="cp">Phone</th><th class="cb">Rs</th><th class="ct">Type</th><th class="cx"></th>
  </tr></thead><tbody id="biRows"></tbody></table></div>
  <div class="bi-foot"><button class="bi-ghost" id="biCancel">Cancel</button><button class="bi-primary" id="biOk">OK</button></div>
</div>
<div class="bi-body bi-center" id="biDone" hidden>
  <div class="bi-big" id="biDIco"></div><div class="bi-dtitle" id="biDTitle"></div><div class="bi-dtext" id="biDText"></div>
  <div class="bi-mrow" style="width:100%;max-width:320px"><button class="bi-ghost" id="biMore">Aur import</button><button class="bi-primary" id="biClose">Theek hai</button></div>
</div>
<input type="file" id="biFile" hidden accept=".pdf,.xlsx,.xls,.xlsm,.ods,.csv,.tsv,.txt,image/*,application/pdf">`;
    document.body.appendChild(root);

    root.querySelectorAll(".bi-card").forEach(b => b.addEventListener("click", () => { st.kind = b.dataset.kind; const f = q("#biFile"); f.value = ""; f.click(); }));
    q("#biFile").addEventListener("change", e => { const f = e.target.files && e.target.files[0]; if (f) start(f); });
    q("#biBack").addEventListener("click", back);
    q("#biBcancel").addEventListener("click", () => { st.run++; show("biChoose"); });
    q("#biCancel").addEventListener("click", back);
    q("#biOk").addEventListener("click", doImport);
    q("#biAll").addEventListener("change", e => { const on = e.target.checked; st.rows.forEach(r => { if (!r.flag) r.sel = on; }); renderRows(); });
    q("#biFlip").addEventListener("click", () => { st.rows.forEach(r => { r.dir = flip(r.dir); }); renderRows(); });
    q("#biAdd").addEventListener("click", () => { st.rows.push(mkRow({ name: "", phone: "", amount: 0, dir: defDir() })); refreshFlags(); renderRows(); const t = q("#biRows"); t.lastElementChild && t.lastElementChild.querySelector('[data-f="name"]').focus(); });
    q("#biMore").addEventListener("click", () => show("biChoose"));
    q("#biClose").addEventListener("click", close);
    const tb = q("#biRows");
    tb.addEventListener("input", e => { const el = e.target, tr = el.closest("tr"); if (!tr || !el.dataset.f) return; const r = rowOf(tr); if (!r) return; const f = el.dataset.f; if (f === "name" || f === "phone" || f === "amt") { r[f] = el.value; if (f === "name") refreshFlags(); updateSummary(); } });
    tb.addEventListener("change", e => {
      const el = e.target, tr = el.closest("tr"); if (!tr || !el.dataset.f) return; const r = rowOf(tr); if (!r) return;
      if (el.dataset.f === "sel") { r.sel = el.checked; tr.classList.toggle("bi-off", !r.sel); }
      else if (el.dataset.f === "dir") { r.dir = el.value; el.className = "bi-sel " + r.dir; }
      updateSummary();
    });
    tb.addEventListener("click", e => { const b = e.target.closest('[data-f="del"]'); if (!b) return; const r = rowOf(b.closest("tr")); if (!r) return; st.rows = st.rows.filter(x => x !== r); refreshFlags(); renderRows(); });
  }
  const rowOf = tr => st.rows.find(r => String(r.id) === tr.dataset.id);
  function show(id) {
    ["biChoose", "biBusy", "biReview", "biDone"].forEach(x => { q("#" + x).hidden = x !== id; });
    st.screen = id;
  }
  function setBusy(msg, pct, sub) {
    show("biBusy"); q("#biBmsg").textContent = msg || "";
    if (pct != null) q("#biBar").style.width = Math.max(3, Math.min(100, pct)) + "%";
    if (sub != null) q("#biBsub").textContent = sub;
    q("#biBcancel").hidden = st.importing;
  }
  function setNote(t) { if (root) q("#biBnote").textContent = t || ""; }
  function showError(e) {
    let title = "Kuch masla aa gaya", hint = "", detail = "";
    const info = e && (e.res || (e instanceof TransientError ? e.info : null));
    if (info) { const i = llmErrorInfo(info); title = i.title; hint = i.hint; detail = i.detail; }
    else { title = String((e && e.message) || e || "Error"); }
    usageLog("error", { msg: "[BulkImport] " + title + " " + detail });
    done("\u26A0\uFE0F", title, (hint ? hint + "\n" : "") + (detail ? detail : ""), false);
  }
  function done(ico, title, text, ok) {
    show("biDone"); q("#biDIco").textContent = ico; q("#biDTitle").textContent = title; q("#biDText").textContent = text || "";
    q("#biMore").textContent = ok ? "Aur import" : "Dobara try"; setOpen(true);
  }
  function ask(msg, okLabel, cb) {
    const m = document.createElement("div"); m.className = "bi-modal";
    m.innerHTML = '<div class="bi-mbox"><p></p><div class="bi-mrow"><button class="bi-ghost" data-a="n">Nahi</button><button class="bi-primary" data-a="y"></button></div></div>';
    m.querySelector("p").textContent = msg; m.querySelector('[data-a="y"]').textContent = okLabel;
    m.addEventListener("click", e => { const a = e.target.dataset && e.target.dataset.a; if (a) { m.remove(); if (a === "y") cb(); } });
    root.appendChild(m);
  }
  function setOpen(v) { bridgeCall("bulkSetOpen", !!v); }
  function close() { if (root) root.classList.remove("on"); st.run++; setOpen(false); }

  // table
  function mkRow(r) {
    return { id: st.nextId++, sel: true, name: r.name || "", phone: r.phone || "", amt: String(r.amount || 0), dir: r.dir === "give" ? "give" : "get", flag: "", autoOff: false };
  }
  function loadExisting() {
    st.existing = new Set();
    try { const a = JSON.parse(bridgeCall("getPartyNames", st.kind) || "[]"); a.forEach(x => st.existing.add(normName(x.name))); } catch (e) {}
  }
  const FLAG_TXT = { exists: "\u26A0 Pehle se maujood hai", file: "\u26A0 Isi list me dobara hai \u2014 naam badlein", noname: "\u26A0 Naam likhein" };
  function refreshFlags() {
    const seen = new Set();
    st.rows.forEach(r => {
      const n = normName(r.name); let f = "";
      if (!n) f = "noname"; else if (st.existing.has(n)) f = "exists"; else if (seen.has(n)) f = "file";
      if (n && !f) seen.add(n);
      if (f && !r.flag) { r.autoOff = r.sel; r.sel = false; }
      if (!f && r.flag && r.autoOff) { r.sel = true; r.autoOff = false; }
      if (f !== r.flag) { r.flag = f; const tr = root && q('tr[data-id="' + r.id + '"]'); if (tr) paintRow(tr, r); }
    });
  }
  function paintRow(tr, r) {
    tr.classList.toggle("bi-off", !r.sel);
    const c = tr.querySelector('[data-f="sel"]'); c.checked = r.sel; c.disabled = !!r.flag;
    tr.querySelector(".bi-flag").textContent = FLAG_TXT[r.flag] || "";
  }
  function renderRows() {
    q("#biRows").innerHTML = st.rows.map(r => `<tr data-id="${r.id}">
<td class="c0"><input type="checkbox" data-f="sel"></td>
<td class="cn"><input class="bi-in" data-f="name" value="${esc(r.name)}" placeholder="Naam" autocomplete="off"><div class="bi-flag"></div></td>
<td class="cp"><input class="bi-in" data-f="phone" inputmode="tel" value="${esc(r.phone)}" placeholder="03xx..." autocomplete="off"></td>
<td class="cb"><input class="bi-in num" data-f="amt" inputmode="numeric" value="${esc(r.amt)}" autocomplete="off"></td>
<td class="ct"><select class="bi-sel ${r.dir}" data-f="dir"><option value="get"${r.dir === "get" ? " selected" : ""}>Lena</option><option value="give"${r.dir === "give" ? " selected" : ""}>Dena</option></select></td>
<td class="cx"><button class="bi-x" data-f="del" aria-label="Delete">\u2715</button></td></tr>`).join("");
    q("#biRows").querySelectorAll("tr").forEach(tr => paintRow(tr, rowOf(tr)));
    updateSummary();
  }
  function ready() { return st.rows.filter(r => r.sel && !r.flag); }
  function updateSummary() {
    const rs = ready(); let g = 0, v = 0;
    rs.forEach(r => { const n = parseAmt(r.amt).n; if (r.dir === "give") v += n; else g += n; });
    q("#biSum").innerHTML = "<b>" + st.rows.length + "</b> mile \u00B7 <b>" + rs.length + "</b> add honge<br>Lena: <b>Rs " + fmt(g) + "</b> \u00B7 Dena: <b>Rs " + fmt(v) + "</b>";
    const ok = q("#biOk"); ok.disabled = !rs.length; ok.textContent = rs.length ? "OK \u2014 " + rs.length + " " + kindWord() + " add karein" : "OK";
    const all = q("#biAll"), el = st.rows.filter(r => !r.flag); all.checked = el.length > 0 && el.every(r => r.sel);
  }

  // flow
  async function start(file) {
    const my = ++st.run; st.importing = false;
    setBusy("File parh raha hoon…", 5, file.name || "");
    try {
      let rows = await extract(file, my); alive(my);
      if (rows.length > MAX_ROWS) { rows = rows.slice(0, MAX_ROWS); }
      if (!rows.length) { done("\uD83D\uDD0D", "Koi " + (st.kind === "supplier" ? "supplier" : "customer") + " nahi mila", "File me naam/phone/balance nazar nahi aaye. Dusri file ya saaf photo try karein.", false); return; }
      loadExisting();
      st.rows = rows.map(mkRow); refreshFlags(); renderRows(); show("biReview");
    } catch (e) { if (isCancel(e)) return; console.warn("[BulkImport]", e); showError(e); }
  }
  function doImport() {
    const list = ready().map(r => ({ name: cleanName(r.name), phone: cleanPhone(r.phone) || String(r.phone || "").trim(), amount: parseAmt(r.amt).n, dir: r.dir })).filter(r => r.name);
    if (!list.length) return;
    if (!(window.AndroidBridge && typeof AndroidBridge.bulkImport === "function")) { done("\u26A0\uFE0F", "App update chahiye", "Bulk Import ke liye ShopAI app ka naya version install karein.", false); return; }
    st.importing = true; setBusy(list.length + " " + kindWord() + " add ho rahe hain…", 3, "");
    let r; try { r = AndroidBridge.bulkImport(st.kind, JSON.stringify(list)); } catch (e) { r = "error"; }
    if (r !== "started") { st.importing = false; done("\u26A0\uFE0F", r === "busy" ? "Pehla import abhi chal raha hai" : "Import shuru nahi ho saka", "Thori der baad dobara koshish karein.", false); }
  }
  function _progress(d, t) { if (!root || !st.importing) return; setBusy(d + "/" + t + " add ho gaye…", t ? 100 * d / t : 0); }
  function _done(res) {
    st.importing = false; res = res || {};
    try { localStorage.removeItem(CUSTOMER_CACHE_KEY); WARM_MEMO = {}; LIVE.dirtyUntil = Date.now() + LIVE_DIRTY_MS; } catch (e) {}
    const add = res.added || 0, sk = res.skipped || 0, fl = res.failed || 0, bf = res.balanceFailed || 0;
    let t = [];
    if (sk) t.push(sk + " pehle se maujood the (skip)");
    if (fl) t.push(fl + " add nahi ho sake");
    if (bf) t.push(bf + " ka balance save nahi hua");
    if (res.errors && res.errors.length) t.push(res.errors.join("\n"));
    if (!t.length) t.push("Customers/Suppliers screen me dekh lein. Server par upload background me ho jata hai.");
    usageLog("cmd", { label: "bulk import", kind: st.kind, added: add, skipped: sk, failed: fl });
    done(add ? "\u2705" : "\u26A0\uFE0F", add + " " + kindWord() + " add ho gaye", t.join("\n"), !!add);
  }
  function open() {
    build(); st.run++; st.importing = false; st.rows = []; show("biChoose"); root.classList.add("on"); setOpen(true);
  }
  function back() {
    if (!root || !root.classList.contains("on")) return;
    if (st.importing) return;
    if (st.screen === "biBusy") { st.run++; show("biChoose"); return; }
    if (st.screen === "biReview") { ask("Table band karein? Jo kuch nikla hai wo hat jayega.", "Haan, band", () => show("biChoose")); return; }
    if (st.screen === "biDone") { show("biChoose"); return; }
    close();
  }

  window.BulkImport = { open, back, _progress, _done,
    _t: { pdfTableRows, detLine, verifyAi, parseAmt, cleanPhone, cleanName, parseCsv, heurMap, applyMap, normMap, chunkLines, tidyRows, normAi, dedupe, st } };
})();
  </script>
</body>
</html>
