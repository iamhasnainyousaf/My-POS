    function normalizePeriod(period) {
      period=String(period||"daily").toLowerCase();
      if (["today","daily","day"].includes(period)) return "daily";
      if (["yesterday","kal"].includes(period)) return "yesterday";
      if (["week","weekly"].includes(period)) return "weekly";
      if (["month","monthly"].includes(period)) return "monthly";
      if (["year","yearly"].includes(period)) return "yearly";
      if (["all","lifetime"].includes(period)) return "lifetime";
      return period.includes("previous_")?period:"daily";
    }

    function formatStatsReport(stats, period, globalCash) {
      const map={
        daily:"Today's",yesterday:"Yesterday's",weekly:"This Week's",
        previous_week:"Previous Week",monthly:"This Month's",
        previous_month:"Previous Month",yearly:"This Year's",
        previous_year:"Previous Year",lifetime:"Lifetime"
      };
      let reply=`📊 ${map[normalizePeriod(period)]||"General"} Report\n\n`;
      reply+=`💰 Total Sales:Rs ${formatNumber(stats.TotalSales||0)}\n`;
      reply+=`📦 Total Cost:Rs ${formatNumber(stats.TotalCost||0)}\n`;
      reply+=`📈 Total Profit:Rs ${formatNumber(stats.TotalProfit||0)}\n`;
      reply+=`💵 Naqad Sales:Rs ${formatNumber(stats.TotalCash||0)}\n`;
      reply+=`🧾 Udhaar Sales:Rs ${formatNumber(stats.TotalCredit||0)}\n`;
      if (stats.TotalReturns>0) reply+=`↩️ Returns:Rs ${formatNumber(stats.TotalReturns||0)} (${formatNumber(stats.ReturnCount||0)})\n`;
      if (stats.TotalExpense>0) reply+=`💸 Kharcha:Rs ${formatNumber(stats.TotalExpense||0)}\n`;
      if (stats.CashIn>0||stats.CashOut>0) reply+=`\n💱 Cash Flow:\n   Cash In(+):Rs ${formatNumber(stats.CashIn||0)}\n   Cash Out(-):Rs ${formatNumber(stats.CashOut||0)}\n`;
      reply+=`\n🏦 Cash In Hand:Rs ${formatNumber(globalCash.CashInHand||0)}\n🛒 Sales Count:${formatNumber(stats.SaleCount||0)}`;
      const rows=Object.keys(stats.Products||{}).map(k=>stats.Products[k]).filter(p=>p.Revenue!==0||p.Qty!==0).sort((a,b)=>b.Revenue-a.Revenue);
      if (rows.length) {
        reply+="\n\n🛍️ Product Sales:";
        rows.forEach((p,i)=>{reply+=`\n\n${i+1}. ${p.Name}\n   Sold:${formatNumber(p.Qty||0)} | Times:${formatNumber(p.TimesSold||0)}\n   Rev:Rs ${formatNumber(p.Revenue||0)} | Profit:Rs ${formatNumber(p.Profit||0)}`;});
      }
      return {ok:true,reply};
    }

    async function processReport(command) {
      const period=normalizePeriod(command.period);
      const globalCash=await firebaseRequest("CashManagement","GET")||{CashInHand:0,CashIn:0,CashOut:0};
      if (["daily","weekly","monthly","yearly","lifetime"].includes(period)) {
        const stats=await firebaseRequest(getStatsBucketPaths(new Date())[period],"GET");
        if (stats&&typeof stats==="object") return formatStatsReport(stats,period,globalCash);
        return {ok:true,reply:"📊 Is period ka abhi koi data nahi hai."};
      }
      if (period==="yesterday") {
        const y=new Date();y.setDate(y.getDate()-1);
        const stats=await firebaseRequest(getStatsBucketPaths(y).daily,"GET");
        if (stats&&typeof stats==="object") return formatStatsReport(stats,period,globalCash);
        return {ok:true,reply:"📊 Kal ka koi data nahi mila."};
      }
      if (period==="previous_month") {
        const m=new Date();m.setDate(1);m.setMonth(m.getMonth()-1);
        const stats=await firebaseRequest(getStatsBucketPaths(m).monthly,"GET");
        if (stats&&typeof stats==="object") return formatStatsReport(stats,period,globalCash);
        return {ok:true,reply:"📊 Pichle mahine ka koi data nahi mila."};
      }
      return {ok:true,reply:"📊 Yeh period abhi support nahi hai."};
    }

    async function processProductReport(command, products) {
      const m=findProduct(command.product,products);
      if (m.status!=="found") return {ok:false,reply:"❌ Product nahi mila."};
      const p=m.product, targetName=canonicalName(p.Name||p._key), period=normalizePeriod(command.period||"monthly");
      if (["daily","weekly","monthly","yearly","lifetime"].includes(period)) {
        const stats=await firebaseRequest(getStatsBucketPaths(new Date())[period],"GET");
        if (stats?.Products) {
          for (const k of Object.keys(stats.Products)) {
            if (canonicalName(k)===targetName||canonicalName(stats.Products[k].Name)===targetName) {
              const pp=stats.Products[k];
              return {ok:true,reply:`📊 ${p.Name||p._key}\nPeriod:${period}\nSold:${formatNumber(pp.Qty||0)}\n🔢 Times:${formatNumber(pp.TimesSold||0)}\n💰 Revenue:Rs ${formatNumber(pp.Revenue||0)}\n📦 Cost:Rs ${formatNumber(pp.Cost||0)}\n📈 Profit:Rs ${formatNumber(pp.Profit||0)}`};
            }
          }
        }
      }
      return {ok:false,reply:"📊 No data found for this period."};
    }

    async function processChatHistory() {
      const now=new Date(), dates=[];
      for (let i=0;i<7;i++){const d=new Date(now-i*86400000);dates.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`);}
      const responses=await firebaseParallelGet(dates.map(d=>`ChatHistory/${d}`));
      let allChats=[];
      responses.forEach(day=>{if(day)Object.values(day).forEach(c=>allChats.push(c));});
      if (!allChats.length) return {ok:true,reply:"📭 Pichle 7 din ki koi chat history nahi mili."};
      allChats.sort((a,b)=>a.timestamp-b.timestamp);
      let reply="📜 Last 7 Days Chat History:\n\n";
      allChats.slice(-40).forEach(c=>{
        const d=new Date(c.timestamp);
        const t=`${d.getDate()} ${d.toLocaleString("default",{month:"short"})}, ${d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}`;
        reply+=`👤 [${t}]\n💬 You:${c.user}\n🤖 AI:${c.ai}\n${"-".repeat(20)}\n`;
      });
      return {ok:true,reply:reply.trim()};
    }

    async function processAddToKhata(command) {
      const customer=String(command.customer||"").trim();
      const items=command.items||[];
      if (!customer) return {ok:false,reply:"❌ Customer ka naam batayein."};
      if (!items.length) return {ok:false,reply:"❌ Kaunsa item khate mein add karna hai batayein."};
      const label=items.map(it=>`${formatNumber(it.qty||1)} × ${it.product}`).join(", ");
      const ck=custKey(command);
      const updates={};
      updates[`Customers/${ck}/Name`]=customer;
      const txId=command.client_txn_id||("NOTE_"+Date.now());
      updates[`Transactions/${txId}`]={id:txId,type:"khata_note",customer,customer_key:ck,items,note:label,timestamp:Date.now(),date:getTodayString()};
      return {ok:true,reply:`📝 Khate mein note add ho gaya\n👤 ${customer}\n📦 ${label}\n\nℹ️ Yeh sirf note hai, price/balance nahi badla. Agar yeh sale/udhaar hai to "sale" bol kar dein.`,updates,transaction:{type:"khata_note"}};
    }

    async function processAddNewProduct(command) {
      if (!command.product) return {ok:false,reply:"❌ Product ka naam batayein."};
      const name=String(command.product).trim();
      const productKey=sanitizeFirebaseKey(name);
      const existing=await firebaseRequest(`Products/${productKey}`,"GET");
      if (existing) return {ok:false,reply:`⚠️ Ye product pehle se database mein mojood hai: ${name}`};
      const price=Number(command.price||0), cost=Number(command.cost||0);
      const stock=Number(command.stock||0), unit=String(command.unit||"pcs").trim();
      const updates={[`Products/${productKey}`]:{Name:name,Price:price,Cost:cost,Stock:stock,Unit:unit,updatedAt:Date.now()}};
      return {ok:true,reply:`✅ New Product Added!\n📦 ${name}\n💰 Sale Price:Rs ${formatNumber(price)}\n📉 Cost:Rs ${formatNumber(cost)}\n📊 Stock:${formatNumber(stock)} (${unit})`,updates};
    }

    // Appends the customer's current balance to a result's reply, whenever this
    // action just changed it. Covers "uska balance kitna reh gaya" automatically.
    async function appendBalanceFootnote(res, command) {
      if (res?.ok&&res?.saved&&command?.customer) {
        try {
          const ck=command.customer_key||custKey(command);
          const bal=Number(await firebaseRequest(`Customers/${ck}/Balance`,"GET")||0);
          res.reply=(res.reply||"")+`\n⚖️ Naya Balance:Rs ${formatNumber(bal)}`;
        } catch(e){}
      }
      return res;
    }

    // ─── MASTER EXECUTOR ──────────────────────────────────────
    async function executeCommand(command, products) {
      if (!command?.action) return {ok:false,reply:"Command samajh nahi aayi."};
      const action=String(command.action).toLowerCase();

      if (action==="chat") return {ok:true,reply:command.reply||"Acha g, batayein aur kya madad kar sakta hoon?"};
      if (action==="add_new_product_form") return {ok:true,type:"need_add_product_form",reply:command.reply||"📦 Naya product add karne ke liye form fill karein:"};

      // Direct update actions → confirm first
      if (["update_price_direct","update_cost_direct","update_stock_direct","update_stock_add"].includes(action)) {
        const val=Number(command.value);
        if (!command.product||!isFinite(val)) return {ok:false,reply:"❌ Product ya value theek se samajh nahi aayi."};
        let p=products[command.product]?{...products[command.product],_key:command.product}:null;
        if (!p){const m=findProduct(command.product,products);if(m.status==="not_found")return{ok:false,reply:`❌ Product nahi mila: ${command.product}`};if(m.status==="multiple")return{ok:true,type:"need_clarification",reply:`⚠️ "${command.product}" ke liye ek se zyada products match huay. Sahi product select karein:`,options:m.matches,pending_context:command};p=m.product;}
        const fieldLabel=action==="update_cost_direct"?"Cost":action.includes("stock")?"Stock":"Price";
        const isAdd=action==="update_stock_add"||(String(command.value_mode||"").toLowerCase()==="add"&&action.includes("stock"));
        const curVal=action==="update_cost_direct"?Number(p.Cost||0):action.includes("stock")?Number(p.Stock||0):Number(p.Price||0);
        const finalVal=isAdd?curVal+val:val;
        const changeNote=isAdd?` (${curVal} + ${val})`:"";
        return {ok:true,type:"need_direct_update_confirmation",reply:`⚠️ Kya aap ${p.Name||p._key} ka ${fieldLabel} update kar ke ${finalVal} karna chahte hain?${changeNote}`,product_key:p._key,product_name:p.Name||p._key,field:action,value:finalVal};
      }

      if (action==="resolve_direct_update") {
        const pKey=sanitizeFirebaseKey(command.product_key);
        const dbField=command.field==="update_cost_direct"?"Cost":command.field.includes("stock")?"Stock":"Price";
        const val=Number(command.value);
        const updates={[`Products/${pKey}/${dbField}`]:val,[`Products/${pKey}/updatedAt`]:Date.now()};
        await firebaseRequest("","PATCH",updates);
        patchLocalCaches(updates);
        return {ok:true,saved:true,reply:`✅ ${dbField} updated to ${val} for ${command.product_name}!`};
      }

      // _request actions → show form
      if (["update_price_request","update_cost_request","update_stock_request"].includes(action)) {
        if (!command.product) return {ok:false,reply:"❌ Kis product ki detail update karni hai uska naam batayein."};
        let p=products[command.product]?{...products[command.product],_key:command.product}:null;
        if (!p){const m=findProduct(command.product,products);if(m.status==="not_found")return{ok:false,reply:`❌ Product nahi mila: ${command.product}`};if(m.status==="multiple")return{ok:true,type:"need_clarification",reply:`⚠️ "${command.product}" ke liye ek se zyada products match huay. Sahi product select karein:`,options:m.matches,pending_context:command};p=m.product;}
        const fieldType=action.replace("_request","");
        return {ok:true,type:"need_update_field_form",reply:`✏️ Update ${p.Name||p._key} (${fieldType.replace("update_","").toUpperCase()})`,product_key:p._key,product_name:p.Name||p._key,field:fieldType};
      }

      if (action==="resolve_update_field") {
        const pKey=sanitizeFirebaseKey(command.product_key);
        const dbField=command.field==="update_cost"?"Cost":command.field==="update_stock"?"Stock":"Price";
        const val=Number(command.value);
        if (!isFinite(val)||val<0) return {ok:false,reply:"❌ Value galat hai."};
        const updates={[`Products/${pKey}/${dbField}`]:val,[`Products/${pKey}/updatedAt`]:Date.now()};
        await firebaseRequest("","PATCH",updates);
        patchLocalCaches(updates);
        return {ok:true,saved:true,reply:`✅ ${dbField} updated to ${val} for ${command.product_name}!`};
      }

      // Customer resolution middleware
      if (command.customer&&!command.customer_resolved&&action!=="resolve_customer_clarification") {
        const customers=await getCustomersCached();
        const m=findCustomer(command.customer,customers);
        if (m.status==="multiple") return {ok:true,type:"need_customer_clarification",reply:`⚠️ "${command.customer}" naam se miltay jultay khatey hain. Sahi khata select karein ya naya banayein:`,options:m.matches,pending_context:command};
        if (m.status==="found") { command.customer=m.customer.Name||m.customer._key; command.customer_key=m.customer._key; }
        else {
          if (action==="customer_balance") return {ok:false,reply:`❌ "${command.customer}" naam ka koi khata nahi mila.`};
          return {ok:true,type:"need_customer_clarification",reply:`🆕 "${command.customer}" naam ka khata nahi mila. Naya khata banayein?`,options:[],pending_context:command};
        }
        command.customer_resolved=true;
      }

      if (action==="resolve_customer_clarification") {
        const ctx=command.pending_context;
        if (!ctx) return {ok:false,reply:"❌ Session context expire ho gaya hai."};
        if (command.client_txn_id) ctx.client_txn_id=command.client_txn_id;
        ctx.customer=command.selected_customer;
        if (command.selected_customer_key) ctx.customer_key=command.selected_customer_key; else delete ctx.customer_key;
        ctx.customer_resolved=true;
        return executeCommand(ctx,products);
      }

      // Supplier resolution middleware
      if (command.supplier&&!command.supplier_resolved&&action!=="resolve_supplier_clarification") {
        const suppliers=await firebaseRequest("Suppliers","GET")||{};
        const m=findSupplier(command.supplier,suppliers);
        if (m.status==="multiple") return {ok:true,type:"need_customer_clarification",reply:`⚠️ "${command.supplier}" naam se miltay jultay suppliers hain. Sahi select karein ya naya banayein:`,options:m.matches,pending_context:command,is_supplier:true};
        if (m.status==="found") { command.supplier=m.supplier.Name||m.supplier._key; command.supplier_key=m.supplier._key; }
        else {
          if (action==="supplier_balance") return {ok:false,reply:`❌ "${command.supplier}" naam ka koi supplier khata nahi mila.`};
          return {ok:true,type:"need_customer_clarification",reply:`🆕 "${command.supplier}" naam ka supplier khata nahi mila. Naya banayein?`,options:[],pending_context:command,is_supplier:true};
        }
        command.supplier_resolved=true;
      }

      if (action==="resolve_supplier_clarification") {
        const ctx=command.pending_context;
        if (!ctx) return {ok:false,reply:"❌ Session context expire ho gaya hai."};
        if (command.client_txn_id) ctx.client_txn_id=command.client_txn_id;
        ctx.supplier=command.selected_customer;
        if (command.selected_customer_key) ctx.supplier_key=command.selected_customer_key; else delete ctx.supplier_key;
        ctx.supplier_resolved=true;
        return executeCommand(ctx,products);
      }

      if (action==="resolve_clarification") {
        const ctx=command.pending_context;
        if (!ctx) return {ok:false,reply:"❌ Session context expire ho gaya hai."};
        if (command.client_txn_id) ctx.client_txn_id=command.client_txn_id;
        const selKey=command.selected_product_key||command.selected_product;
        if (ctx.items) {
          const idx=command.target_index!==undefined?command.target_index:(ctx.target_index||0);
          let matched=null;
          if (products[selKey]) matched={...products[selKey],_key:selKey};
          else { const m=findProduct(command.selected_product,products); if(m.status==="found") matched=m.product; }
          if (matched){ctx.items[idx]._resolvedProduct=matched;ctx.items[idx].product=matched.Name||matched._key;}
          else ctx.items[idx].product=command.selected_product;
          ctx.user_text=command.user_text;
          return appendBalanceFootnote(await commitResult(await (ctx.action==="return"?processReturn(ctx,products):processSale(ctx,products))), ctx);
        } else {
          ctx.product=selKey;
          return executeCommand(ctx,products);
        }
      }

      if (action==="resolve_missing") {
        const ctx=command.pending_context, decision=command.decision;
        if (!ctx?.items) return {ok:false,reply:"❌ Session context expire ho gaya hai."};
        if (decision==="cancel") return {ok:true,reply:"🚫 Transaction cancel kar di gayi."};
        const missingIdx=(command.missing_indices||[]).map(Number);
        if (decision==="skip") {
          ctx.items=ctx.items.filter((_,i)=>!missingIdx.includes(i));
          if (!ctx.items.length) return {ok:false,reply:"❌ Sari items missing theen."};
          if (command.client_txn_id) ctx.client_txn_id=command.client_txn_id;
          return appendBalanceFootnote(await commitResult(await (ctx.action==="return"?processReturn(ctx,products):processSale(ctx,products))), ctx);
        }
        if (decision==="manual") {
          const mp=command.manual_prices||{};
          ctx.items.forEach((item,i)=>{
            if (!missingIdx.includes(i)) return;
            const pv=Number(mp[i]!==undefined?mp[i]:mp[String(i)]||0);
            item.is_misc=true;item.amount=pv;item.price=pv;item.qty=1;item._resolvedProduct=null;
            item.product=String(item.product).replace(/\s*\(Unlisted\)/gi,"")+" (Unlisted)";
          });
          if (command.client_txn_id) ctx.client_txn_id=command.client_txn_id;
          return appendBalanceFootnote(await commitResult(await (ctx.action==="return"?processReturn(ctx,products):processSale(ctx,products))), ctx);
        }
        return {ok:false,reply:"❌ Galat decision option."};
      }

      if ((action==="sale"||action==="return")&&!command.items&&command.product)
        command.items=[command];

      let res;
      switch(action) {
        case "sale":               res=await commitResult(await processSale(command,products)); break;
        case "return":             res=await commitResult(await processReturn(command,products)); break;
        case "purchase":           res=await commitResult(await processPurchase(command,products)); break;
        case "add_new_product":    res=await commitResult(await processAddNewProduct(command)); break;
        case "add_to_khata":       res=await commitResult(await processAddToKhata(command)); break;
        case "customer_payment":   res=await commitResult(await processCustomerPayment(command)); break;
        case "customer_cash_out":  res=await commitResult(await processCustomerCashOut(command)); break;
        case "expense_add":        res=await commitResult(await processExpenseAdd(command)); break;
        case "expense_report":     res=await processExpenseReport(command); break;
        case "supplier_purchase":  res=await commitResult(await processSupplierPurchase(command,products)); break;
        case "supplier_payment":   res=await commitResult(await processSupplierPayment(command)); break;
        case "supplier_balance":   res=await (async()=>{if(!command.supplier)return{ok:false,reply:"❌ Supplier ka naam batayein."};const sk=supKey(command);const b=await firebaseRequest(`Suppliers/${sk}/Balance`,"GET")||0;return{ok:true,reply:`🏭 ${command.supplier} ko dena hai:Rs ${formatNumber(b)}`};})(); break;
        case "all_supplier_balances": res=await processAllSupplierBalances(); break;
        case "list_recent_transactions": res=await processListRecentTransactions(); break;
        case "void_transaction":   res=await commitResult(await processVoidTransaction(command,products)); if(res.saved)localStorage.removeItem(LAST_TXN_KEY); break;
        case "list_products":      res=processListProducts(products); break;
        case "low_stock":          res=processLowStock(products); break;
        case "stock":
        case "product_search":     res=processStock(command,products); break;
        case "customer_balance":   res=await processCustomerBalance(command); break;
        case "all_balances":       res=await processAllBalances(); break;
        case "cash_balance":       res=await processCashBalance(); break;
        case "undo_last":          res=await commitResult(await processUndoLast(command,products)); if(res.saved)localStorage.removeItem(LAST_TXN_KEY); break;
        case "report":             res=await processReport(command); break;
        case "product_report":     res=await processProductReport(command,products); break;
        case "chat_history":       res=await processChatHistory(); break;
        default:                   res={ok:false,reply:`❌ Unknown action: ${command.action}`};
      }
      // Auto-append the customer's updated balance whenever this action just
      // changed it (sale/return/payment/cash-out for a named customer), so the
      // user doesn't have to ask separately — covers "uska balance kitna reh gaya".
      if (["sale","return","customer_payment","customer_cash_out"].includes(action)) res=await appendBalanceFootnote(res,command);
      return res;
    }

    // ─── QUEUE ENGINE ─────────────────────────────────────────
    let commandQueue = JSON.parse(localStorage.getItem(QUEUE_KEY))||[];
    let isProcessingQueue=false, isAwaitingInput=false;
    function saveQueue(){ localStorage.setItem(QUEUE_KEY,JSON.stringify(commandQueue)); }

    window.addEventListener("DOMContentLoaded",()=>{
      preloadCaches();
      commandQueue.forEach(item=>{
        const row=appendUserMessage(item.displayLabel,item.id);
        if (item.status==="interactive"&&item.interactiveData){
          updateBubbleStatus(row,"delivered");isAwaitingInput=true;toggleInput(true);
          renderInteractiveWidgets(item.interactiveData,item.id,item.originalMessage);
        } else updateBubbleStatus(row,item.status==="failed"?"failed":"queued");
      });
      if (commandQueue.length>0&&navigator.onLine) processQueue();
    });

    window.addEventListener("online",()=>{
      latencyBadge.textContent="Turbo Ready";connDot.style.background="var(--success-green)";connDot.style.boxShadow="0 0 6px var(--success-green)";
      if (commandQueue.length>0) processQueue();
    });
    window.addEventListener("offline",()=>{
      latencyBadge.textContent="Offline";connDot.style.background="var(--warning-color)";connDot.style.boxShadow="0 0 6px var(--warning-color)";
    });
    setInterval(()=>{if(commandQueue.length>0&&navigator.onLine&&!isProcessingQueue)processQueue();},2000);

    function enqueueCommand(payload,displayLabel){
      const id="txn_"+Date.now();
      commandQueue.push({id,payload,displayLabel,originalMessage:displayLabel,status:"queued",timestamp:Date.now()});
      saveQueue();
      updateBubbleStatus(appendUserMessage(displayLabel,id),"queued");
      processQueue();
    }

    const DIRECT_ACTIONS=new Set(["resolve_clarification","resolve_missing","resolve_customer_clarification","resolve_supplier_clarification","resolve_update_field","resolve_direct_update","add_new_product","update_price_direct","update_cost_direct","update_stock_direct","update_stock_add","add_to_khata"]);
    const NON_SAVING_LOGGED_ACTIONS=new Set(["report","product_report","stock","chat","customer_balance","all_balances","cash_balance","list_products","low_stock","add_new_product_form","update_price_request","update_cost_request","update_stock_request","expense_report","supplier_balance","all_supplier_balances","list_recent_transactions"]);

    // Runs a list of parsed commands (multi-action) one after another against a
    // LIVE, continuously-refreshed products snapshot so a later part always sees
    // stock/balance changes made by an earlier part in the same message. Stops
    // and surfaces an interactive widget the moment a part needs one; earlier
    // parts' results stay committed and their replies are already combined in.
    // remaining is the not-yet-run tail of parts (part 0 = the one to run now).
    // startIndex lets a resumed (post-clarification) call keep generating
    // unique per-part transaction ids instead of reusing an earlier part's id.
    async function runMultiCommand(remaining, txnId, origText, priorReplies, startIndex) {
      const replies = priorReplies || [];
      let idx = startIndex || 0;
      while (remaining.length) {
        const cmd = remaining[0];
        // Each part MUST get its own unique transaction id — reusing the queue
        // item's id across parts makes commitResult() think part 2+ is a
        // duplicate of part 1 (same Transactions/{id} key) and silently skip
        // saving it while reporting "already recorded".
        cmd.client_txn_id = `${txnId}_p${idx}`;
        cmd.user_text = origText;
        const products = await getProductsCached(); // re-read so earlier parts' stock/balance edits are visible
        const data = await executeCommand(cmd, products);

        const INTERACTIVE=new Set(["need_missing_resolution","need_clarification","need_customer_clarification","need_add_product_form","need_update_field_form","need_direct_update_confirmation"]);
        if (INTERACTIVE.has(data.type)) {
          // Pause here so the eventual resolve_* call can resume the loop with
          // the remaining parts intact. Carried on pending_context when that
          // exists (sale/return/customer flows); otherwise as top-level fields
          // (product field-update flows, which don't use pending_context).
          const carry = {__multi_remaining: remaining.slice(1), __multi_replies: replies, __multi_orig: origText, __multi_index: idx};
          if (data.pending_context) data.pending_context = {...data.pending_context, ...carry};
          else Object.assign(data, carry);
          return {ok:true, paused:true, data, replies};
        }

        if (data.ok&&(data.transaction||data.saved||NON_SAVING_LOGGED_ACTIONS.has(cmd.action))) {
          const ds=getTodayString();
          firebaseRequest(`ChatHistory/${ds}/${txnId}_p${idx}`,"PUT",{user:origText,ai:data.reply,timestamp:Date.now()}).catch(()=>{});
        }
        if (data.reply) replies.push(data.reply);
        remaining = remaining.slice(1);
        idx++;
      }
      return {ok:true, paused:false, replies};
    }

    function combineReplies(replies) {
      return replies.filter(Boolean).join("\n\n" + "─".repeat(18) + "\n\n");
    }

    async function processQueue(){
      if (isProcessingQueue||!navigator.onLine||commandQueue.length===0) return;
      const item=commandQueue[0];
      if (item.status==="interactive"){isAwaitingInput=true;return;}
      if (item.status==="failed"){
        item.retries=(item.retries||0)+1;
        if (item.retries>2){commandQueue.shift();saveQueue();await streamModelResponse("❌ Yeh command process nahi ho saki. Baraye meherbani dobara likhein.");return;}
      }
      isProcessingQueue=true;
      const bubble=document.getElementById(item.id);
      if (bubble) updateBubbleStatus(bubble,"sending");
      latencyBadge.textContent="Processing...";
      const shimmer=appendShimmer();setNetworkProgress(true);

      try {
        const payload={...item.payload,client_txn_id:item.id};
        const t0=performance.now();
        const products=await getProductsCached();
        let data;

        if (DIRECT_ACTIONS.has(payload.action)||payload.action?.startsWith("resolve_")) {
          // A resolve_* payload may be resuming a paused multi-command: if its
          // pending_context (or, for field-update flows, the payload itself)
          // carries __multi_remaining, continue the loop instead of treating
          // this as a single isolated action.
          const carrier = (payload.pending_context && Array.isArray(payload.pending_context.__multi_remaining)) ? payload.pending_context
                         : (Array.isArray(payload.__multi_remaining) ? payload : null);
          if (carrier) {
            const resumedRemaining = carrier.__multi_remaining;
            const priorReplies = carrier.__multi_replies || [];
            const origText = carrier.__multi_orig || item.originalMessage;
            const pausedIndex = Number(carrier.__multi_index||0);
            delete carrier.__multi_remaining; delete carrier.__multi_replies; delete carrier.__multi_orig; delete carrier.__multi_index;
            const stepRes = await executeCommand(payload, products); // resolves THIS part
            if (stepRes.reply) priorReplies.push(stepRes.reply);
            const rest = await runMultiCommand(resumedRemaining, item.id, origText, priorReplies, pausedIndex+1);
            if (rest.paused) { data = rest.data; }
            else { data = {ok:true, saved:true, reply: combineReplies(rest.replies)}; }
          } else {
            data=await executeCommand(payload,products);
            if (data.ok&&(data.transaction||data.saved||payload.action?.startsWith("resolve_")||payload.action==="add_new_product"||payload.action==="add_to_khata")) {
              const ds=getTodayString();
              firebaseRequest(`ChatHistory/${ds}/${item.id}`,"PUT",{user:item.originalMessage,ai:data.reply,timestamp:Date.now()}).catch(()=>{});
            }
          }
        } else {
          const msg=String(payload.message||"").replace(/(\d),(?=\d{3}(?!\d))/g,"$1").replace(/\s+/g," ").trim();
          const parts=await safeUnderstandCommand(msg,products);
          const run = await runMultiCommand(parts, item.id, item.originalMessage, []);
          if (run.paused) { data = run.data; }
          else { data = {ok:true, saved:true, reply: combineReplies(run.replies) || "Done."}; }
        }

        latencyBadge.textContent=`${Math.round(performance.now()-t0)}ms`;
        shimmer.remove();setNetworkProgress(false);

        const INTERACTIVE=new Set(["need_missing_resolution","need_clarification","need_customer_clarification","need_add_product_form","need_update_field_form","need_direct_update_confirmation"]);
        if (INTERACTIVE.has(data.type)) {
          item.status="interactive";item.interactiveData=data;saveQueue();
          isAwaitingInput=true;toggleInput(true);
          if (bubble) updateBubbleStatus(bubble,"delivered");
          renderInteractiveWidgets(data,item.id,item.originalMessage);
        } else {
          commandQueue.shift();saveQueue();isAwaitingInput=false;toggleInput(false);
          if (bubble) updateBubbleStatus(bubble,"delivered");
          await streamModelResponse(data.reply||"Done.");
        }
      } catch(err) {
        shimmer.remove();setNetworkProgress(false);latencyBadge.textContent="Error";
        item.status="failed";saveQueue();
        if (bubble) updateBubbleStatus(bubble,"failed");
        console.error(err);
      } finally {
        isProcessingQueue=false;
        setTimeout(()=>{if(commandQueue.length>0&&navigator.onLine)processQueue();},300);
      }
    }

    userInput.addEventListener("input",()=>{
      const v=userInput.value.trim();
      submitBtn.disabled=v.length===0;
      submitBtn.classList.toggle("active",v.length>0);
    });
    function toggleInput(disabled){userInput.disabled=disabled;userInput.placeholder=disabled?"Please respond to prompts...":"Type a sale, report, search, or chat...";}
    function disableAllPreviousActions(){document.querySelectorAll(".interactive-card button,.interactive-card input").forEach(el=>el.disabled=true);}
    function handleFormSubmit(e){
      e.preventDefault();const msg=userInput.value.trim();if(!msg)return;
      disableAllPreviousActions();userInput.value="";submitBtn.disabled=true;submitBtn.classList.remove("active");
      enqueueCommand({message:msg},msg);
    }

    // ─── INTERACTIVE WIDGETS ──────────────────────────────────
    function renderInteractiveWidgets(data,qId,orig){
      if(data.type==="need_add_product_form")        renderAddProductForm(data,qId,orig);
      else if(data.type==="need_update_field_form")  renderUpdateFieldForm(data,qId,orig);
      else if(data.type==="need_direct_update_confirmation") renderDirectUpdateConfirmation(data,qId,orig);
      else if(data.type==="need_missing_resolution") renderMissingResolution(data,qId,orig);
      else if(data.type==="need_customer_clarification") renderCustomerClarification(data.reply,data.options,data.pending_context,qId,orig,!!data.is_supplier);
      else renderClarification(data.reply,data.options,data.pending_context,qId,orig);
    }

    function escapeHtml(str){const d=document.createElement("div");d.textContent=str;return d.innerHTML;}
    function quoteHtml(t){return t?`<div class="quote-block">Replying to: <i>"${escapeHtml(t)}"</i></div>`:""}

    // Shared cancel handler: drops the current interactive queue item, and if
    // it was mid multi-command, tells the user how many further instructions
    // in that same message were skipped (so nothing silently vanishes).
    function cancelInteractiveItem(qId, baseReply, remainingList) {
      disableAllPreviousActions();isAwaitingInput=false;toggleInput(false);
      commandQueue.shift();saveQueue();
      appendUserMessage("Cancel",qId);
      let reply=baseReply;
      if (Array.isArray(remainingList)&&remainingList.length>0) reply+=`\n⚠️ Ismein baaqi ${remainingList.length} agla instruction bhi skip ho gaya hai — agar zaroorat ho to alag se dobara bhej dein.`;
      streamModelResponse(reply);
    }

    function renderAddProductForm(data,qId,orig){
      const row=document.createElement("div");row.className="message-row model";
      row.innerHTML=`${AVATAR_HTML}<div class="content-block">${quoteHtml(orig)}<div>${escapeHtml(data.reply)}</div><div class="interactive-card"><div class="manual-price-box" id="apfBox"></div></div></div>`;
      const box=row.querySelector("#apfBox");
      box.innerHTML=`
        <div class="manual-item-row"><span class="manual-item-name">Product Name</span><input type="text" id="apfName" class="manual-input" style="text-align:left" placeholder="Naam" required/></div>
        <div class="manual-item-row"><span class="manual-item-name">Cost Price (Rs)</span><input type="number" id="apfCost" class="manual-input" placeholder="0" min="0"/></div>
        <div class="manual-item-row"><span class="manual-item-name">Sale Price (Rs)</span><input type="number" id="apfPrice" class="manual-input" placeholder="0" min="0" required/></div>
        <div class="manual-item-row"><span class="manual-item-name">Initial Stock</span><input type="number" id="apfStock" class="manual-input" placeholder="0" min="0"/></div>
        <div class="manual-item-row"><span class="manual-item-name">Unit (kg/pcs/pkt)</span><input type="text" id="apfUnit" class="manual-input" style="text-align:left" value="pcs"/></div>
        <div class="form-btn-group">
          <button type="button" class="cancel-form-btn" id="apfCancel">Cancel</button>
          <button type="button" class="submit-prices-btn" id="apfSubmit">Add Product</button>
        </div>`;
      box.querySelector("#apfCancel").onclick=()=>cancelInteractiveItem(qId,"🚫 Product creation cancelled.",data.__multi_remaining);
      box.querySelector("#apfSubmit").onclick=()=>{
        const name=box.querySelector("#apfName").value.trim();
        const price=Number(box.querySelector("#apfPrice").value);
        if (!name||!price){alert("Product Name aur Sale Price dena lazmi hai!");return;}
        const cost=Number(box.querySelector("#apfCost").value||0);
        const stock=Number(box.querySelector("#apfStock").value||0);
        const unit=box.querySelector("#apfUnit").value.trim()||"pcs";
        disableAllPreviousActions();isAwaitingInput=false;toggleInput(false);
        const qi=commandQueue.find(q=>q.id===qId);
        if (qi){qi.id=qi.id+"_ap_"+Date.now();qi.payload={action:"add_new_product",product:name,price,cost,stock,unit};qi.displayLabel=`Added:${name}`;qi.status="queued";delete qi.interactiveData;saveQueue();updateBubbleStatus(appendUserMessage(qi.displayLabel,qi.id),"queued");processQueue();}
      };
      chatFeed.appendChild(row);scrollBottom();
    }

    function renderUpdateFieldForm(data,qId,orig){
      const row=document.createElement("div");row.className="message-row model";
      row.innerHTML=`${AVATAR_HTML}<div class="content-block">${quoteHtml(orig)}<div>${escapeHtml(data.reply)}</div><div class="interactive-card"><div class="manual-price-box" id="uffBox"></div></div></div>`;
      const box=row.querySelector("#uffBox");
      box.innerHTML=`
        <div class="manual-item-row"><span class="manual-item-name">New Value:</span><input type="number" id="uffVal" class="manual-input" placeholder="New amount" required/></div>
        <div class="form-btn-group">
          <button type="button" class="cancel-form-btn" id="uffCancel">Cancel</button>
          <button type="button" class="submit-prices-btn" id="uffSubmit">Confirm & Update</button>
        </div>`;
      box.querySelector("#uffCancel").onclick=()=>cancelInteractiveItem(qId,"🚫 Update cancelled.",data.__multi_remaining);
      box.querySelector("#uffSubmit").onclick=()=>{
        const raw=box.querySelector("#uffVal").value,val=Number(raw);
        if (raw===""||!isFinite(val)){alert("Sahi value enter karein!");return;}
        disableAllPreviousActions();isAwaitingInput=false;toggleInput(false);
        const qi=commandQueue.find(q=>q.id===qId);
        if (qi){qi.id=qi.id+"_uf_"+Date.now();qi.payload={action:"resolve_update_field",product_key:data.product_key,product_name:data.product_name,field:data.field,value:val,__multi_remaining:data.__multi_remaining,__multi_replies:data.__multi_replies,__multi_orig:data.__multi_orig};qi.displayLabel=`Update ${data.product_name} → ${val}`;qi.status="queued";delete qi.interactiveData;saveQueue();updateBubbleStatus(appendUserMessage(qi.displayLabel,qi.id),"queued");processQueue();}
      };
      chatFeed.appendChild(row);scrollBottom();
    }

    function renderDirectUpdateConfirmation(data,qId,orig){
      const row=document.createElement("div");row.className="message-row model";
      row.innerHTML=`${AVATAR_HTML}<div class="content-block">${quoteHtml(orig)}<div>${escapeHtml(data.reply)}</div><div class="interactive-card actions-grid" id="ducGrid"></div></div>`;
      const grid=row.querySelector("#ducGrid");
      const cancelBtn=document.createElement("button");cancelBtn.className="option-chip cancel-chip";cancelBtn.textContent="❌ Cancel";
      cancelBtn.onclick=()=>cancelInteractiveItem(qId,"🚫 Update cancelled.",data.__multi_remaining);
      const okBtn=document.createElement("button");okBtn.className="option-chip";okBtn.style.borderColor="var(--success-green)";okBtn.textContent="✅ Ok, Update karo";
      okBtn.onclick=()=>{
        disableAllPreviousActions();isAwaitingInput=false;toggleInput(false);
        const qi=commandQueue.find(q=>q.id===qId);
        if(qi){qi.id=qi.id+"_dc_"+Date.now();qi.payload={action:"resolve_direct_update",product_key:data.product_key,product_name:data.product_name,field:data.field,value:data.value,__multi_remaining:data.__multi_remaining,__multi_replies:data.__multi_replies,__multi_orig:data.__multi_orig};qi.displayLabel=`Confirm update: ${data.product_name}`;qi.status="queued";delete qi.interactiveData;saveQueue();updateBubbleStatus(appendUserMessage(qi.displayLabel,qi.id),"queued");processQueue();}
      };
      grid.appendChild(cancelBtn);grid.appendChild(okBtn);
      chatFeed.appendChild(row);scrollBottom();
    }

    function handleCustomerSelection(name,key,ctx,qId,isSupplier){
      disableAllPreviousActions();isAwaitingInput=false;toggleInput(false);
      const qi=commandQueue.find(q=>q.id===qId);
      if(qi){qi.id=qi.id+"_cr_"+Date.now();qi.payload={action:isSupplier?"resolve_supplier_clarification":"resolve_customer_clarification",selected_customer:name,selected_customer_key:key||"",pending_context:ctx};qi.displayLabel=`Selected ${isSupplier?"Supplier":"Khata"}:${name}`;qi.status="queued";delete qi.interactiveData;saveQueue();updateBubbleStatus(appendUserMessage(qi.displayLabel,qi.id),"queued");processQueue();}
    }

    function renderCustomerClarification(msg,options,ctx,qId,orig,isSupplier){
      const row=document.createElement("div");row.className="message-row model";
      row.innerHTML=`${AVATAR_HTML}<div class="content-block">${quoteHtml(orig)}<div>${escapeHtml(msg)}</div><div class="interactive-card actions-grid"></div></div>`;
      const grid=row.querySelector(".actions-grid");
      const nameField=isSupplier?ctx.supplier:ctx.customer;
      (options||[]).forEach(opt=>{
        const chip=document.createElement("button");chip.className="option-chip";
        chip.innerHTML=`<span>${isSupplier?"🏭":"👤"} ${escapeHtml(opt.name)}</span>`;
        chip.onclick=()=>handleCustomerSelection(opt.name,opt.key,ctx,qId,isSupplier);
        grid.appendChild(chip);
      });
      const newChip=document.createElement("button");newChip.className="option-chip";newChip.style.borderColor="var(--success-green)";
      newChip.innerHTML=`<span>➕ Naya ${isSupplier?"Supplier":"Khata"}: "${escapeHtml(nameField)}"</span>`;
      newChip.onclick=()=>handleCustomerSelection(nameField,"",ctx,qId,isSupplier);
      grid.appendChild(newChip);
      const cancelChip=document.createElement("button");cancelChip.className="option-chip cancel-chip";cancelChip.textContent="❌ Cancel";
      cancelChip.onclick=()=>cancelInteractiveItem(qId,"🚫 Cancel kar diya.",ctx&&ctx.__multi_remaining);
      grid.appendChild(cancelChip);
      chatFeed.appendChild(row);scrollBottom();
    }

    function handleDisambiguationSelection(key,name,ctx,qId){
      disableAllPreviousActions();isAwaitingInput=false;toggleInput(false);
      const qi=commandQueue.find(q=>q.id===qId);
      if(qi){qi.id=qi.id+"_res_"+Date.now();qi.payload={action:"resolve_clarification",selected_product_key:key,selected_product:name,pending_context:ctx};qi.displayLabel=`Selected:${name}`;qi.status="queued";delete qi.interactiveData;saveQueue();updateBubbleStatus(appendUserMessage(qi.displayLabel,qi.id),"queued");processQueue();}
    }

    function renderClarification(msg,options,ctx,qId,orig){
      const row=document.createElement("div");row.className="message-row model";
      row.innerHTML=`${AVATAR_HTML}<div class="content-block">${quoteHtml(orig)}<div>${escapeHtml(msg)}</div><div class="interactive-card actions-grid"></div></div>`;
      const grid=row.querySelector(".actions-grid");
      (options||[]).forEach(opt=>{
        const chip=document.createElement("button");chip.className="option-chip";
        chip.innerHTML=`<span>${escapeHtml(opt.name)}</span><span class="chip-meta">Rs ${opt.price} | Stock:${opt.stock}</span>`;
        chip.onclick=()=>handleDisambiguationSelection(opt.key,opt.name,ctx,qId);
        grid.appendChild(chip);
      });
      chatFeed.appendChild(row);scrollBottom();
    }

    function handleMissingResolution(decision,bundle,qId){
      disableAllPreviousActions();isAwaitingInput=false;toggleInput(false);
      const label=decision==="skip"?"Skip Missing & Continue":decision==="manual"?"Apply Manual Prices":"Cancel Transaction";
      const qi=commandQueue.find(q=>q.id===qId);
      if(qi){qi.id=qi.id+"_mr_"+Date.now();qi.payload={action:"resolve_missing",decision,missing_indices:bundle.missingIndices,manual_prices:bundle.manualPrices||{},pending_context:bundle.pendingContext};qi.displayLabel=label;qi.status="queued";delete qi.interactiveData;saveQueue();updateBubbleStatus(appendUserMessage(label,qi.id),"queued");processQueue();}
    }

    function renderMissingResolution(data,qId,orig){
      const row=document.createElement("div");row.className="message-row model";
      row.innerHTML=`${AVATAR_HTML}<div class="content-block">${quoteHtml(orig)}<div>${escapeHtml(data.reply)}</div><div class="interactive-card"><div class="actions-grid" id="mrGrid"></div><div id="mrManual" style="display:none"></div></div></div>`;
      const grid=row.querySelector("#mrGrid"),manualBox=row.querySelector("#mrManual");
      const missingIdx=(data.missing_items||[]).map(m=>Number(m.index));

      const skipBtn=document.createElement("button");skipBtn.className="option-chip";skipBtn.textContent="Skip Missing & Continue";skipBtn.onclick=()=>handleMissingResolution("skip",{missingIndices:missingIdx,pendingContext:data.pending_context},qId);grid.appendChild(skipBtn);
      const manBtn=document.createElement("button");manBtn.className="option-chip";manBtn.textContent="Enter Manual Price";manBtn.onclick=()=>{grid.style.display="none";manualBox.style.display="block";scrollBottom();};grid.appendChild(manBtn);
      const canBtn=document.createElement("button");canBtn.className="option-chip cancel-chip";canBtn.textContent="Cancel Transaction";canBtn.onclick=()=>handleMissingResolution("cancel",{missingIndices:missingIdx,pendingContext:data.pending_context},qId);grid.appendChild(canBtn);

      const form=document.createElement("div");form.className="manual-price-box";
      form.innerHTML=`<div style="font-size:.8rem;color:var(--text-muted)">Missing items ki sale price likhein:</div>`;
      const inputMap={};
      (data.missing_items||[]).forEach(item=>{
        const line=document.createElement("div");line.className="manual-item-row";
        line.innerHTML=`<span class="manual-item-name">${escapeHtml(item.product)} (${item.qty||1}x)</span><input type="number" class="manual-input" placeholder="Price (Rs)" min="1" step="any" required/>`;
        inputMap[Number(item.index)]=line.querySelector("input");form.appendChild(line);
      });
      const btnRow=document.createElement("div");btnRow.className="form-btn-group";
      const backBtn=document.createElement("button");backBtn.type="button";backBtn.className="cancel-form-btn";backBtn.textContent="◀ Back";
      backBtn.onclick=()=>{manualBox.style.display="none";grid.style.display="flex";scrollBottom();};
      const cancelManualBtn=document.createElement("button");cancelManualBtn.type="button";cancelManualBtn.className="cancel-form-btn";cancelManualBtn.textContent="🚫 Cancel";
      cancelManualBtn.onclick=()=>handleMissingResolution("cancel",{missingIndices:missingIdx,pendingContext:data.pending_context},qId);
      const confBtn=document.createElement("button");confBtn.className="submit-prices-btn";confBtn.textContent="Confirm & Proceed";
      confBtn.onclick=()=>{
        const mp={};let valid=true;
        for (const idx of missingIdx){const v=Number(inputMap[idx].value);if(!v||v<=0){inputMap[idx].style.borderColor="var(--danger-color)";valid=false;}else{inputMap[idx].style.borderColor="var(--border-subtle)";mp[idx]=v;}}
        if(valid)handleMissingResolution("manual",{missingIndices:missingIdx,manualPrices:mp,pendingContext:data.pending_context},qId);
      };
      btnRow.appendChild(backBtn);btnRow.appendChild(cancelManualBtn);btnRow.appendChild(confBtn);
      form.appendChild(btnRow);manualBox.appendChild(form);chatFeed.appendChild(row);scrollBottom();
    }

    // ─── UI HELPERS ───────────────────────────────────────────
    function appendUserMessage(text,id){
      const row=document.createElement("div");row.className="message-row user";if(id)row.id=id;
      const time=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
      row.innerHTML=`<div class="content-block"><div>${escapeHtml(text)}</div><div class="msg-meta"><span>${time}</span><span class="status-tick"></span></div></div>`;
      chatFeed.appendChild(row);scrollBottom();return row;
    }
    function updateBubbleStatus(el,status){
      if (!el) return;const tick=el.querySelector(".status-tick");
      if (status==="queued") tick.innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" fill="var(--text-muted)"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>`;
      else if(status==="sending") tick.innerHTML='<div class="mini-spinner"></div>';
      else if(status==="delivered") tick.innerHTML=`<svg width="15" height="15" viewBox="0 0 24 24" fill="var(--accent-blue)"><path d="M18 7l-1.41-1.41-6.34 6.34 1.41 1.41L18 7zm4.24-1.41L11.66 16.17 7.41 11.93l-1.41 1.41 5.66 5.66 12-12-1.42-1.41zM.41 13.34l5.66 5.66 1.41-1.41-5.66-5.66-1.41 1.41z"/></svg>`;
      else if(status==="failed") tick.innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" fill="var(--danger-color)"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>`;
    }
    function appendShimmer(){
      const row=document.createElement("div");row.className="message-row model";
      row.innerHTML=`${AVATAR_HTML}<div class="shimmer-container"><div class="shimmer-line"></div><div class="shimmer-line short"></div></div>`;
      chatFeed.appendChild(row);scrollBottom();return row;
    }
    async function streamModelResponse(fullText){
      const row=document.createElement("div");row.className="message-row model";
      row.innerHTML=`${AVATAR_HTML}<div class="content-block"></div>`;
      chatFeed.appendChild(row);
      const block=row.querySelector(".content-block");
      for (const chunk of fullText.split(/(\n+)/)){block.textContent+=chunk;scrollBottom();if(chunk.trim().length>0)await new Promise(r=>setTimeout(r,4));}
    }
    function setNetworkProgress(active){networkBar.classList.toggle("active",active);}
    function scrollBottom(){chatFeed.scrollTop=chatFeed.scrollHeight;}
  </script>
</body>
</html>
